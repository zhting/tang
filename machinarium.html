<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>《机械迷城》1:1 终极完全体独立离线保全拯救工程 - 大集合版</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #060403;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden; font-family: sans-serif; color: #8e7960; user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            position: relative; box-shadow: 0 0 80px rgba(0, 0, 0, 1);
            border: 6px solid #1c140d; background: #0f0a06;
            max-width: 100%;
        }
        canvas {
            display: block;
            filter: contrast(1.25) brightness(0.76) saturate(0.65) sepia(0.24);
            max-width: 100%;
            height: auto;
        }
        #module-menu {
            margin-top: 10px; display: flex; gap: 6px; justify-content: center; max-width: 1024px; flex-wrap: wrap;
            padding: 0 10px;
        }
        .m-btn {
            background: #261a11; border: 2px solid #3d2b1c; color: #9c856b;
            padding: 5px 10px; cursor: pointer; font-weight: bold; font-size: 11px;
            border-radius: 2px; transition: all 0.2s; text-decoration: none;
        }
        .m-btn:hover, .m-btn.active {
            background: #3d2b1c; color: #fae0c2; border-color: #c48c4d;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1024" height="576"></canvas>
</div>
<div id="module-menu">
    <button class="m-btn active" id="btn-menu" onclick="switchScene('menu')">🏠 0. 首页菜单 (飞虫AI/大标题)</button>
    <button class="m-btn" id="btn-junkyard" onclick="switchScene('junkyard')">🔧 1. 垃圾场 (组装/踢桶多段回弹/绳荡)</button>
    <button class="m-btn" id="btn-pole" onclick="switchScene('pole')">⚡ 2. 电线杆 (长高限制/九宫格/电击坠猫)</button>
    <button class="m-btn" id="btn-bird" onclick="switchScene('bird')">🦅 3. 鸟与方块 (贪吃鸟俯冲AI/卡扣松脱下落)</button>
    <button class="m-btn" id="btn-band" onclick="switchScene('band')">🎷 4. 流浪歌手 (萨克斯/铁桶/吉他合奏乐谱)</button>
    <button class="m-btn" id="btn-gomoku" onclick="switchScene('gomoku')">🏁 5. 酒馆棋盘 (螺丝对战齿轮独立卡位AI)</button>
    <button class="m-btn" id="btn-bubble" onclick="switchScene('bubble')">💭 6. 思维气泡 (全场景自适应发呆连环画)</button>
    <button class="m-btn" id="btn-plug" onclick="switchScene('plug')">🧠 7. 博士插销 (最终脑部红绿矩阵解密)</button>
    <button class="m-btn" id="btn-shoot" onclick="switchScene('shoot')">🎮 8. 街机打枪 (动态走道地图/飞虫防线弹幕)</button>
    <button class="m-btn" id="btn-doctor_lore" onclick="switchScene('doctor_lore')">🎬 9. 博士讲述 (真空管发光/老胶片颤抖剧情)</button>
    <button class="m-btn" id="btn-spider" onclick="triggerSpiderGame()">🕷️ 10. 蜘蛛射击 (通关秘籍专属小游戏)</button>
    <a href="index.html" class="m-btn" style="background:#3d2416; color:#ffcc80;">⬅️ 返回积木小院</a>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ==========================================
// 🔊 WEB AUDIO API 多声轨同步合成与环境音网络
// ==========================================
let audioCtx = null;
let ambientWind = null;
let industryBuzz = null;

function initAudioEngine() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    try {
        let bufSize = 2 * audioCtx.sampleRate, buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate), out = buf.getChannelData(0);
        let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
        for (let i = 0; i < bufSize; i++) {
            let white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179; b1 = 0.99332 * b1 + white * 0.0750759; b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856; b4 = 0.55000 * b4 + white * 0.5329522; b5 = -0.7616 * b5 - white * 0.0168980;
            out[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362; out[i] *= 0.12; b6 = white * 0.115926;
        }
        let src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
        let lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(140, audioCtx.currentTime);
        let gn = audioCtx.createGain(); gn.gain.setValueAtTime(0.2, audioCtx.currentTime);
        src.connect(lp); lp.connect(gn); gn.connect(audioCtx.destination); src.start(); ambientWind = src;
    } catch(e) {}
}

function playActionSound(type, vol=1.0, pitch=1.0) {
    if (!audioCtx) return;
    try {
        let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
        if (type === 'thud') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(115*pitch, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.22);
            gain.gain.setValueAtTime(vol * 0.35, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
        } else if (type === 'step') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(340, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(95, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(vol * 0.03, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        } else if (type === 'hydraulic') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(85, audioCtx.currentTime);
            let filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(200, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol * 0.015, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
            osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.16); return;
        } else if (type === 'buzz') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800 + (Math.random()-0.5)*150, audioCtx.currentTime);
            let hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.setValueAtTime(1100, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol * 0.01, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(hp); hp.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.04); return;
        } else if (type === 'laser') {
            osc.type = 'square'; osc.frequency.setValueAtTime(450 * pitch, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(vol * 0.03, audioCtx.currentTime);
        } else if (type === 'pop') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(300 * pitch, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(vol * 0.18, audioCtx.currentTime);
        } else if (type === 'shock') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(700, audioCtx.currentTime); gain.gain.setValueAtTime(vol * 0.08, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        } else if (type === 'page') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(90, audioCtx.currentTime); gain.gain.setValueAtTime(vol * 0.1, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        } else if (type === 'sax') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
            let lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(450, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04*vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
            osc.connect(lp); lp.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.35); return;
        } else if (type === 'guitar') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08*vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        }
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    } catch(e) {}
}

function toggleIndustryBuzz(enable) {
    if(!audioCtx) return;
    if(enable && !industryBuzz) {
        try {
            let osc = audioCtx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(50, audioCtx.currentTime);
            let lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(100, audioCtx.currentTime);
            let gn = audioCtx.createGain(); gn.gain.setValueAtTime(0.06, audioCtx.currentTime);
            osc.connect(lp); lp.connect(gn); gn.connect(audioCtx.destination); osc.start(); industryBuzz = {o:osc, g:gn};
        } catch(e) {}
    } else if(!enable && industryBuzz) { try { industryBuzz.o.stop(); } catch(e){} industryBuzz = null; }
}

// ==========================================
// 🎨 1:1 图片资产级手绘纸张与铁锈生成算法
// ==========================================
let paperPattern = null; let rustPattern = null;
function generateTextures() {
    let pCanvas = document.createElement('canvas'); pCanvas.width = 300; pCanvas.height = 300;
    let pCtx = pCanvas.getContext('2d'); pCtx.fillStyle = '#211710'; pCtx.fillRect(0,0,300,300);
    for(let i=0; i<25000; i++) {
        pCtx.fillStyle = `rgba(0,0,0,${Math.random()*0.09})`;
        if(Math.random()<0.5) pCtx.fillRect(Math.random()*300, Math.random()*300, Math.random()*3+1, 1);
        else pCtx.fillRect(Math.random()*300, Math.random()*300, 1, Math.random()*3+1);
    }
    paperPattern = ctx.createPattern(pCanvas, 'repeat');

    let rCanvas = document.createElement('canvas'); rCanvas.width = 128; rCanvas.height = 128;
    let rCtx = rCanvas.getContext('2d'); rCtx.fillStyle = '#7a6650'; rCtx.fillRect(0,0,128,128);
    for(let i=0; i<350; i++) {
        let x=Math.random()*128, y=Math.random()*128, r=Math.random()*6+1;
        let g = rCtx.createRadialGradient(x,y,0, x,y,r); g.addColorStop(0,'rgba(84,36,15,0.55)'); g.addColorStop(1,'rgba(0,0,0,0)');
        rCtx.fillStyle = g; rCtx.beginPath(); rCtx.arc(x,y,r,0,Math.PI*2); rCtx.fill();
    }
    rustPattern = ctx.createPattern(rCanvas, 'repeat');
}

function drawWobblyLine(pts, close=false) {
    ctx.beginPath();
    for(let i=0; i<pts.length; i++) {
        let devX = (Math.random()-0.5)*1.4; let devY = (Math.random()-0.5)*1.4;
        if(i===0) ctx.moveTo(pts[i].x+devX, pts[i].y+devY); else ctx.lineTo(pts[i].x+devX, pts[i].y+devY);
    }
    if(close) ctx.closePath(); ctx.stroke();
}

// ==========================================
// ⚙️ 全局核心状态机与物理属性树
// ==========================================
const core = {
    scene: 'menu',
    inventory: { openY: -62, targetY: -62, items: [], selected: null },
    ui: { bulb: { x: 920, y: 15, r: 18, active: false, timer: 0 }, book: { x: 965, y: 12, w: 34, h: 28, state: 'closed' } },
    menuFlies: [
        { x: 320, y: 160, homeX: 320, homeY: 160, vx: 0, vy: 0, state: 'idle', energy: 0, t: 0 },
        { x: 512, y: 350, homeX: 512, homeY: 350, vx: 0, vy: 0, state: 'idle', energy: 0, t: 10 },
        { x: 680, y: 460, homeX: 680, homeY: 460, vx: 0, vy: 0, state: 'idle', energy: 0, t: 20 }
    ],
    josef: { x: 200, y: 445, targetX: 200, height: 80, baseHeight: 80, mode: 'normal', speed: 2.3, stepT: 0, kickCooldown: 0, isAssembled: false, isSwinging: false, swingP: 0, isDone: false, isShocked: false, shockTimer: 0 },
    junkyard: {
        bathtub: { x: 130, y: 400, w: 100, h: 50, searched: false }, torso: { x: 160, y: 425, w: 30, h: 25, collected: false },
        wire: { x: 550, y: 440, w: 35, h: 30, collected: false }, magnet: { x: 800, y: 440, w: 25, h: 25, collected: false, visible: false },
        pole: { x: 60, y: 250, w: 20, h: 200, bent: false }, drum: { x: 720, y: 445, w: 36, h: 50, vx: 0, rot: 0, wobble: 0 }
    },
    poleScene: { panelOpen: false, grid: [1, 0, 2, 3, 5, 4, 6, 7, 8], solved: false, cat: { y: 100, fallY: 100, shocked: false, dead: false } },
    birdScene: { bird: { x: 740, y: 90, status: 'idle', tBlock: null, p: 0 }, blocks: [ {x:630, y:300, w:32, h:32, lit:false, fall:false, vy:0}, {x:720, y:300, w:32, h:32, lit:false, fall:false, vy:0} ] },
    gomoku: { board: Array(12).fill().map(()=>Array(12).fill(0)), playerTurn: true, winner: null },
    bubbleLevel: 'junkyard',
    plugGame: {
        nodes: [
            { x: 420, y: 200, state: 'green', target: 'green' }, { x: 520, y: 200, state: 'red', target: 'green' }, { x: 620, y: 200, state: 'red', target: 'red' },
            { x: 420, y: 300, state: 'red', target: 'green' },   { x: 520, y: 300, state: 'green', target: 'red' }, { x: 620, y: 300, state: 'green', target: 'red' },
            { x: 420, y: 400, state: 'green', target: 'red' }, { x: 520, y: 400, state: 'red', target: 'green' }, { x: 620, y: 400, state: 'green', target: 'green' }
        ],
        lines: [[0,1],[1,2],[3,4],[4,5],[6,7],[7,8],[0,3],[1,4],[2,5],[3,6],[4,7],[5,8]],
        selected: null, solved: false
    },
    shootGame: { px: 420, py: 420, mazeX: 362, mazeY: 100, mw: 300, mh: 350, keyCollected: false, flies: [] },
    spiderGame: { level: 1, player: { x: 512, y: 288, r: 12, speed: 4.5 }, bullets: [], spiders: [], spawnT: 0, required: 10, kills: 0, over: false },
    movieFrame: 0, movieChapter: 0,
    mouse: { x: 0, y: 0, hover: null }
};

// ==========================================
// 🎨 各模块画布图层高保真重绘管线
// ==========================================
function drawBaseWorld() {
    ctx.fillStyle = paperPattern; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#110b07'; ctx.fillRect(0,480,canvas.width,96);
    ctx.strokeStyle = '#24170e'; ctx.lineWidth = 4; drawWobblyLine([{x:0,y:480}, {x:1024,y:480}]);
}

function drawMenuScene() {
    ctx.fillStyle = paperPattern; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = '#140d08'; ctx.lineWidth = 3; drawWobblyLine([{x:60,y:0},{x:60,y:576}]); drawWobblyLine([{x:964,y:0},{x:964,y:576}]);
    ctx.fillStyle = '#b39674'; ctx.font = 'bold 54px Courier New'; ctx.letterSpacing = "6px"; ctx.fillText("MACHINARIUM", 315, 160);
    ctx.strokeStyle = '#423324'; ctx.lineWidth = 2.5; drawWobblyLine([{x:300,y:185},{x:730,y:185}]);
    ctx.fillStyle = '#261b12'; ctx.strokeStyle = '#4a3625'; ctx.fillRect(387,310,250,42); ctx.strokeRect(387,310,250,42);
    ctx.fillStyle = '#8a7761'; ctx.font = 'bold 12px monospace'; ctx.fillText("START GAME (请点击下方切换按钮体验模块)", 392, 336);

    core.menuFlies.forEach(fly => {
        ctx.save(); ctx.translate(fly.x, fly.y);
        let flap = fly.state === 'flying' ? Math.sin(Date.now() * 0.14) * 12 : Math.sin(Date.now() * 0.005 + fly.t) * 2;
        ctx.strokeStyle = '#382b1d'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-2,0); ctx.lineTo(-6,4); ctx.moveTo(2,0); ctx.lineTo(6,4); ctx.stroke();
        ctx.fillStyle = '#21150e'; ctx.beginPath(); ctx.ellipse(0,0,5,3,0,0,Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(217,186,147,0.45)'; ctx.strokeStyle = 'rgba(40,28,17,0.7)';
        ctx.save(); ctx.rotate(-Math.PI/4 - flap * 0.04); ctx.beginPath(); ctx.ellipse(-6,-4,7,2.5,0,0,Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
        ctx.save(); ctx.rotate(Math.PI/4 + flap * 0.04); ctx.beginPath(); ctx.ellipse(6,-4,7,2.5,0,0,Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
        ctx.restore();
    });
}

function drawJosef() {
    if (core.josef.isDone || core.scene === 'menu' || core.scene === 'doctor_lore') return;
    if (core.josef.isSwinging) {
        let p = core.josef.swingP, sa = -Math.PI/3 + Math.sin(p * Math.PI) * (Math.PI/1.5);
        ctx.save(); ctx.translate(core.junkyard.pole.x + 15, core.junkyard.pole.y + 55); ctx.rotate(sa);
        ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,160); ctx.stroke();
        ctx.translate(0,160); ctx.fillStyle = '#8c775e'; ctx.fillRect(-15,-40,30,40); ctx.translate(0,-55); drawJosefHead(); ctx.restore(); return;
    }
    if (!core.josef.isAssembled) { ctx.save(); ctx.translate(320, 465); drawJosefHead(); ctx.restore(); return; }
    let th = core.josef.baseHeight; if(core.josef.mode==='tall') th = 135; if(core.josef.mode==='short') th = 46;
    let oldH = core.josef.height || 80; core.josef.height += (th - oldH) * 0.15;
    ctx.save(); ctx.translate(core.josef.x, core.josef.y);
    if(core.josef.isShocked) {
        ctx.translate((Math.random()-0.5)*9, (Math.random()-0.5)*9); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
        for(let i=0; i<4; i++) { ctx.beginPath(); ctx.moveTo(0,-40); ctx.lineTo((Math.random()-0.5)*60, -40+(Math.random()-0.5)*60); ctx.stroke(); }
    }
    let swing = (core.josef.x !== core.josef.targetX) ? Math.sin(Date.now() * 0.016) * 13 : 0;
    ctx.strokeStyle = '#382a1c'; ctx.lineWidth = 4; drawWobblyLine([{x:-10,y:0},{x:-10+swing,y:35}]); drawWobblyLine([{x:10,y:0},{x:10-swing,y:35}]);
    ctx.fillStyle = rustPattern; ctx.strokeStyle = '#1a110a'; ctx.lineWidth = 3; ctx.fillRect(-16, -core.josef.height, 32, core.josef.height); ctx.strokeRect(-16, -core.josef.height, 32, core.josef.height);
    ctx.translate(0, -core.josef.height - 14); drawJosefHead(); ctx.restore();
}

function drawJosefHead() {
    ctx.fillStyle = '#99846d'; ctx.strokeStyle = '#1a110a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0,0,15,Math.PI,0); ctx.lineTo(12,14); ctx.lineTo(-12,14); ctx.closePath(); ctx.fill(); ctx.stroke();
    let eyeX = Math.sin(Date.now() * 0.002) * 1.5; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-5,2,4,0,Math.PI * 2); ctx.arc(5,2,4,0,Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-5+eyeX,2,1.5,0,Math.PI * 2); ctx.arc(5+eyeX,2,1.5,0,Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1a110a'; ctx.lineWidth = 2; drawWobblyLine([{x:0,y:-15},{x:0,y:-26}]);
    ctx.fillStyle = core.josef.isShocked ? '#fff' : '#b8341d'; ctx.beginPath(); ctx.arc(0,-26,3,0,Math.PI * 2); ctx.fill();
}

function drawJunkyardScene() {
    let j = core.junkyard; ctx.strokeStyle = '#423322'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(j.pole.x, 480);
    if(j.pole.bent) { ctx.lineTo(j.pole.x, j.pole.y+40); ctx.arc(j.pole.x+15, j.pole.y+40, 15, Math.PI, Math.PI * 0.5, true); } else { ctx.lineTo(j.pole.x, j.pole.y); } ctx.stroke();
    if(!j.bathtub.searched) { ctx.fillStyle = '#423629'; ctx.strokeStyle = '#1c140e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(j.bathtub.x+50, j.bathtub.y+25, 50, 25, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    if(j.bathtub.searched && !j.torso.collected) { ctx.fillStyle = '#7a6753'; ctx.fillRect(j.torso.x, j.torso.y, j.torso.w, j.torso.h); }
    if(j.magnet.visible && !j.magnet.collected) { ctx.fillStyle = '#8f2917'; ctx.fillRect(j.magnet.x, j.magnet.y, j.magnet.w, j.magnet.h); ctx.fillStyle = '#d1d1d1'; ctx.fillRect(j.magnet.x+14, j.magnet.y, 11, j.magnet.h); }
    if(!j.wire.collected) { ctx.strokeStyle = '#5e4e3d'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(j.wire.x+15, j.wire.y+15, 13, 0, Math.PI * 2); ctx.stroke(); }
    let d = j.drum; ctx.save(); ctx.translate(d.x+18, d.y+50); if(d.wobble>0) ctx.rotate(Math.sin(d.wobble * 0.6) * 0.15); else ctx.rotate(d.rot);
    ctx.fillStyle = rustPattern; ctx.strokeStyle = '#1a100a'; ctx.lineWidth = 3; ctx.fillRect(-18,-50,36,50); ctx.strokeRect(-18,-50,36,50); ctx.restore();
}

function drawPoleScene() {
    let ps = core.poleScene; ctx.fillStyle = '#3a2b1d'; ctx.fillRect(490, 80, 20, 400);

function drawGomokuScene() {
    let bx = 332, by = 48, bs = 400, cs = 400 / 11;
    ctx.fillStyle = '#5c4530'; ctx.strokeStyle = '#2b1b11'; ctx.lineWidth = 5; ctx.fillRect(bx, by, bs, bs); ctx.strokeRect(bx, by, bs, bs);
    ctx.strokeStyle = '#382618'; ctx.lineWidth = 1.5;
    for(let i=0; i<12; i++) {
        ctx.beginPath(); ctx.moveTo(bx + i * cs, by); ctx.lineTo(bx + i * cs, by + bs); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx, by + i * cs); ctx.lineTo(bx + bs, by + i * cs); ctx.stroke();
    }
    for(let r=0; r<12; r++) {
        for(let c=0; c<12; c++) {
            let val = core.gomoku.board[r][c];
            if(val === 1) { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(bx + c * cs, by + r * cs, 11, 0, Math.PI * 2); ctx.fill(); }
            else if(val === 2) { ctx.fillStyle = '#e8d9c7'; ctx.beginPath(); ctx.arc(bx + c * cs, by + r * cs, 11, 0, Math.PI * 2); ctx.fill(); }
        }
    }
    ctx.fillStyle = '#a89176'; ctx.font = '13px monospace'; ctx.fillText("🚬 老烟枪正在盯着你落子... (黑螺丝钉 VS 白齿轮)", 50, 140);
    if(core.gomoku.winner) ctx.fillText(core.gomoku.winner==='player'?"🎉 你赢了！":"❌ 你输了！", 50, 200);
}

// ==========================================
// ⚙️ 核心 AI 与多波次联动更新算法
// ==========================================
function update() {
    initAudioEngine(); toggleIndustryBuzz(core.scene === 'pole' && !core.poleScene.solved);
    if(core.mouse.y < 65) core.inventory.targetY = 0; else core.inventory.targetY = -62;
    if (core.scene === 'menu') {
        core.menuFlies.forEach(fly => {
            if (fly.state === 'idle') {
                fly.x = fly.homeX + (Math.random()-0.5)*0.5; fly.y = fly.homeY + (Math.random()-0.5)*0.5;
                if (Math.hypot(core.mouse.x - fly.x, core.mouse.y - fly.y) < 18) { fly.state = 'flying'; fly.energy = 130+Math.random()*70; let a=Math.random() * Math.PI * 2; fly.vx=Math.cos(a)*8; fly.vy=Math.sin(a)*8; }
            } else if (fly.state === 'flying') {
                fly.energy--; fly.vx += (Math.random()-0.5)*1.6; fly.vy += (Math.random()-0.5)*1.6;
                let spd = Math.hypot(fly.vx, fly.vy); if (spd > 7.5) { fly.vx = (fly.vx/spd)*7.5; fly.vy = (fly.vy/spd)*7.5; }
                fly.x += fly.vx; fly.y += fly.vy; if(Math.random()<0.5) playActionSound('buzz', spd/7.5);
                if (fly.x<20||fly.x>1004) fly.vx = -fly.vx; if (fly.y<20||fly.y>556) fly.vy = -fly.vy;
                if (fly.energy <= 0) { fly.vx *= 0.85; fly.vy *= 0.85; if (Math.hypot(fly.vx, fly.vy)<0.2) { fly.state = 'idle'; fly.homeX=fly.x; fly.homeY=fly.y; } }
            }
        });
        return;
    }
    if (core.ui.book.state === 'gaming') {
        let s = core.spiderGame; if (s.over) return; let p = s.player; s.spawnT++;
        if (s.level===1 && s.spawnT%50===0 && s.kills<s.required) { let a=Math.random() * Math.PI * 2; s.spiders.push({x:p.x+Math.cos(a)*250, y:p.y+Math.sin(a)*250, vx:-Math.cos(a)*1.2, vy:-Math.sin(a)*1.2, r:9, hp:1, ib:false}); }
        if (s.level===2 && s.spawnT%35===0 && s.kills<s.required) { let a=Math.random() * Math.PI * 2; s.spiders.push({x:p.x+Math.cos(a)*250, y:p.y+Math.sin(a)*250, vx:-Math.cos(a)*2.2, vy:-Math.sin(a)*2.2, r:8, hp:1, ir:true, ib:false}); }
        s.bullets.forEach((b,bi) => { b.x+=b.vx; b.y+=b.vy; if(b.x<312||b.x>712||b.y<90||b.y>480) s.bullets.splice(bi,1); });
        s.spiders.forEach((sp,spi) => {
            sp.x+=sp.vx; sp.y+=sp.vy; if (Math.hypot(p.x-sp.x, p.y-sp.y) < p.r+sp.r) s.over = true;
            s.bullets.forEach((b,bi) => { if(!b.ie && Math.hypot(b.x-sp.x, b.y-sp.y)<sp.r+3){ sp.hp--; s.bullets.splice(bi,1); if(sp.hp<=0){ s.spiders.splice(spi,1); playActionSound('pop'); if(s.level<3) s.kills++; if(sp.ib){ core.ui.book.state='opened'; } } } });
        });
        if (s.level<3 && s.kills>s.required && s.spiders.length===0) { s.level++; s.kills=0; s.spawnT=0; if(s.level===3) s.spiders.push({x:512,y:180,vx:0.8,vy:0,r:32,hp:10,ib:true,ang:0}); }
        return;
    }
    if (core.josef.isDone || core.poleScene.panelOpen) return;
    if (core.josef.isSwinging) { core.josef.swingP += 0.015; if (core.josef.swingP>1.0){ core.josef.isSwinging=false; core.josef.isDone=true; } return; }
    let dx = core.josef.targetX - core.josef.x;
    if (Math.abs(dx) > core.josef.speed) { core.josef.x += Math.sign(dx) * core.josef.speed; core.josef.stepT++; if(core.josef.stepT%22===0) playActionSound('step'); }
    if (core.scene === 'junkyard') {
        let d = core.junkyard.drum; if(Math.abs(core.josef.x-d.x)<38 && core.josef.mode==='normal') { d.vx=7.4; d.rot=0.22; playActionSound('thud',1.1,0.85); core.junkyard.magnet.visible=true; }
        if (Math.abs(d.vx)>0.05) { d.x+=d.vx; d.rot+=d.vx * 0.02; d.vx *= 0.94; if(d.x>850){ d.x=850; d.vx=-d.vx*0.6; playActionSound('thud',0.6); } } else if(d.vx!==0){ d.vx=0; d.wobble=30; } if(d.wobble>0){ d.wobble--; if(d.wobble===0) d.rot=0; }
    }
    if (core.scene === 'pole' && core.poleScene.cat.shocked && !core.poleScene.cat.dead) { core.poleScene.cat.fallY += 5; if(core.poleScene.cat.fallY>450) core.poleScene.cat.dead=true; }
    if (core.scene === 'bird') {
        let b = core.birdScene.bird;
        if(b.status === 'idle') { let lit = core.birdScene.blocks.find(bk=>bk.lit && !bk.fall); if(lit){ b.status='dive'; b.tBlock=lit; b.p=0; } }
        else if(b.status==='dive') { b.p+=0.035; b.x=740+(b.tBlock.x-740)*b.p; b.y=90+(b.tBlock.y-12-90)*b.p; if(b.p>=1.0){ b.status='ret'; b.tBlock.lit=false; playActionSound('thud',0.5); } }
        else if(b.status==='ret') { b.p-=0.035; b.x=740+(b.tBlock.x-740)*b.p; b.y=90+(b.tBlock.y-12-90)*b.p; if(b.p<=0){ b.status='idle'; b.x=740; b.y=90; } }
        core.birdScene.blocks.forEach(bk => { if(bk.fall && bk.y<450){ bk.vy+=0.4; bk.y+=bk.vy; if(bk.y>=450) playActionSound('thud',0.4); } });
    }
    if (core.scene === 'shoot') {
        let s = core.shootGame; if(s.flies.length < 6) s.flies.push({ x: s.mazeX+50+Math.random()*200, y: s.mazeY+60+Math.random()*200, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3 });
        s.flies.forEach(f => { f.x+=f.vx; f.y+=f.vy; if(f.x<s.mazeX+6||f.x>s.mazeX+s.mw-6) f.vx=-f.vx; if(f.y<s.mazeY+6||f.y>s.mazeY+s.mh-6) f.vy=-f.vy; if(Math.hypot(s.px+8-f.x, s.py+8-f.y)<11){ s.px=420; s.py=420; playActionSound('thud'); } });
        if(!s.keyCollected && Math.hypot(s.px-(s.mazeX+140), s.py-(s.mazeY+120))<20){ s.keyCollected=true; playActionSound('page'); }
    }
}

function render() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(core.scene === 'menu') { drawMenuScene(); return; }
    drawBaseWorld();
    if(core.scene === 'junkyard') drawJunkyardScene();
    if(core.scene === 'pole') drawPoleScene();
    if(core.scene === 'bird') drawBirdScene();
    if(core.scene === 'band') drawBandScene();
    if(core.scene === 'gomoku') drawGomokuScene();
    if(core.scene === 'bubble') drawBubbleScene();
    if(core.scene === 'plug') drawPlugScene();
    if(core.scene === 'shoot') drawShootScene();
    if(core.scene === 'doctor_lore') drawDoctorLoreScene();
    drawJosef(); drawStretchUI(); drawInventoryAndTopUI();
    if(core.ui.book.state === 'gaming') drawSpiderGameWindow();
    ctx.save(); ctx.translate(core.mouse.x, core.mouse.y); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
}

function mainGlobalLoop() { update(); render(); requestAnimationFrame(mainGlobalLoop); }

// ==========================================
// 🖱️ 点击动作事件全域分流拦截器
// ==========================================
canvas.addEventListener('mousedown', (e) => {
    initAudioEngine();
    let rect = canvas.getBoundingClientRect();
    let scaleX = canvas.width / rect.width;
    let scaleY = canvas.height / rect.height;
    let mx = (e.clientX - rect.left) * scaleX;
    let my = (e.clientY - rect.top) * scaleY;
    core.mouse.x = mx; core.mouse.y = my;

    if (core.ui.book.state === 'gaming') {
        if (mx > 600 && mx < 712 && my > 88 && my < 125) {
            core.ui.book.state = 'closed';
            const curBtn = document.getElementById(`btn-${core.scene}`);
            if (curBtn) curBtn.classList.add('active');
            const spBtn = document.getElementById('btn-spider');
            if (spBtn) spBtn.classList.remove('active');
            return;
        }
        if (core.spiderGame.over) {
            if(mx>312 && mx<712 && my>88 && my<488) { core.spiderGame.level=1; core.spiderGame.spiders=[]; core.spiderGame.kills=0; core.spiderGame.over=false; }
            return;
        }
        const p = core.spiderGame.player;
        let ang = Math.atan2(my - p.y, mx - p.x);
        core.spiderGame.bullets.push({ x: p.x, y: p.y, vx: Math.cos(ang) * 9, vy: Math.sin(ang) * 9, ie: false });
        playActionSound('laser', 0.8, 1.2);
        return;
    }
    if (core.ui.book.state === 'opened') {
        if(mx>162+700-40 && mx<162+700-10 && my>48+10 && my<48+40) core.ui.book.state='closed';
        return;
    }
    if (core.scene==='pole' && core.poleScene.panelOpen) {
        let c=Math.floor((mx-362)/100)+Math.floor((my-138)/100)*3, b=core.poleScene.grid.indexOf(8);
        if([c-1,c+1,c-3,c+3].includes(b)){
            core.poleScene.grid[b]=core.poleScene.grid[c]; core.poleScene.grid[c]=8; playActionSound('thud');
            if(core.poleScene.grid.slice(0,8).every((v,i)=>v===i)){ core.poleScene.solved=true; core.poleScene.panelOpen=false; core.poleScene.cat.shocked=true; playActionSound('shock'); }
        }
        return;
    }
    if (my<60 && mx>200 && mx<800 && core.scene!=='menu') {
        let idx = Math.floor((mx-220)/100), item = core.inventory.items[idx];
        if(item){
            if(core.inventory.selected && core.inventory.selected!==item){
                if((core.inventory.selected==='细导线'&&item==='磁铁')||(core.inventory.selected==='磁铁'&&item==='细导线')){
                    core.inventory.items=core.inventory.items.filter(i=>i!=='细导线'&&i!=='磁铁'); core.inventory.items.push('磁铁组线'); core.inventory.selected=null; playActionSound('pop');
                }
            }else{
                core.inventory.selected=(core.inventory.selected===item)?null:item; playActionSound('pop');
            }
        }
        return;
    }
    if(mx>950 && mx<990 && my>180 && my<360 && core.scene!=='menu') {
        if(my<240) { core.josef.mode='tall'; playActionSound('hydraulic'); }
        else if(my>310) { core.josef.mode='short'; playActionSound('hydraulic'); }
        else { core.josef.mode='normal'; playActionSound('hydraulic'); }
        return;
    }
    if(core.scene!=='menu' && Math.hypot(mx-core.ui.bulb.x, my-core.ui.bulb.y)<core.ui.bulb.r){
        core.ui.bulb.active=true; core.ui.bulb.timer=150; playActionSound('pop'); return;
    }
    if(core.scene!=='menu' && mx>core.ui.book.x && mx<core.ui.book.x+core.ui.book.w && my>core.ui.book.y && my<core.ui.book.y+core.ui.book.h){
        core.ui.book.state='gaming'; playActionSound('page'); return;
    }

    if(core.scene==='junkyard') {
        let j = core.junkyard;
        if(!core.josef.isAssembled){
            if(mx>130&&mx<230){ j.bathtub.searched=true; playActionSound('thud'); }
            else if(j.bathtub.searched&&mx>160&&mx<190){ j.torso.collected=true; core.josef.isAssembled=true; playActionSound('pop'); }
            return;
        }
        if(mx>50&&mx<80&&my>240&&my<300){
            if(core.josef.mode==='tall') { j.pole.bent=true; playActionSound('thud'); }
            else { playActionSound('buzz'); }
            return;
        }
        if(j.pole.bent && mx>50&&mx<120&&my>220&&my<320 && core.inventory.selected==='磁铁组线' && core.josef.mode==='tall') {
            core.josef.isSwinging = true; playActionSound('laser'); return;
        }
        if(!j.wire.collected && Math.hypot(mx-(j.wire.x+15), my-(j.wire.y+15))<25){
            j.wire.collected=true; core.inventory.items.push('细导线'); playActionSound('pop'); return;
        }
        if(j.magnet.visible && !j.magnet.collected && mx>=j.magnet.x && mx<=j.magnet.x+j.magnet.w){
            j.magnet.collected=true; core.inventory.items.push('磁铁'); playActionSound('pop'); return;
        }
    }

    if(core.scene==='pole') {
        if(mx>480&&mx<510&&my>250&&my<290){
            if(core.josef.mode==='tall') { core.poleScene.panelOpen=true; playActionSound('thud'); }
            else { playActionSound('buzz'); }
            return;
        }
    }

    if(core.scene==='bird') {
        let bs = core.birdScene;
        bs.blocks.forEach(b => {
            if(!b.fall && mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h){ b.lit=!b.lit; playActionSound('thud'); }
        });
        return;
    }

    if(core.scene==='gomoku') {
        let cs = 400 / 11;
        let c = Math.round((mx - 332) / cs);
        let r = Math.round((my - 48) / cs);
        if (r>=0 && r<12 && c>=0 && c<12 && core.gomoku.board[r][c]===0 && !core.gomoku.winner) {
            core.gomoku.board[r][c] = 1;
            playActionSound('thud');
            setTimeout(() => {
                let emptySpots = [];
                for (let i = 0; i < 12; i++) {
                    for (let j = 0; j < 12; j++) {
                        if (core.gomoku.board[i][j] === 0) emptySpots.push({ r: i, c: j });
                    }
                }
                if (emptySpots.length > 0) {
                    let pick = emptySpots.find(p => Math.hypot(p.r - r, p.c - c) <= 2) || emptySpots[0];
                    core.gomoku.board[pick.r][pick.c] = 2;
                    playActionSound('thud', 0.8, 1.2);
                }
            }, 300);
        }
        return;
    }

    if(core.scene==='bubble') {
        if (mx < 500) core.bubbleLevel = 'junkyard'; else core.bubbleLevel = 'prison';
        playActionSound('page'); return;
    }

    if(core.scene==='plug') {
        let p = core.plugGame;
        p.nodes.forEach((n, idx) => {
            if (Math.hypot(mx - n.x, my - n.y) < 22) {
                playActionSound('thud');
                if (p.selected === null) {
                    p.selected = idx;
                } else if (p.selected === idx) {
                    p.selected = null;
                } else {
                    let tmp = p.nodes[p.selected].state;
                    p.nodes[p.selected].state = n.state;
                    n.state = tmp;
                    p.selected = null;
                    playActionSound('pop');
                    if (p.nodes.every(node => node.state === node.target)) {
                        p.solved = true; playActionSound('laser');
                    }
                }
            }
        });
        return;
    }

    if(core.scene==='doctor_lore') {
        core.movieChapter = (core.movieChapter + 1) % 3;
        playActionSound('page'); return;
    }

    if(my>410 && mx<930) core.josef.targetX = mx;
});

canvas.addEventListener('mousemove', (e) => {
    let rect = canvas.getBoundingClientRect();
    core.mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
    core.mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
});

window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && core.ui.book.state === 'gaming') {
        core.ui.book.state = 'closed';
        const curBtn = document.getElementById(`btn-${core.scene}`);
        if (curBtn) curBtn.classList.add('active');
        const spBtn = document.getElementById('btn-spider');
        if (spBtn) spBtn.classList.remove('active');
        return;
    }
    if (core.scene === 'shoot') {
        const s = core.shootGame;
        const spd = 8;
        if (e.key === 'ArrowLeft' || e.key === 'a') s.px = Math.max(s.mazeX + 4, s.px - spd);
        if (e.key === 'ArrowRight' || e.key === 'd') s.px = Math.min(s.mazeX + s.mw - 20, s.px + spd);
        if (e.key === 'ArrowUp' || e.key === 'w') s.py = Math.max(s.mazeY + 4, s.py - spd);
        if (e.key === 'ArrowDown' || e.key === 's') s.py = Math.min(s.mazeY + s.mh - 20, s.py + spd);
    }
    if (core.ui.book.state === 'gaming') {
        const p = core.spiderGame.player;
        const spd = 6;
        if (e.key === 'ArrowLeft' || e.key === 'a') p.x = Math.max(325, p.x - spd);
        if (e.key === 'ArrowRight' || e.key === 'd') p.x = Math.min(700, p.x + spd);
        if (e.key === 'ArrowUp' || e.key === 'w') p.y = Math.max(100, p.y - spd);
        if (e.key === 'ArrowDown' || e.key === 's') p.y = Math.min(470, p.y + spd);
    }
});

function switchScene(s) {
    core.ui.book.state = 'closed';
    core.scene = s;
    document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
    const curBtn = document.getElementById(`btn-${s}`);
    if (curBtn) curBtn.classList.add('active');
    initAudioEngine();
    playActionSound('page');
}

function triggerSpiderGame() {
    core.ui.book.state = 'gaming';
    core.spiderGame.level = 1;
    core.spiderGame.spiders = [];
    core.spiderGame.bullets = [];
    core.spiderGame.kills = 0;
    core.spiderGame.over = false;
    document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
    const curBtn = document.getElementById('btn-spider');
    if (curBtn) curBtn.classList.add('active');
    initAudioEngine();
    playActionSound('laser');
}

// 流浪歌手定期多声部合奏
setInterval(() => {
    if(core.scene !== 'band') return;
    playActionSound('sax', 1.0, 260 + Math.sin(Date.now() * 0.003) * 60);
    if(Math.random() < 0.5) playActionSound('thud', 0.8, 1.2);
    if(Math.random() < 0.4) playActionSound('guitar', 0.9, 440);
}, 450);

canvas.style.cursor = 'none';
generateTextures();
mainGlobalLoop();
</script>
</body>
</html>
