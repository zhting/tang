<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>《机械迷城》1:1 终极完全体独立离线保全拯救工程 - 大集合版</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #080503;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden; font-family: sans-serif; color: #8e7960; user-select: none;

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ==========================================
// 🔊 WEB AUDIO API 纯代码级多轨工业声场合成器
// ==========================================
let audioCtx = null;
let windNode = null;
let buzzNode = null;
let melodyInterval = null;

function initAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    try {
        if (!windNode && audioCtx) {
            let bufSize = 2 * audioCtx.sampleRate, buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate), out = buf.getChannelData(0);
            let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
            for (let i = 0; i < bufSize; i++) {
                let white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179; b1 = 0.99332 * b1 + white * 0.0750759; b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856; b4 = 0.55000 * b4 + white * 0.5329522; b5 = -0.7616 * b5 - white * 0.0168980;
                out[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362; out[i] *= 0.12; b6 = white * 0.115926;
            }
            let src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
            let lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(140, audioCtx.currentTime);
            let gn = audioCtx.createGain(); gn.gain.setValueAtTime(0.18, audioCtx.currentTime);
            src.connect(lp); lp.connect(gn); gn.connect(audioCtx.destination); src.start(); windNode = src;
        }
    } catch(e) {}
}

function playProceduralSound(type, vol=1.0, pitch=1.0) {
    if (!audioCtx) return;
    try {
        let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
        if (type === 'thud') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(120*pitch, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.22);
            gain.gain.setValueAtTime(vol * 0.35, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
        } else if (type === 'step') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(340, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(90, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(vol * 0.03, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        } else if (type === 'hydraulic') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(85, audioCtx.currentTime);
            let filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(200, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol * 0.02, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
            osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.16); return;
        } else if (type === 'buzz') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(850 + (Math.random()-0.5)*150, audioCtx.currentTime);
            let hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.setValueAtTime(1100, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol * 0.01, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(hp); hp.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.04); return;
        } else if (type === 'shock') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol * 0.1, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        } else if (type === 'page') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(85*pitch, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol * 0.12, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        } else if (type === 'sax') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
            let lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(450, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04*vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
            osc.connect(lp); lp.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.35); return;
        } else if (type === 'guitar') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08*vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        } else if (type === 'splash') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(140, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol * 0.1, audioCtx.currentTime);
        } else if (type === 'laser') {
            osc.type = 'square'; osc.frequency.setValueAtTime(450 * pitch, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(vol * 0.03, audioCtx.currentTime);
        } else if (type === 'pop') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(300 * pitch, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(vol * 0.18, audioCtx.currentTime);
        }
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } catch(e) {}
}

function updateBuzzLoop(enable) {
    if(!audioCtx) return;
    if(enable && !buzzNode) {
        try {
            let osc = audioCtx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(50, audioCtx.currentTime);
            let lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(100, audioCtx.currentTime);
            let gn = audioCtx.createGain(); gn.gain.setValueAtTime(0.06, audioCtx.currentTime);
            osc.connect(lp); lp.connect(gn); gn.connect(audioCtx.destination); osc.start(); buzzNode = {o:osc, g:gn};
        } catch(e) {}
    } else if(!enable && buzzNode) { try { buzzNode.o.stop(); } catch(e){} buzzNode = null; }
}

function startSignatureMelody() {
    if(melodyInterval) return;
    const riff = [523.25, 587.33, 659.25, 523.25, 659.25, 587.33, 392.00, 440.00]; let step = 0;
    melodyInterval = setInterval(() => {
        if(state.mode === 'menu') return;
        let note = riff[step % riff.length];
        if (step % 4 === 0) playProceduralSound('sax', 1.4, note);
        else if (step % 4 === 1 || step % 4 === 2) playProceduralSound('sax', 0.8, note * 1.2);
        else playProceduralSound('guitar', 0.1, 100);
        step++;
    }, 380);
}

// ==========================================
// 🎨 1:1 离线像素级美术贴图生成器与手抖描边
// ==========================================
const tex = { paper: null, rust: null };
function buildGraphicsPatterns() {
    let pCanvas = document.createElement('canvas'); pCanvas.width = 256; pCanvas.height = 256;
    let pCtx = pCanvas.getContext('2d'); pCtx.fillStyle = '#21160e'; pCtx.fillRect(0,0,256,256);
    for(let i=0; i<20000; i++) {
        pCtx.fillStyle = `rgba(0,0,0,${Math.random()*0.09})`;
        if(Math.random()<0.5) pCtx.fillRect(Math.random()*256, Math.random()*256, Math.random()*3+1, 1);
        else pCtx.fillRect(Math.random()*256, Math.random()*256, 1, Math.random()*3+1);
    }
    tex.paper = ctx.createPattern(pCanvas, 'repeat');

    let rCanvas = document.createElement('canvas'); rCanvas.width = 128; rCanvas.height = 128;
    let rCtx = rCanvas.getContext('2d'); rCtx.fillStyle = '#7a654d'; rCtx.fillRect(0,0,128,128);
    for(let i=0; i<350; i++) {
        let x=Math.random()*128, y=Math.random()*128, r=Math.random()*6+1;
        let g = rCtx.createRadialGradient(x,y,0, x,y,r); g.addColorStop(0,'rgba(84,33,12,0.5)'); g.addColorStop(1,'rgba(0,0,0,0)');
        rCtx.fillStyle = g; rCtx.beginPath(); rCtx.arc(x,y,r,0,Math.PI*2); rCtx.fill();
    }
    tex.rust = ctx.createPattern(rCanvas, 'repeat');
}

function drawHandDrawnShape(pts, close=false) {
    ctx.beginPath();
    for(let i=0; i<pts.length; i++) {
        let dx = (Math.random()-0.5)*1.4; let dy = (Math.random()-0.5)*1.4;
        if(i===0) ctx.moveTo(pts[i].x+dx, pts[i].y+dy); else ctx.lineTo(pts[i].x+dx, pts[i].y+dy);
    }
    if(close) ctx.closePath(); ctx.stroke();
}

// ==========================================
// ⚙️ 全体核心组件状态机（离线数据仓库）
// ==========================================
const state = {
    mode: 'menu',
    inventory: { openY: -62, targetY: -62, items: [], selected: null },
    ui: { bulb: { x: 920, y: 15, r: 18, active: false, timer: 0 }, book: { x: 965, y: 12, w: 34, h: 28, subState: 'closed' } },
    flies: [
        { x: 310, y: 150, homeX: 310, homeY: 150, vx: 0, vy: 0, state: 'idle', energy: 0, t: 0 },
        { x: 512, y: 340, homeX: 512, homeY: 340, vx: 0, vy: 0, state: 'idle', energy: 0, t: 10 },
        { x: 670, y: 450, homeX: 670, homeY: 450, vx: 0, vy: 0, state: 'idle', energy: 0, t: 20 }
    ],
    josef: {
        x: 200, y: 445, targetX: 200, height: 80, baseHeight: 80, mode: 'normal', speed: 2.3, stepCount: 0,
        isAssembled: false, isSwinging: false, swingP: 0, isDone: false, isShocked: false, shockT: 0,
        headVy: 0, headOffsetY: 0, antennaAngle: 0, antennaAv: 0, idleTimer: 0, idleState: 'none', idleProgress: 0
    },
    junkyard: {
        bathtub: { x: 130, y: 400, w: 100, h: 50, searched: false }, torso: { x: 160, y: 425, w: 30, h: 25, collected: false },
        wire: { x: 550, y: 440, w: 35, h: 30, collected: false }, magnet: { x: 800, y: 440, w: 25, h: 25, collected: false, visible: false },
        pole: { x: 60, y: 250, w: 20, h: 200, bent: false }, drum: { x: 720, y: 445, w: 36, h: 50, vx: 0, rot: 0, wobble: 0 }
    },
    poleScene: { panelOpen: false, grid: [1, 0, 2, 3, 5, 4, 6, 7, 8], solved: false, cat: { y: 100, fallY: 100, shocked: false, dead: false } },
    birdScene: { bird: { x: 740, y: 90, status: 'idle', tBlock: null, p: 0 }, blocks: [ {x:630, y:300, w:32, h:32, lit:false, fall:false, vy:0}, {x:720, y:300, w:32, h:32, lit:false, fall:false, vy:0} ] },
    fishing: { state: 'idle', castProgress: 0, hookX: 200, hookY: 450, rodAngle: -Math.PI/4, targetAngle: -Math.PI/4, ripples: [], caughtItem: false },
    fanQuiz: {
        currentIndex: 0, solved: false, wrongTimer: 0, angerLevel: 0,
        questions: [
            { options: ["▲", "●", "■", "♦"], correct: 1 },
            { options: ["⬆️", "⬇️", "⬅️", "➡️"], correct: 0 },
            { options: ["⬢", "⬡", "★", "⯁"], correct: 2 }
        ]
    },
    gomoku: { board: Array(12).fill().map(()=>Array(12).fill(0)), turn: true, winner: null },
    plug: {
        nodes: [
            { x: 420, y: 200, s: 'green', t: 'green' }, { x: 520, y: 200, s: 'red', t: 'green' }, { x: 620, y: 200, s: 'red', t: 'red' },
            { x: 420, y: 300, s: 'red', t: 'green' },   { x: 520, y: 300, s: 'green', t: 'red' }, { x: 620, y: 300, s: 'green', t: 'red' },
            { x: 420, y: 400, s: 'green', t: 'red' }, { x: 520, y: 400, s: 'red', t: 'green' }, { x: 620, y: 400, s: 'green', t: 'green' }
        ],
        lines: [[0,1],[1,2],[3,4],[4,5],[6,7],[7,8],[0,3],[1,4],[2,5],[3,6],[4,7],[5,8]],
        selected: null, solved: false
    },
    shoot: { px: 420, py: 420, mx: 362, my: 100, mw: 300, mh: 350, key: false, flies: [] },
    spiderGame: { level: 1, player: { x: 512, y: 288, r: 12, speed: 4.5 }, bullets: [], spiders: [], spawnT: 0, required: 10, kills: 0, over: false },
    movie: { mode: 'none', timer: 0, chap: 0 },
    mouse: { x: 0, y: 0, hover: null }
};

// ==========================================
// 🎨 画布主渲染与动画绘制核心
// ==========================================
function drawBaseWorld() {
    ctx.fillStyle = tex.paper; ctx.fillRect(0,0,canvas.width,canvas.height);
    if(state.mode !== 'menu' && state.mode !== 'shoot' && state.mode !== 'plug' && !state.mode.startsWith('movie')) {
        ctx.fillStyle = '#110b07'; ctx.fillRect(0,480,canvas.width,96);
        ctx.strokeStyle = '#24170e'; ctx.lineWidth = 4; drawHandDrawnShape([{x:0,y:480}, {x:1024,y:480}]);
    }
}

function drawJosef() {
    if (state.josef.isDone || state.mode === 'menu' || state.mode === 'shoot' || state.mode === 'plug' || state.mode.startsWith('movie')) return;
    if (state.josef.isSwinging) {
        let p = state.josef.swingP, sa = -Math.PI/3 + Math.sin(p * Math.PI) * (Math.PI/1.5);
        ctx.save(); ctx.translate(state.junkyard.pole.x + 15, state.junkyard.pole.y + 55); ctx.rotate(sa);
        ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,160); ctx.stroke();
        ctx.translate(0,160); ctx.fillStyle = '#8c775e'; ctx.fillRect(-15,-40,30,40); ctx.translate(0,-55); drawJosefHead(); ctx.restore(); return;
    }
    if (state.mode === 'junkyard' && !state.josef.isAssembled) { ctx.save(); ctx.translate(320, 465); drawJosefHead(); ctx.restore(); return; }
    let th = state.josef.baseHeight; if(state.josef.mode==='tall') th = 135; if(state.josef.mode==='short') th = 46;
    let oldH = state.josef.height || 80; state.josef.height += (th - oldH) * 0.15;
    ctx.save(); ctx.translate(state.josef.x, state.josef.y);
    let lean = (state.mode==='fishing' && state.fishing.state==='casting') ? Math.sin(state.fishing.castProgress*Math.PI)*0.14 : 0; ctx.rotate(lean);
    let swing = (state.josef.x !== state.josef.targetX) ? Math.sin(Date.now()*0.016)*13 : 0;
    ctx.strokeStyle = '#382a1c'; ctx.lineWidth = 4; drawHandDrawnShape([{x:-10,y:0},{x:-10+swing,y:35}]); drawHandDrawnShape([{x:10,y:0},{x:10-swing,y:35}]);
    ctx.fillStyle = tex.rust; ctx.strokeStyle = '#1a110a'; ctx.lineWidth = 3; ctx.fillRect(-16, -state.josef.height, 32, state.josef.height); ctx.strokeRect(-16, -state.josef.height, 32, state.josef.height);
    ctx.save(); let hY = -state.josef.height - 14 + state.josef.headOffsetY, hR = state.josef.idleState==='looking_foot'?Math.sin(state.josef.idleProgress*Math.PI)*0.35:0; ctx.translate(0, hY+hR); ctx.rotate(hR);
    drawJosefHead(); ctx.restore(); ctx.restore();
}

function drawJosefHead() {
    ctx.fillStyle = '#99846d'; ctx.strokeStyle = '#1a110a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0,0,15,Math.PI,0); ctx.lineTo(12,14); ctx.lineTo(-12,14); ctx.closePath(); ctx.fill(); ctx.stroke();
    if(state.josef.idleState==='blinking' && Math.sin(state.josef.idleProgress * Math.PI) > 0.4) {
        ctx.strokeStyle='#1a120b'; ctx.lineWidth=3;
        drawHandDrawnShape([{x:-10,y:2},{x:-2,y:2}]); drawHandDrawnShape([{x:2,y:2},{x:10,y:2}]);
    } else {
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-5,2,4,0,Math.PI*2); ctx.arc(5,2,4,0,Math.PI*2); ctx.fill();
        let eyeX = Math.sin(Date.now()*0.002) * 1.5; ctx.fillStyle = '#000'; ctx.beginPath();
        ctx.arc(-5+eyeX,2,1.5,0,Math.PI*2); ctx.arc(5+eyeX,2,1.5,0,Math.PI*2); ctx.fill();
    }
    ctx.save(); ctx.rotate(state.josef.antennaAngle + (state.mode!=='menu'?Math.sin(Date.now()*0.016)*0.25:0));
    ctx.strokeStyle = '#1a110a'; ctx.lineWidth = 2; drawHandDrawnShape([{x:0,y:-15},{x:0,y:-26}]);
    ctx.fillStyle = '#b8341d'; ctx.beginPath(); ctx.arc(0,-26,3,0,Math.PI*2); ctx.fill(); ctx.restore();
    if(state.josef.idleState==='scratching') {
        let hw = Math.sin(Date.now()*0.04)*5; ctx.strokeStyle='#1a120b'; ctx.lineWidth=2.5;
        drawHandDrawnShape([{x:14,y:10},{x:24,y:-10+hw},{x:12,y:-20+hw}]);
    }
}

function drawMenuModule() {
    ctx.fillStyle = '#b39674'; ctx.font = 'bold 52px Courier New'; ctx.fillText("MACHINARIUM", 315, 160);
    ctx.strokeStyle = '#423324'; ctx.lineWidth = 2.5; drawHandDrawnShape([{x:300,y:185},{x:730,y:185}]);
    ctx.fillStyle = '#261b12'; ctx.strokeStyle = '#4a3625'; ctx.fillRect(387,310,250,42); ctx.strokeRect(387,310,250,42);
    ctx.fillStyle = '#8a7761'; ctx.font = 'bold 12px monospace'; ctx.fillText("START GAME (点击下方切换独立沙盒)", 396, 336);

    state.flies.forEach(fly => {
        ctx.save(); ctx.translate(fly.x, fly.y);

// ⚙️ 核心逻辑状态分发计算器
// ==========================================
function updateEngine() {
    initAudioContext(); startSignatureMelody(); updateBuzzLoop(state.mode==='pole' && !state.poleScene.solved);
    if(state.mouse.y < 65) state.inventory.targetY = 0; else state.inventory.targetY = -62;
    if (state.mode === 'menu') {
        state.flies.forEach(fly => {
            if (fly.state==='idle') {
                fly.x = fly.homeX+(Math.random()-0.5)*0.5; fly.y=fly.homeY+(Math.random()-0.5)*0.5;
                if(Math.hypot(state.mouse.x-fly.x, state.mouse.y-fly.y)<18){ fly.state='flying'; fly.energy=130+Math.random()*60; let a=Math.random()*Math.PI*2; fly.vx=Math.cos(a)*8; fly.vy=Math.sin(a)*8; }
            } else {
                fly.energy--; fly.vx+=(Math.random()-0.5)*1.6; fly.vy+=(Math.random()-0.5)*1.6;
                let spd = Math.hypot(fly.vx,fly.vy); if(spd>7) { fly.vx=(fly.vx/spd)*7; fly.vy=(fly.vy/spd)*7; }
                fly.x+=fly.vx; fly.y+=fly.vy; if(Math.random()<0.5) playProceduralSound('buzz',spd/7);
                if(fly.x<20||fly.x>1004) fly.vx=-fly.vx; if(fly.y<20||fly.y>556) fly.vy=-fly.vy;
                if(fly.energy<=0 && Math.hypot(fly.vx,fly.vy)<0.2){ fly.state='idle'; fly.homeX=fly.x; fly.homeY=fly.y; }
            }
        });
        return;
    }
    if (state.ui.book.subState === 'gaming') {
        let s = state.spiderGame; if (s.over) return; let p = s.player; s.spawnT++;
        if (s.level===1 && s.spawnT%50===0 && s.kills<s.required) { let a=Math.random()*Math.PI*2; s.spiders.push({x:p.x+Math.cos(a)*250, y:p.y+Math.sin(a)*250, vx:-Math.cos(a)*1.2, vy:-Math.sin(a)*1.2, r:9, hp:1, ib:false}); }
        if (s.level===2 && s.spawnT%35===0 && s.kills<s.required) { let a=Math.random()*Math.PI*2; s.spiders.push({x:p.x+Math.cos(a)*250, y:p.y+Math.sin(a)*250, vx:-Math.cos(a)*2.2, vy:-Math.sin(a)*2.2, r:8, hp:1, ir:true, ib:false}); }
        s.bullets.forEach((b,bi) => { b.x+=b.vx; b.y+=b.vy; if(b.x<312||b.x>712||b.y<90||b.y>480) s.bullets.splice(bi,1); });
        s.spiders.forEach((sp,spi) => {
            sp.x+=sp.vx; sp.y+=sp.vy; if (Math.hypot(p.x-sp.x, p.y-sp.y) < p.r+sp.r) s.over = true;
            s.bullets.forEach((b,bi) => { if(!b.ie && Math.hypot(b.x-sp.x, b.y-sp.y)<sp.r+3){ sp.hp--; s.bullets.splice(bi,1); if(sp.hp<=0){ s.spiders.splice(spi,1); playProceduralSound('pop'); if(s.level<3) s.kills++; if(sp.ib){ state.ui.book.subState='closed'; } } } });
        });
        if (s.level<3 && s.kills>s.required && s.spiders.length===0) { s.level++; s.kills=0; s.spawnT=0; if(s.level===3) s.spiders.push({x:512,y:180,vx:0.8,vy:0,r:32,hp:10,ib:true,ang:0}); }
        return;
    }

    let p = state.josef; let dx = p.targetX - p.x;
    if (Math.abs(dx) > 1) { p.x += Math.sign(dx)*p.speed; p.stepCount++; if(p.stepCount%22===0) playProceduralSound('step'); p.antennaAv += -Math.sign(dx)*0.01; }
    else { if(p.stepCount!==0) { p.stepCount=0; p.headVy=3.5; p.antennaAv=0.2; playProceduralSound('hydraulic', 0.5); } }
    p.headOffsetY += p.headVy; p.headVy += -p.headOffsetY*0.25; p.headVy *= 0.82;
    p.antennaAngle += p.antennaAv; p.antennaAv += -p.antennaAngle*0.15; p.antennaAv *= 0.88;
    p.idleTimer++; if(p.idleTimer>240 && p.idleState==='none') { let r=Math.random(); p.idleState=r<0.33?'scratching':(r<0.66?'blinking':'looking_foot'); p.idleProgress=0; p.idleTimer=0; }
    if(p.idleState==='scratching'){ p.idleProgress+=0.04; if(p.idleProgress>=1) p.idleState='none'; }
    else if(p.idleState==='blinking'){ p.idleProgress+=0.08; if(p.idleProgress>=1) p.idleState='none'; }
    else if(p.idleState==='looking_foot'){ p.idleProgress+=0.03; if(p.idleProgress>=1) p.idleState='none'; }

    if (state.mode === 'junkyard') {
        let d = state.junkyard.drum; if(Math.abs(p.x-d.x)<38 && p.mode==='normal'){ d.vx=7.4; d.rot=0.22; playProceduralSound('thud',1.1); state.junkyard.magnet.visible=true; p.targetX=p.x-10; }
        if(Math.abs(d.vx)>0.05){ d.x+=d.vx; d.rot+=d.vx*0.02; d.vx*=0.94; if(d.x>850){ d.x=850; d.vx=-d.vx*0.6; playProceduralSound('thud',0.6); } } else if(d.vx!==0){ d.vx=0; d.wobble=30; }
    }
    if (state.mode === 'pole' && state.poleScene.cat.shocked && !state.poleScene.cat.dead) { state.poleScene.cat.fallY+=5; if(state.poleScene.cat.fallY>=450) state.poleScene.cat.dead=true; }
    if (state.mode === 'shoot') {
        let s = state.shoot; if(s.flies.length<6) s.flies.push({x:s.mx+50+Math.random()*200, y:s.my+50+Math.random()*200, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3});
        s.flies.forEach(f => { f.x+=f.vx; f.y+=f.vy; if(f.x<s.mx+6||f.x>s.mx+s.mw-6) f.vx=-f.vx; if(f.y<s.my+6||f.y>s.my+s.mh-6) f.vy=-f.vy; });
        if(!s.key && Math.hypot(s.px-(s.mx+140), s.py-(s.my+120))<20){ s.key=true; playProceduralSound('page'); }
    }
    if (state.mode === 'fishing') {
        let fish = state.fishing;
        if(fish.state === 'casting') {
            fish.castProgress+=0.04; fish.hookX=p.x-(fish.castProgress*340); fish.hookY=445-Math.sin(fish.castProgress*Math.PI)*120;
            if(fish.castProgress>=1){
                fish.state='fishing'; fish.caughtItem=true;
                if(!fish.ripples) fish.ripples=[]; fish.ripples.push({x:fish.hookX, y:445, r:2});
                playProceduralSound('splash');
            }
        } else if(fish.state==='reeling') {
            fish.hookX+=(p.x-fish.hookX)*0.15; fish.hookY+=(445-fish.hookY)*0.15;
            if(Math.hypot(p.x-fish.hookX,445-fish.hookY)<18) { fish.state='idle'; playProceduralSound('pop'); }
        }
    }
    if (state.mode === 'fan_quiz' && state.fanQuiz.wrongTimer > 0) {
        state.fanQuiz.wrongTimer--;
    }
}

function mainRenderLoop() {
    ctx.clearRect(0,0,canvas.width,canvas.height); drawBaseWorld();
    if(state.mode==='menu') drawMenuModule();
    else if(state.mode==='junkyard') drawJunkyardModule();
    else if(state.mode==='pole') drawPoleModule();
    else if(state.mode==='bird') drawBirdModule();
    else if(state.mode==='fishing') drawFishingModule();
    else if(state.mode==='fan_quiz') drawFanQuizModule();
    else if(state.mode==='band') drawBandModule();
    else if(state.mode==='gomoku') drawGomokuModule();
    else if(state.mode==='bubble') drawBubbleModule();
    else if(state.mode==='plug') drawPlugModule();
    else if(state.mode==='shoot') drawShootModule();
    else if(state.mode==='movie_gf') drawMovieModule('girlfriend');
    else if(state.mode==='movie_doc') drawMovieModule('meet_doctor');

    drawJosef(); drawTopOverlayAndInventory();
    if(state.ui.book.subState === 'gaming') drawSpiderGameWindow();

    ctx.save(); ctx.translate(state.mouse.x, state.mouse.y); ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,15); ctx.lineTo(5,11); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
}

function globalLoop() { updateEngine(); mainRenderLoop(); requestAnimationFrame(globalLoop); }

// ==========================================
// 🖱️ 点击动作事件拦截器
// ==========================================
canvas.addEventListener('mousedown', (e) => {
    initAudioContext();
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    state.mouse.x = (e.clientX - rect.left) * scaleX;
    state.mouse.y = (e.clientY - rect.top) * scaleY;
    let mx = state.mouse.x, my = state.mouse.y;

    if(state.ui.book.subState === 'gaming') {
        if(mx>600 && mx<712 && my>88 && my<125) {
            state.ui.book.subState = 'closed';
            const curBtn = document.getElementById(`btn-${state.mode}`);
            if(curBtn) curBtn.classList.add('active');
            const spBtn = document.getElementById('btn-spider');
            if(spBtn) spBtn.classList.remove('active');
            return;
        }
        if(state.spiderGame.over) {
            if(mx>312 && mx<712 && my>88 && my<488) { state.spiderGame.level=1; state.spiderGame.spiders=[]; state.spiderGame.kills=0; state.spiderGame.over=false; }
            return;
        }
        const p = state.spiderGame.player;
        let ang = Math.atan2(my - p.y, mx - p.x);
        state.spiderGame.bullets.push({ x: p.x, y: p.y, vx: Math.cos(ang) * 9, vy: Math.sin(ang) * 9, ie: false });
        playProceduralSound('laser', 0.8, 1.2);
        return;
    }

    if(state.mode.startsWith('movie')) { state.movie.chap = (state.movie.chap+1)%3; playProceduralSound('page'); return; }

    if(state.mode === 'pole' && state.poleScene.panelOpen) {
        let c = Math.floor((mx-362)/100)+Math.floor((my-138)/100)*3, b = state.poleScene.grid.indexOf(8);
        if([c-1,c+1,c-3,c+3].includes(b)){
            state.poleScene.grid[b]=state.poleScene.grid[c]; state.poleScene.grid[c]=8; playProceduralSound('thud');
            if(state.poleScene.grid.slice(0,8).every((v,i)=>v===i)){ state.poleScene.solved=true; state.poleScene.panelOpen=false; state.poleScene.cat.shocked=true; playProceduralSound('shock'); }
        }
        return;
    }

    if(state.mode === 'gomoku') {
        let cs = 400/11; let c = Math.round((mx-332)/cs), r = Math.round((my-48)/cs);
        if(r>=0&&r<12&&c>=0&&c<12&&state.gomoku.board[r][c]===0 && !state.gomoku.winner) {
            state.gomoku.board[r][c]=1; playProceduralSound('thud');
            setTimeout(() => {
                let emptySpots = [];
                for(let i=0;i<12;i++){ for(let j=0;j<12;j++){ if(state.gomoku.board[i][j]===0) emptySpots.push({r:i,c:j}); } }
                if(emptySpots.length>0) {
                    let pick = emptySpots.find(p=>Math.hypot(p.r-r, p.c-c)<=2) || emptySpots[0];
                    state.gomoku.board[pick.r][pick.c] = 2; playProceduralSound('thud', 0.8, 1.2);
                }
            }, 300);
        }
        return;
    }

    if(state.mode === 'fishing') {
        if(mx>state.josef.x-40 && mx<state.josef.x+40 && state.fishing.state==='fishing') { state.fishing.state='reeling'; return; }
        if(mx<state.josef.x && state.fishing.state==='idle') { state.fishing.state='casting'; state.fishing.castProgress=0; return; }
    }

    if(state.mode === 'fan_quiz') {
        let px=460, py=70; let curQ = state.fanQuiz.questions[state.fanQuiz.currentIndex];
        for(let i=0; i<4; i++) {
            let bx=px+30+i*110, by=py+270;
            if(mx>bx && mx<bx+95 && my>by && my<by+55) {
                if(i===curQ.correct) {
                    playProceduralSound('pop');
                    if(state.fanQuiz.currentIndex<2) state.fanQuiz.currentIndex++;
                    else { state.fanQuiz.solved=true; playProceduralSound('laser'); }
                } else {
                    state.fanQuiz.angerLevel = (state.fanQuiz.angerLevel || 0) + 1;
                    state.fanQuiz.wrongTimer = 30; playProceduralSound('buzz');
                    if(state.fanQuiz.angerLevel >= 3) { state.fanQuiz.solved=true; playProceduralSound('thud', 1.5, 0.6); }
                }
                break;
            }
        }
        return;
    }

    if(state.mode === 'plug') {
        let p = state.plug;
        p.nodes.forEach((n, idx) => {
            if(Math.hypot(mx - n.x, my - n.y) < 22) {
                playProceduralSound('thud');
                if(p.selected === null) p.selected = idx;
                else if(p.selected === idx) p.selected = null;
                else {
                    let tmp = p.nodes[p.selected].s; p.nodes[p.selected].s = n.s; n.s = tmp; p.selected = null;
                    playProceduralSound('pop');
                    if(p.nodes.every(node => node.s === node.t)) { p.solved = true; playProceduralSound('laser'); }
                }
            }
        });
        return;
    }

    if(mx>950 && mx<990 && my>180 && my<360 && state.mode!=='menu') {
        if(my<240) state.josef.mode='tall'; else if(my>310) state.josef.mode='short'; else state.josef.mode='normal';
        playProceduralSound('hydraulic'); return;
    }

    if(state.mode==='junkyard') {
        let j = state.junkyard;
        if(!state.josef.isAssembled){
            if(mx>130&&mx<230){ j.bathtub.searched=true; playProceduralSound('thud'); }
            else if(j.bathtub.searched&&mx>160&&mx<190){ j.torso.collected=true; state.josef.isAssembled=true; playProceduralSound('pop'); }
            return;
        }
        if(mx>50&&mx<80&&my>240&&my<300){
            if(state.josef.mode==='tall') { j.pole.bent=true; playProceduralSound('thud'); }
            else playProceduralSound('buzz');
            return;
        }
        if(j.pole.bent && mx>50&&mx<120&&my>220&&my<320 && state.josef.mode==='tall') {
            state.josef.isSwinging = true; playProceduralSound('laser'); return;
        }
        if(!j.wire.collected && Math.hypot(mx-(j.wire.x+15), my-(j.wire.y+15))<25){
            j.wire.collected=true; state.inventory.items.push('细导线'); playProceduralSound('pop'); return;
        }
        if(j.magnet.visible && !j.magnet.collected && mx>=j.magnet.x && mx<=j.magnet.x+j.magnet.w){
            j.magnet.collected=true; state.inventory.items.push('磁铁'); playProceduralSound('pop'); return;
        }
    }

    if(state.mode==='pole' && mx>480&&mx<510&&my>250&&my<290){
        if(state.josef.mode==='tall') { state.poleScene.panelOpen=true; playProceduralSound('thud'); }
        else playProceduralSound('buzz');
        return;
    }

    if(state.mode==='bird') {
        state.birdScene.blocks.forEach(b => {
            if(!b.fall && mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h){ b.lit=!b.lit; playProceduralSound('thud'); }
        });
        return;
    }

    if(my>410 && mx<930 && state.mode!=='menu') state.josef.targetX = mx;
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    state.mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
    state.mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
});

window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.ui.book.subState === 'gaming') {
        state.ui.book.subState = 'closed';
        const curBtn = document.getElementById(`btn-${state.mode}`);
        if (curBtn) curBtn.classList.add('active');
        const spBtn = document.getElementById('btn-spider');
        if (spBtn) spBtn.classList.remove('active');
        return;
    }
    if (state.mode === 'shoot') {
        const s = state.shoot; const spd = 8;
        if (e.key === 'ArrowLeft' || e.key === 'a') s.px = Math.max(s.mx + 4, s.px - spd);
        if (e.key === 'ArrowRight' || e.key === 'd') s.px = Math.min(s.mx + s.mw - 20, s.px + spd);
        if (e.key === 'ArrowUp' || e.key === 'w') s.py = Math.max(s.my + 4, s.py - spd);
        if (e.key === 'ArrowDown' || e.key === 's') s.py = Math.min(s.my + s.mh - 20, s.py + spd);
    }
    if (state.ui.book.subState === 'gaming') {
        const p = state.spiderGame.player; const spd = 6;
        if (e.key === 'ArrowLeft' || e.key === 'a') p.x = Math.max(325, p.x - spd);
        if (e.key === 'ArrowRight' || e.key === 'd') p.x = Math.min(700, p.x + spd);
        if (e.key === 'ArrowUp' || e.key === 'w') p.y = Math.max(100, p.y - spd);
        if (e.key === 'ArrowDown' || e.key === 's') p.y = Math.min(470, p.y + spd);
    }
});

function changeEngineMode(m) {
    state.ui.book.subState = 'closed';
    state.mode = m;
    document.querySelectorAll('.ui-btn').forEach(b => b.classList.remove('active'));
    const curBtn = document.getElementById(`btn-${m}`);
    if (curBtn) curBtn.classList.add('active');
    initAudioContext();
    playProceduralSound('page');
}

function switchScene(m) { changeEngineMode(m); }

function triggerLoreMovie(type) {
    state.ui.book.subState = 'closed';
    state.mode = type === 'girlfriend' ? 'movie_gf' : 'movie_doc';
    state.movie.chap = 0;
    document.querySelectorAll('.ui-btn').forEach(b => b.classList.remove('active'));
    const curBtn = document.getElementById(type === 'girlfriend' ? 'btn-movie_gf' : 'btn-movie_doc');
    if (curBtn) curBtn.classList.add('active');
    initAudioContext();
    playProceduralSound('page');
}

function triggerSpiderGame() {
    state.ui.book.subState = 'gaming';
    state.spiderGame.level = 1;
    state.spiderGame.spiders = [];
    state.spiderGame.bullets = [];
    state.spiderGame.kills = 0;
    state.spiderGame.over = false;
    document.querySelectorAll('.ui-btn').forEach(b => b.classList.remove('active'));
    const curBtn = document.getElementById('btn-spider');
    if (curBtn) curBtn.classList.add('active');
    initAudioContext();
    playProceduralSound('laser');
}

// 暴露全局 state 供外界调试与测试检查
window.state = state;
window.core = state;
window.changeEngineMode = changeEngineMode;
window.switchScene = switchScene;
window.triggerLoreMovie = triggerLoreMovie;
window.triggerSpiderGame = triggerSpiderGame;

canvas.style.cursor = 'none';
buildGraphicsPatterns();
globalLoop();
</script>
