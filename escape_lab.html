// ==========================================
// 绘制巨龙 (高保真原版动作序列贴图与帧循环引擎)
// ==========================================

// ==========================================
// 🎨 蓝龙原版动作序列帧渲染引擎 (Pristine Sprite Sheet Engine)
// 包含：10 帧四足行走步态循环 + 7 步地表完整吞咽动作流
// ==========================================
function drawBlueDragon() {
    ctx.save();
    ctx.translate(dragon.x, dragon.y);
    ctx.scale(dragon.facing, 1);

    const nowMs = performance.now();
    const isMoving = Math.abs(dragon.vx) > 10;
    
    // 呼吸律动计算 (站立不动时胸腹起伏与微幅摇曳生动动画)
    const breathePhase = nowMs * 0.0035;
    const breatheSin = Math.sin(breathePhase);
    const isIdle = !isMoving && dragon.isOnFloor && !dragon.swallowAction && dragon.feedingGrenadeTimer <= 0;
    const idleBob = isIdle ? breatheSin * 3.2 : 0;
    const breatheScaleY = isIdle ? (1.0 + breatheSin * 0.025) : 1.0;
    const breatheScaleX = isIdle ? (1.0 - breatheSin * 0.015) : 1.0;

    let spriteKey = null;
    let sScale = 2.4;
    let offsetX = 0;
    let offsetY = 0;

    // 0. 基础挥爪攻击动作 (CLAW ATTACK: 4 帧纯正像素动作流)
    if (dragon.isClawing) {
        const prog = 1.0 - (dragon.clawAnimTimer / 0.28);
        const fIdx = Math.min(3, Math.floor(prog * 4));
        spriteKey = 'dragon_claw_' + fIdx;
        sScale = 2.4;
    }
    // 0.5. 反刍喷吐动作 (SPIT OUT 动作)
    else if (dragon.spitOutAction) {
        const p = Math.min(1.0, dragon.spitOutAction.timer / dragon.spitOutAction.duration);
        if (p < 0.3) {
            spriteKey = 'dragon_swallow_5';
        } else if (p < 0.65) {
            spriteKey = 'dragon_feed_1';
        } else {
            spriteKey = 'dragon_walk_0';
        }
        sScale = 2.4;
    }
    // 1. 肚内手雷闷爆 (BELLY EXPLOSION 闪烁震颤与极度膨胀)
    else if (dragon.bellyBulgeAnim > 0.05) {
        spriteKey = 'dragon_explode';
        sScale = 2.15 + dragon.bellyBulgeAnim * 0.2;
        offsetX = (Math.random() - 0.5) * 8 * dragon.bellyBulgeAnim;
        offsetY = (Math.random() - 0.5) * 8 * dragon.bellyBulgeAnim;
    }
    // 2. 贴地吃手雷 (GRENADE FEEDING 动作：低头铲地、大口咬下)
    else if (dragon.feedingGrenadeTimer > 0) {
        spriteKey = (dragon.feedingGrenadeTimer > 0.22) ? 'dragon_feed_0' : 'dragon_feed_1';
        sScale = 1.65;
    }
    // 3. 原版 7 步地表吞人序列帧 (SWALLOW ACTION: 叼起->抛空->张嘴迎击->叼入->咬住->仰头->下咽)
    else if (dragon.swallowAction) {
        const p = Math.min(0.999, dragon.swallowAction.timer / dragon.swallowAction.duration);
        const fIdx = Math.min(6, Math.floor(p * 7));
        spriteKey = 'dragon_swallow_' + fIdx;
        sScale = 2.4;
    }
    // 4. 腹中吃满/饱腹 (FULL BELLY: 5~10 人, 沉甸下垂饱满巨肚)
    else if (swallowedHumans >= 5) {
        const frameIdx = isMoving ? (Math.floor(dragon.stepCount * 0.8) % 4) : 0;
        spriteKey = 'dragon_heavy_' + frameIdx;
        sScale = 3.2; // 尺寸与 walk 一致
    }
    // 5. 正常 10 帧纯正四足行进步态循环 (NORMAL WALK CYCLE: 10 帧无缝流畅动作)
    else {
        const frameIdx = isMoving ? (Math.floor(dragon.stepCount * 1.0) % 10) : 0;
        spriteKey = 'dragon_walk_' + frameIdx;
        sScale = 2.4;
    }

    const spr = labSprites[spriteKey];
    if (spr && spr.complete && spr.naturalWidth > 0) {
        const sw = spr.naturalWidth * sScale * breatheScaleX;
        const sh = spr.naturalHeight * sScale * breatheScaleY;
        const anchorX = DRAGON_ANCHORS[spriteKey] || (spr.naturalWidth * 0.5);

        // 手雷闷爆时腹部高能电火花与体内强闪光晕
        if (dragon.bellyBulgeAnim > 0.05) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(-20 + offsetX, -sh * 0.45 + offsetY, 65 * dragon.bellyBulgeAnim, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 160, 0, ' + (0.5 * dragon.bellyBulgeAnim) + ')';
            ctx.shadowColor = '#ff6d00';
            ctx.shadowBlur = 35 * dragon.bellyBulgeAnim;
            ctx.fill();

            // 龙鼻孔喷出的黑烟气团
            ctx.fillStyle = 'rgba(50, 50, 50, 0.7)';
            ctx.beginPath();
            ctx.arc(sw * 0.42 + offsetX, -sh * 0.65 + offsetY, 12 * dragon.bellyBulgeAnim, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // 绘制巨龙身体，底端精准贴合地面，腹心居中对齐
        ctx.drawImage(spr, -anchorX * sScale * breatheScaleX + offsetX, -sh + idleBob + offsetY, sw, sh);

        // 挥爪时绘制向前席卷的月牙爪痕气浪
        if (dragon.isClawing) {
            const prog = 1.0 - (dragon.clawAnimTimer / 0.28);
            const fIdx = Math.min(3, Math.floor(prog * 4));
            if (fIdx === 1 || fIdx === 2) {
                const slashImg = labSprites['claw_slash_fx'];
                if (slashImg && slashImg.complete && slashImg.naturalWidth > 0) {
                    const sScaleArc = 2.4;
                    const swArc = slashImg.naturalWidth * sScaleArc;
                    const shArc = slashImg.naturalHeight * sScaleArc;
                    ctx.drawImage(slashImg, sw * 0.14, -sh * 0.68 + idleBob, swArc, shArc);
                }
            }
        }
    } else {
        // 降级绘制
        drawBlueDragonVector();
    }

    // 吐出动作视觉细节（喉咙鼓包涌动与半空抛射士兵）
    if (dragon.spitOutAction) {
        const p = Math.min(1.0, dragon.spitOutAction.timer / dragon.spitOutAction.duration);
        if (p < 0.3) {
            const t1 = p / 0.3;
            const lumpX = 40 + t1 * 60;
            const lumpY = -70 - t1 * 30;
            ctx.fillStyle = '#59a9fa';
            ctx.beginPath();
            ctx.arc(lumpX, lumpY, 14.0, 0, Math.PI * 2);
            ctx.fill();
        } else if (p < 0.65) {
            const t2 = (p - 0.3) / 0.35;
            ctx.strokeStyle = 'rgba(200, 245, 255, 0.85)';
            ctx.lineWidth = 3.0;
            ctx.beginPath();
            ctx.moveTo(110, -96);
            ctx.lineTo(190, -84);
            ctx.stroke();

            const flyX = 110 + (175 - 110) * t2;
            const flyY = -96 + (0 - (-96)) * t2 - Math.sin(t2 * Math.PI) * 45.0;
            ctx.save();
            ctx.translate(flyX, flyY);
            ctx.fillStyle = '#38475c';
            ctx.fillRect(-10, -18, 20, 22);
            ctx.fillStyle = '#e5be9e';
            ctx.beginPath(); ctx.arc(0, -25, 9, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(-11, -34, 22, 9);
            ctx.restore();
        }
    }

    ctx.restore();
}

function drawBlueDragonVector() {
    const step = dragon.stepCount;
    const isMoving = Math.abs(dragon.vx) > 10;
    const bellyBonus = 1.0 + (dragon.bellyBulgeAnim * 0.45);
    const bobY = isMoving ? Math.sin(step * 2) * 3.5 : Math.sin(performance.now() * 0.003) * 1.5;

    // 躯干主龙身
    ctx.fillStyle = '#1565c0';
    ctx.beginPath();
    ctx.ellipse(0, -60 + bobY, 120, 52 * bellyBonus, 0, 0, Math.PI * 2);
    ctx.fill();

    // 头部
    ctx.fillStyle = '#1976d2';
    ctx.beginPath();
    ctx.moveTo(70, -70 + bobY);
    ctx.lineTo(130, -50 + bobY);
    ctx.lineTo(70, -30 + bobY);
    ctx.closePath();
    ctx.fill();

    // 翅膀
    ctx.fillStyle = '#1976d2';
    ctx.beginPath();
    ctx.moveTo(0, -70 + bobY);
    ctx.lineTo(-60, -160 + bobY);
    ctx.lineTo(-20, -50 + bobY);
    ctx.closePath();
    ctx.fill();
}

// 绘制抛空被吞食士兵动效 (对齐原图 (1) TOSSING AGENT WITH SNOUT)
function drawTossedSoldier() {
    if (!dragon.tossedSoldier) return;
    const ts = dragon.tossedSoldier;
    ctx.save();
    ctx.translate(ts.x, ts.y);
    ctx.rotate(ts.rot);
    drawTossedSoldierVector(ts);
    ctx.restore();
}

function drawTossedSoldierVector(ts) {
    let uniformColor = '#1d4ed8';
    let capColor = '#1e40af';
    if (ts.type === EnemyType.GRAY_HAT) {
        uniformColor = '#94a3b8'; capColor = '#64748b';
    } else if (ts.type === EnemyType.RED_ORANGE) {
        uniformColor = '#ea580c'; capColor = '#ea580c';
    } else if (ts.type === EnemyType.BLACK_SPECOPS) {
        uniformColor = '#1e293b'; capColor = '#0f172a';
    }
    ctx.fillStyle = uniformColor; ctx.fillRect(-10, -18, 20, 26);
    ctx.fillStyle = '#fed7aa'; ctx.beginPath(); ctx.arc(0, -26, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = capColor; ctx.fillRect(-10, -35, 20, 9);
}

// ==========================================
// 绘制敌兵独立兵种 (蓝帽电击枪、灰帽冲锋、红帽喷火、黑色特种兵)
// 纯手绘复古像素级渲染引擎，彻底移除漫画截屏切片
// ==========================================
function drawBlueCapSoldier(e, ctx) {
    let spriteKey = 'blue_cap_0';
    const sScale = 1.15;

    if (e.isFiring) {
        spriteKey = 'blue_cap_3';
    } else if (Math.abs(e.vx || 0) > 5 || e.walkCycle > 0) {
        // 高帧率流畅巡逻步态 (8~10 FPS)
        const frame = Math.floor((e.walkCycle || 0) * 1.5) % 3;
        spriteKey = 'blue_cap_' + frame;
    }

    const spr = labSprites[spriteKey];
    if (spr && spr.complete && spr.naturalWidth > 0) {
        const sw = spr.naturalWidth * sScale;
        const sh = spr.naturalHeight * sScale;
        ctx.drawImage(spr, -sw * 0.5, -sh, sw, sh);

        // 受击闪白反馈（严格保持 1:1 轮廓，绝不放大变形）
        if (e.hitFlashTimer > 0) {
            ctx.save();
            ctx.globalCompositeOperation = 'source-atop';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
            ctx.fillRect(-sw * 0.5, -sh, sw, sh);
            ctx.restore();
        }
    } else {
        drawBlueCapSoldierVector(e, ctx);
    }
}

function drawBlueCapSoldierVector(e, ctx) {
    const isHit = (e.hitFlashTimer || 0) > 0;
    ctx.fillStyle = isHit ? '#ff5959' : '#1d4ed8'; ctx.fillRect(-12, -58, 24, 34);
    ctx.fillStyle = isHit ? '#ffffff' : '#fed7aa'; ctx.beginPath(); ctx.arc(0, -66, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = isHit ? '#ffffff' : '#1e40af'; ctx.fillRect(-12, -77, 24, 11);
}

function drawGrayCapRunner(e, ctx) {
    // 高帧率流畅冲锋步态：4 帧无缝循环 (12 FPS 高刷新)
    const isRunning = (e.state === 'COMBAT');
    const runRate = isRunning ? 2.2 : 1.4;
    const frame = Math.floor((e.walkCycle || 0) * runRate) % 4;
    const spriteKey = 'gray_cap_' + frame;
    const sScale = 1.15;

    const spr = labSprites[spriteKey];
    if (spr && spr.complete && spr.naturalWidth > 0) {
        const sw = spr.naturalWidth * sScale;
        const sh = spr.naturalHeight * sScale;

        // 奔跑时微幅纵向脚步律动，生动自然
        const stepBob = isRunning ? Math.abs(Math.sin((e.walkCycle || 0) * 4.4)) * 2.2 : 0;
        ctx.drawImage(spr, -sw * 0.5, -sh - stepBob, sw, sh);

        // 奔跑脚后跟烟尘微粒
        if (isRunning && Math.random() < 0.35) {
            activeParticles.push({
                x: e.x - e.facing * 12,
                y: e.y - 3,
                vx: -e.facing * (Math.random() * 50 + 20),
                vy: -Math.random() * 20 - 4,
                size: Math.random() * 4 + 2,
                color: 'rgba(180, 200, 220, 0.5)',
                life: 0.3
            });
        }

        // 受击闪白反馈（严格保持 1:1 轮廓）
        if (e.hitFlashTimer > 0) {
            ctx.save();
            ctx.globalCompositeOperation = 'source-atop';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
            ctx.fillRect(-sw * 0.5, -sh - stepBob, sw, sh);
            ctx.restore();
        }
    } else {
        drawGrayCapRunnerVector(e, ctx);
    }
}

function drawGrayCapRunnerVector(e, ctx) {
    const isHit = (e.hitFlashTimer || 0) > 0;
    ctx.fillStyle = isHit ? '#ff5959' : '#94a3b8'; ctx.fillRect(-12, -58, 24, 34);
    ctx.fillStyle = isHit ? '#ffffff' : '#fed7aa'; ctx.beginPath(); ctx.arc(2, -66, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = isHit ? '#ffffff' : '#64748b'; ctx.fillRect(-10, -77, 24, 11);
}

function drawRedOrangeCapFlamer(e, ctx) {
    let spriteKey = 'red_orange_cap_0';
    const sScale = 1.15;

    if (e.isFiring || (e.flameTimer && e.flameTimer > 0)) {
        spriteKey = 'red_orange_cap_1';
    }

    const spr = labSprites[spriteKey];
    if (spr && spr.complete && spr.naturalWidth > 0) {
        const sw = spr.naturalWidth * sScale;
        const sh = spr.naturalHeight * sScale;
        ctx.drawImage(spr, -sw * 0.5, -sh, sw, sh);

        if (e.hitFlashTimer > 0) {
            ctx.save();
            ctx.globalCompositeOperation = 'source-atop';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
            ctx.fillRect(-sw * 0.5, -sh, sw, sh);
            ctx.restore();
        }
    } else {
        drawRedOrangeCapFlamerVector(e, ctx);
    }
}

function drawRedOrangeCapFlamerVector(e, ctx) {
    const isHit = (e.hitFlashTimer || 0) > 0;
    ctx.fillStyle = isHit ? '#ff5959' : '#ea580c'; ctx.fillRect(-12, -58, 24, 34);
    ctx.fillStyle = isHit ? '#ffffff' : '#fed7aa'; ctx.beginPath(); ctx.arc(0, -66, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = isHit ? '#ffffff' : '#ea580c'; ctx.fillRect(-12, -77, 24, 11);
}

function drawBlackSpecopsGrenadier(e, ctx) {
    let spriteKey = 'black_specops_0';
    const sScale = 1.15;

    if (e.timer >= 8.2) {
        if (e.timer < 8.8) {
            spriteKey = 'black_specops_1';
        } else if (e.timer < 9.4) {
            spriteKey = 'black_specops_2';
        } else {
            spriteKey = 'black_specops_3';
        }
    }

    const spr = labSprites[spriteKey];
    if (spr && spr.complete && spr.naturalWidth > 0) {
        // black_specops_0..2 顶部有 24px 图表文字，切除后完美居中贴地
        const isHeaderFrame = (spriteKey === 'black_specops_0' || spriteKey === 'black_specops_1' || spriteKey === 'black_specops_2');
        const cropY = isHeaderFrame ? 24 : 0;
        const srcH = spr.naturalHeight - cropY;
        const sw = spr.naturalWidth * sScale;
        const sh = srcH * sScale;

        ctx.drawImage(spr, 0, cropY, spr.naturalWidth, srcH, -sw * 0.5, -sh, sw, sh);

        if (e.hitFlashTimer > 0) {
            ctx.save();
            ctx.globalCompositeOperation = 'source-atop';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
            ctx.fillRect(-sw * 0.5, -sh, sw, sh);
            ctx.restore();
        }
    } else {
        drawBlackSpecopsGrenadierVector(e, ctx);
    }
}

function drawBlackSpecopsGrenadierVector(e, ctx) {
    const isHit = (e.hitFlashTimer || 0) > 0;
    ctx.fillStyle = isHit ? '#ff5959' : '#1e293b'; ctx.fillRect(-13, -58, 26, 34);
    ctx.fillStyle = isHit ? '#ffffff' : '#0f172a'; ctx.fillRect(-13, -78, 26, 18);
    ctx.fillStyle = isHit ? '#ffffff' : '#22c55e'; ctx.fillRect(3, -69, 12, 4.5);
}

function drawEnemies() {
    activeEnemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.scale(e.facing, 1);

        if (e.isDowned) {
            ctx.translate(10, -14);
            ctx.rotate(-Math.PI / 2);
        }

        if (e.type === EnemyType.BLUE_HAT) {
            drawBlueCapSoldier(e, ctx);
        } else if (e.type === EnemyType.GRAY_HAT) {
            drawGrayCapRunner(e, ctx);
        } else if (e.type === EnemyType.RED_ORANGE) {
            drawRedOrangeCapFlamer(e, ctx);
        } else if (e.type === EnemyType.BLACK_SPECOPS) {
            drawBlackSpecopsGrenadier(e, ctx);
        }

        ctx.restore();

        // 头顶状态与吐出概率显示
        const curHp = (e.hp !== undefined) ? e.hp : SOLDIER_MAX_HP;
        const probPct = Math.round(calculateSpitChance(curHp) * 100);

        ctx.save();
        ctx.textAlign = 'center';
        if (e.isDowned) {
            ctx.font = 'bold 13px -apple-system, sans-serif';
            ctx.fillStyle = '#4ade80';
            ctx.fillText("0血倒下(吐出0%)", e.x, e.y - 28);
        } else {
            const crouch = e.stunTimer > 0 ? 8.0 : 0.0;
            if (e.stunTimer > 0) {
                const starX = Math.sin(Date.now() * 0.015) * 12.0;
                ctx.font = 'bold 18px -apple-system, sans-serif';
                ctx.fillStyle = '#ffea00';
                ctx.fillText("★", e.x + starX, e.y - 82 + crouch);
            }
            ctx.font = 'bold 13px -apple-system, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`${curHp}血 (吐出${probPct}%)`, e.x, e.y - 86 + crouch);
        }
        ctx.restore();
    });
}

// 绘制投掷物 (火焰弹、绿手雷)
function drawProjectiles() {
    // 1. 火焰弹 (高能燃烧尾焰)
    activeFireballs.forEach(fb => {
        ctx.save();
        ctx.translate(fb.x, fb.y);
        ctx.fillStyle = '#ff3d00';
        ctx.shadowColor = '#ff6d00';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(0, 0, 11, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
    });

    // 2. 手雷 (绿色菠萝手雷与引信倒计时)
    activeGrenades.forEach(g => {
        if (g.swallowed) return; // 吞进肚子后隐藏
        ctx.save();
        ctx.translate(g.x, g.y);

        // 橄榄绿手雷弹体
        ctx.fillStyle = '#33691e';
        ctx.beginPath();
        ctx.ellipse(0, 0, 9, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1b5e20';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 弹片网格刻线
        ctx.fillStyle = '#558b2f';
        ctx.fillRect(-6, -6, 12, 3);
        ctx.fillRect(-6, 0, 12, 3);

        // 金属保险栓与引信红光急促闪烁
        ctx.fillStyle = (Math.sin(performance.now() * 0.03) > 0) ? '#ff1744' : '#ffffff';
        ctx.fillRect(-2, -16, 4, 6);

        // 倒计时提示
        ctx.fillStyle = '#d50000';
        ctx.font = 'bold 12px monospace';
        ctx.fillText(g.fuse.toFixed(1) + "s", -12, -20);
        ctx.restore();
    });
}

// 绘制粒子
function drawParticles() {
    activeParticles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

// ==========================================
// 6. HUD 更新逻辑 (20 HEARTS + 10 BELLY 槽位)
// ==========================================
function updateHud() {
    hpText.textContent = `${dragonHp.toFixed(1)} / ${DRAGON_MAX_HP.toFixed(1)}`;

    // 20 Hearts (每颗心代表 2.0 生命值)
    for (let i = 0; i < 10; i++) {
        const heart = document.getElementById(`heart-icon-${i}`);
        if (heart) {
            const heartThreshold = (i + 1) * 2.0;
            if (dragonHp >= heartThreshold) {
                heart.classList.remove('lost');
            } else if (dragonHp >= heartThreshold - 1.0) {
                heart.classList.remove('lost');
                heart.style.filter = 'opacity(0.65)';
            } else {
                heart.classList.add('lost');
                heart.style.filter = '';
            }
        }
    }

    bellyTitle.textContent = `${swallowedHumans} / ${MAX_BELLY_CAPACITY}`;
    for (let i = 0; i < 10; i++) {
        const slot = document.getElementById(`belly-slot-${i}`);
        if (slot) {
            if (i < swallowedHumans) slot.classList.add('filled');
            else slot.classList.remove('filled');
        }
    }

    if (swallowedHumans > 0) {
        const leftSec = Math.ceil(NATURAL_DIGEST_INTERVAL - naturalDigestTimer);
        bellyDigestInfo.textContent = `（${leftSec}秒后自然消化1人）`;
    } else {
        bellyDigestInfo.textContent = "肚子空空，请捕食士兵";
    }
}

// 主帧循环
function gameLoop(now) {
    const dt = Math.min(0.06, (now - lastTime) / 1000);
    lastTime = now;

    updateGame(dt);
    renderGame();

    requestAnimationFrame(gameLoop);
}

function skipCutscene() {
    clearAllCutsceneTimeouts();
    cutsceneOverlay.style.display = 'none';
    hudOverlay.style.display = 'flex';
    setupLevel1Entities();
    updateHud();
    whiteFlash.style.opacity = '0.0';
    currentState = GameState.TRAPPED_IN_CAGE;
    hintBanner.textContent = "你已变成巨龙并被困在笼中！按 [J 键] 或 [D 键前冲] 撞破牢笼！";
}

// 暴露全局变量供调试与自动化测试
window.GameState = GameState;
window.EnemyType = EnemyType;
window.getGameState = () => currentState;
window.dragon = dragon;
window.cage = cage;
window.activeEnemies = activeEnemies;
window.activeGrenades = activeGrenades;
window.getActiveEnemies = () => activeEnemies;
window.getActiveGrenades = () => activeGrenades;
window.getActiveFireballs = () => activeFireballs;
window.getDragonHp = () => dragonHp;
window.getSwallowedHumans = () => swallowedHumans;
window.setSwallowedHumans = n => { swallowedHumans = Math.max(0, Math.min(MAX_BELLY_CAPACITY, n)); updateHud(); };
window.performDragonSwallow = performDragonSwallow;
window.performDragonClaw = performDragonClaw;
window.breakOutOfCage = breakOutOfCage;
window.skipCutscene = skipCutscene;
window.restartLevel = restartLevel;

// 启动游戏
playOpeningCutscene();
requestAnimationFrame(gameLoop);
</script>
