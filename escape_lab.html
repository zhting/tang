<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>逃离实验室 - 模式十</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030710;
            font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
            color: #d9e9ff;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 50%, #0a1628 0%, #02050c 100%);
            overflow: hidden;
            padding: 10px;
        }

        /* 外部高科技实验室独立机架边框 (Titanium Cyber Bezel) */
        .lab-terminal-bezel {
            position: relative;
            width: 100%;
            max-width: 1320px;
            height: 100%;
            max-height: 760px;
            display: flex;
            flex-direction: column;
            background: #091322;
            border: 3px solid #00e5ff;
            border-radius: 14px;
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.4), inset 0 0 35px rgba(0, 114, 206, 0.35);
            overflow: hidden;
        }

        .lab-terminal-bezel::after {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 10px;
            pointer-events: none;
            z-index: 35;
        }

        /* 顶端科幻仪器状态条 */
        .lab-bezel-header {
            height: 38px;
            background: linear-gradient(180deg, #18283d 0%, #0b1524 100%);
            border-bottom: 2px solid #00b0ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 13px;
            font-weight: bold;
            color: #80d8ff;
            letter-spacing: 1px;
            flex-shrink: 0;
            z-index: 30;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-status-badge {
            background: rgba(0, 230, 118, 0.15);
            border: 1px solid #00e676;
            color: #69f0ae;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            animation: pulseStatus 2s infinite;
        }

        @keyframes pulseStatus {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-btn {
            background: #102642;
            color: #b3e5fc;
            border: 1.5px solid #0288d1;
            padding: 4px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .header-btn:hover {
            background: #0288d1;
            color: #fff;
            box-shadow: 0 0 12px rgba(2, 136, 209, 0.6);
        }

        /* 画布主视口 */
        .canvas-viewport {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #030811;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #c8d8e6;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* HUD 图层 */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 18px;
            z-index: 20;
        }

        /* 顶部高科技整合状态条 (对齐设计原图) */
        .hud-top-console {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(16, 30, 48, 0.94) 0%, rgba(8, 16, 28, 0.94) 100%);
            border: 1.5px solid #00b0ff;
            border-radius: 8px;
            padding: 8px 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 176, 255, 0.25);
            backdrop-filter: blur(6px);
        }

        /* 1. 生命值红心模块 (20 HEARTS) */
        .hud-card-hearts {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hearts-title-box {
            display: flex;
            flex-direction: column;
        }

        .hearts-label {
            font-size: 11px;
            font-weight: 900;
            color: #80d8ff;
            letter-spacing: 0.5px;
        }

        .hearts-value {
            font-size: 15px;
            font-weight: 900;
            color: #ff5252;
            text-shadow: 0 0 10px rgba(255, 82, 82, 0.6);
        }

        .hearts-grid {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .heart-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
            filter: drop-shadow(0 0 4px rgba(255, 23, 68, 0.6));
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .heart-icon.lost {
            filter: grayscale(1) opacity(0.25);
            transform: scale(0.85);
        }

        /* 2. 腹中容量电池槽位 (0/10 BELLY) */
        .hud-card-belly {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .belly-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 900;
            color: #80d8ff;
        }

        .belly-slots {
            display: flex;
            gap: 5px;
        }

        .belly-capsule {
            width: 15px;
            height: 24px;
            border: 1.5px solid #00b0ff;
            border-radius: 4px;
            background: rgba(0, 77, 138, 0.35);
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .belly-capsule.filled {
            background: linear-gradient(180deg, #00e5ff 0%, #0091ea 100%);
            border-color: #e0f7fa;
            box-shadow: 0 0 10px #00e5ff;
            transform: scale(1.1);
        }

        .belly-capsule.filled::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            height: 5px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 2px;
        }

        .belly-info-text {
            display: none !important;
        }

        /* 3. 终点逃生距离进度 (LEVEL EXIT) */
        .hud-card-exit {
            display: flex;
            flex-direction: column;
            min-width: 180px;
            gap: 4px;
        }

        .exit-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 900;
            color: #69f0ae;
            letter-spacing: 0.5px;
        }

        .exit-track-bar {
            width: 100%;
            height: 12px;
            background: #091728;
            border: 1px solid #00e676;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .exit-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00b0ff 0%, #00e676 100%);
            border-radius: 5px;
            transition: width 0.15s linear;
        }

        .exit-dragon-head {
            position: absolute;
            top: -3px;
            right: -6px;
            font-size: 13px;
            pointer-events: none;
        }

        /* 操作按钮组 */
        .hud-actions {
            display: flex;
            gap: 8px;
        }

        .btn-hud-tech {
            background: linear-gradient(180deg, #1565c0 0%, #0d47a1 100%);
            color: #ffffff;
            border: 1.5px solid #42a5f5;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .btn-hud-tech:hover {
            background: linear-gradient(180deg, #1976d2 0%, #1565c0 100%);
            border-color: #82b1ff;
            transform: translateY(-2px);
            box-shadow: 0 0 14px rgba(66, 165, 245, 0.6);
        }

        .btn-hud-tech:active {
            transform: translateY(1px);
        }

        /* 底部动态指示提示 */
        .hud-bottom-bar {
            display: none !important;
        }

        .hint-banner {
            background: rgba(4, 15, 30, 0.92);
            border: 1.5px solid #00b0ff;
            color: #e0f7fa;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.75), 0 0 12px rgba(0, 176, 255, 0.35);
            text-align: center;
            max-width: 90%;
            transition: all 0.3s ease;
        }

        /* 触控按键 (移动端适配) */
        .touch-controls {
            display: none;
            position: absolute;
            bottom: 16px;
            width: calc(100% - 32px);
            left: 16px;
            justify-content: space-between;
            pointer-events: auto;
            z-index: 25;
        }

        .touch-dpad {
            display: flex;
            gap: 12px;
        }

        .touch-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(13, 71, 161, 0.8);
            border: 2px solid #42a5f5;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .touch-btn:active {
            background: #1976d2;
            transform: scale(0.92);
        }

        .touch-btn.swallow {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #00b0ff 0%, #0091ea 100%);
            border-color: #e0f7fa;
            font-size: 15px;
        }

        /* 剧情过场黑屏与字幕容器 */
        #cutscene-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 90px;
            z-index: 50;
            transition: opacity 0.5s ease;
        }

        .cutscene-subtitle {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
            min-height: 40px;
            text-align: center;
        }

        #white-flash {
            position: absolute;
            inset: 0;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 60;
            transition: opacity 0.3s ease;
        }

        /* 结算弹窗 */
        .modal-screen {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 14, 0.88);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 70;
        }

        .modal-screen.active {
            display: flex;
        }

        .modal-box {
            background: linear-gradient(135deg, #0b1a2e 0%, #050d18 100%);
            border: 2px solid #00e676;
            border-radius: 12px;
            padding: 32px 48px;
            text-align: center;
            max-width: 480px;
            box-shadow: 0 10px 40px rgba(0, 230, 118, 0.35);
        }

        .modal-title {
            font-size: 26px;
            font-weight: bold;
            color: #00e676;
            margin-bottom: 14px;
        }

        .modal-desc {
            font-size: 15px;
            color: #b0bec5;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn-modal {
            background: #00c853;
            color: #fff;
            border: none;
            padding: 10px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn-modal:hover {
            background: #00e676;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .touch-controls { display: flex; }
            .hud-card-exit { display: none; }
            .hearts-grid { gap: 2px; }
            .heart-icon { width: 15px; height: 15px; }
            .belly-capsule { width: 12px; height: 20px; }
            .btn-hud-tech { padding: 4px 10px; font-size: 11px; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- 外置高科技独立实验室机箱边框 -->
    <div class="lab-terminal-bezel">
        <div class="lab-bezel-header">
            <div class="header-title">
                <span>🐉 模式十：逃离实验室 - 变身巨龙 · 吞噬突围</span>
                <span class="header-status-badge">● 活体标本收容监控中</span>
            </div>
            <div class="header-controls">
                <button class="header-btn" onclick="restartLevel()">重新开始</button>
                <a href="index.html" class="header-btn">返回小院</a>
            </div>
        </div>

        <div class="canvas-viewport">
            <canvas id="gameCanvas" width="1280" height="720"></canvas>

            <!-- 闪光层与全屏黑屏字幕过场 -->
            <div id="white-flash"></div>
            <div id="cutscene-overlay">
                <div class="cutscene-subtitle" id="cutsceneSubtitle"></div>
            </div>

            <!-- HUD 战斗界面 -->
            <div class="hud-overlay" id="hudOverlay" style="display: none;">
                <div class="hud-top-console">
                    <!-- 1. 龙血量 (20 HEARTS) -->
                    <div class="hud-card-hearts">
                        <div class="hearts-title-box">
                            <span class="hearts-label">巨龙生命值</span>
                            <span class="hearts-value" id="hpText">20.0 / 20.0</span>
                        </div>
                        <div class="hearts-grid" id="heartsGrid">
                            <!-- 10颗红心由JS生成 -->
                        </div>
                    </div>

                    <!-- 2. 腹中人数 (0/10 BELLY) -->
                    <div class="hud-card-belly">
                        <div class="belly-header">
                            <span>腹中收容</span>
                            <span id="bellyTitle">0 / 10</span>
                        </div>
                        <div class="belly-slots" id="bellySlots">
                            <!-- 10个胶囊槽位动态生成 -->
                        </div>
                        <div class="belly-info-text" id="bellyDigestInfo">肚子空空，请捕食士兵</div>
                    </div>

                    <!-- 3. 终点逃生距离 (LEVEL EXIT) -->
                    <div class="hud-card-exit">
                        <div class="exit-header">
                            <span>撤离防爆门</span>
                            <span id="exitDistText">剩余 4200m</span>
                        </div>
                        <div class="exit-track-bar">
                            <div class="exit-progress-fill" id="exitProgressFill"></div>
                            <span class="exit-dragon-head" id="exitDragonPin">🐉</span>
                        </div>
                    </div>

                    <!-- 控制按钮 -->
                    <div class="hud-actions">
                        <button class="btn-hud-tech" onclick="restartLevel()">重新开始</button>
                        <a href="index.html" class="btn-hud-tech">返回小院</a>
                    </div>
                </div>

                <!-- 底部提示栏 -->
                <div class="hud-bottom-bar">
                    <div class="hint-banner" id="hintBanner">加载中...</div>
                </div>
            </div>

            <!-- 移动端触控按键 -->
            <div class="touch-controls" id="touchControls">
                <div class="touch-dpad">
                    <button class="touch-btn" id="btnTouchLeft">◀</button>
                    <button class="touch-btn" id="btnTouchRight">▶</button>
                </div>
                <div class="touch-dpad">
                    <button class="touch-btn claw" id="btnTouchClaw" style="background: rgba(25, 118, 210, 0.75); border-color: #40c4ff;">挥爪</button>
                    <button class="touch-btn" id="btnTouchJump">跳跃</button>
                    <button class="touch-btn swallow" id="btnTouchSwallow">吞噬</button>
                </div>
            </div>

            <!-- 通关结算弹窗 -->
            <div class="modal-screen" id="clearModal">
                <div class="modal-box">
                    <h2 class="modal-title">🎉 第一关通关！</h2>
                    <p class="modal-desc" id="clearDesc">巨龙成功撞破实验室最后防爆大门，冲出绝密设施！</p>
                    <button class="btn-modal" onclick="restartLevel()">再次挑战</button>
                </div>
            </div>

            <!-- 失败结算弹窗 -->
            <div class="modal-screen" id="gameOverModal">
                <div class="modal-box" style="border-color: #f44336; box-shadow: 0 0 40px rgba(244, 67, 54, 0.5);">
                    <h2 class="modal-title" style="color: #ff5252;">💀 巨龙倒下了！</h2>
                    <p class="modal-desc">血量耗尽（0 / 20.0）。按 R 键或点击下方按钮重新挑战第一关。</p>
                    <button class="btn-modal" style="background: #d32f2f; border-color: #ff8a80;" onclick="restartLevel()">重新开始</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ==========================================
// 🎨 原版动作序列帧贴图载入器 (Sprite Sheet Preloader)
// ==========================================
const labSprites = {};
const labSpriteList = [
    'dragon_walk_0', 'dragon_walk_1', 'dragon_walk_2', 'dragon_walk_3', 'dragon_walk_4',
    'dragon_walk_5', 'dragon_walk_6', 'dragon_walk_7', 'dragon_walk_8', 'dragon_walk_9',
    'dragon_swallow_0', 'dragon_swallow_1', 'dragon_swallow_2', 'dragon_swallow_3',
    'dragon_swallow_4', 'dragon_swallow_5', 'dragon_swallow_6',
    'dragon_claw_0', 'dragon_claw_1', 'dragon_claw_2', 'dragon_claw_3',
    'claw_slash_fx', 'claw_impact_fx',
    'soldier_blue_recoil', 'soldier_gray_recoil', 'soldier_orange_recoil', 'soldier_black_recoil',
    'dragon_heavy_0', 'dragon_heavy_1', 'dragon_heavy_2', 'dragon_heavy_3',
    'dragon_feed_0', 'dragon_feed_1', 'dragon_explode',
    'blue_cap_0', 'blue_cap_1', 'blue_cap_2', 'blue_cap_3',
    'gray_cap_0', 'gray_cap_1', 'gray_cap_2', 'gray_cap_3',
    'red_orange_cap_0', 'red_orange_cap_1',
    'black_specops_0', 'black_specops_1', 'black_specops_2', 'black_specops_3'
];
const DRAGON_ANCHORS = {
    dragon_walk_0: 121,
    dragon_walk_1: 120,
    dragon_walk_2: 118,
    dragon_walk_3: 119,
    dragon_walk_4: 119,
    dragon_walk_5: 120,
    dragon_walk_6: 118,
    dragon_walk_7: 118,
    dragon_walk_8: 138,
    dragon_walk_9: 161,

    dragon_claw_0: 120,
    dragon_claw_1: 120,
    dragon_claw_2: 120,
    dragon_claw_3: 120,

    dragon_swallow_0: 118,
    dragon_swallow_1: 118,
    dragon_swallow_2: 113,
    dragon_swallow_3: 119,
    dragon_swallow_4: 114,
    dragon_swallow_5: 122,
    dragon_swallow_6: 125,

    dragon_heavy_0: 77,
    dragon_heavy_1: 77,
    dragon_heavy_2: 76,
    dragon_heavy_3: 83,

    dragon_feed_0: 110,
    dragon_feed_1: 87,

    dragon_explode: 102
};
let labSpritesLoaded = false;
let labSpritesLoadedCount = 0;
labSpriteList.forEach(name => {
    const img = new Image();
    img.src = 'assets/mode10/' + name + '.png';
    img.onload = () => {
        labSpritesLoadedCount++;
        if (labSpritesLoadedCount >= labSpriteList.length) {
            labSpritesLoaded = true;
        }
    };
    labSprites[name] = img;
});

// ==========================================
// 🔊 WEB AUDIO API 工业级声音合成器
// ==========================================
let audioCtx = null;
function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

function playSound(type) {
    try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        if (type === 'laser') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.35);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.35);
        } else if (type === 'cage_break') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(35, now + 0.5);
            gain.gain.setValueAtTime(0.6, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.5);
        } else if (type === 'swallow') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(260, now + 0.18);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.22);
        } else if (type === 'belly_bomb') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(80, now);
            osc.frequency.exponentialRampToValueAtTime(28, now + 0.65);
            gain.gain.setValueAtTime(0.8, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.65);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.65);
        } else if (type === 'shock') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(880, now + 0.05);
            osc.frequency.setValueAtTime(220, now + 0.1);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.18);
        } else if (type === 'fire') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(60, now + 0.28);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.28);
        } else if (type === 'explosion') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(25, now + 0.45);
            gain.gain.setValueAtTime(0.7, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.45);
        } else if (type === 'roar') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.linearRampToValueAtTime(180, now + 0.15);
            osc.frequency.exponentialRampToValueAtTime(45, now + 0.5);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.5);
        }
    } catch(e) {}
}

function calculateSpitChance(currentHp) {
    if (currentHp <= 0) return 0.0;
    const chance = 0.20 + (currentHp * 0.05);
    return Math.min(1.0, Math.max(0.0, chance));
}

// 1. 开场剧情过场流程 (CUTSCENE)

let cutsceneTimeouts = [];
function addCutsceneTimeout(fn, ms) {
    const id = setTimeout(fn, ms);
    cutsceneTimeouts.push(id);
    return id;
}
function clearAllCutsceneTimeouts() {
    cutsceneTimeouts.forEach(id => clearTimeout(id));
    cutsceneTimeouts = [];
}

function showSubtitleSequence(lines, index, onComplete) {
    if (index >= lines.length) {
        if (onComplete) onComplete();
        return;
    }
    cutsceneSubtitle.textContent = lines[index];
    addCutsceneTimeout(() => {
        showSubtitleSequence(lines, index + 1, onComplete);
    }, 1800);
}

function playOpeningCutscene() {
    clearAllCutsceneTimeouts();
    currentState = GameState.CUTSCENE;
    hudOverlay.style.display = 'none';
    clearModal.classList.remove('active');
    gameOverModal.classList.remove('active');
    cutsceneOverlay.style.display = 'flex';
    cutsceneOverlay.style.opacity = '1';
    cutsceneSubtitle.textContent = '';
    whiteFlash.style.opacity = '0';

    // 1. 实验室高压电光束射中人类强闪光
    playSound('laser');
    whiteFlash.style.opacity = '0.95';
    addCutsceneTimeout(() => {
        whiteFlash.style.opacity = '0.0';
    }, 450);

    // 2. 画面变黑，底部白色字幕依次显示
    const lines = [
        "啊，是龙！",
        "快跑！",
        "快把他抓起来！"
    ];

    addCutsceneTimeout(() => {
        showSubtitleSequence(lines, 0, () => {
            playSound('laser');
            whiteFlash.style.opacity = '1.0';
            addCutsceneTimeout(() => {
                cutsceneOverlay.style.display = 'none';
                hudOverlay.style.display = 'flex';
                setupLevel1Entities();
                updateHud();
                whiteFlash.style.opacity = '0.0';
                currentState = GameState.TRAPPED_IN_CAGE;
                hintBanner.textContent = "你已变成巨龙并被困在笼中！按 [J 键] 或 [D 键前冲] 撞破牢笼！";
            }, 400);
        });
    }, 1200);
}

// 3. 巨龙挥爪基础攻击 (C 键，伤害 1，士兵 5 血) 与吞噬机制
// ==========================================
function performDragonClaw() {
    if (currentState !== GameState.LEVEL_1_ACTIVE) return;
    if (dragon.clawCdTimer > 0.0) return;

    dragon.isClawing = true;
    dragon.clawAnimTimer = 0.28;
    dragon.clawCdTimer = CLAW_COOLDOWN;
    playSound('claw');

    // 攻击判定范围：龙嘴/前爪前方 170 像素
    const reachMinX = (dragon.facing === 1) ? dragon.x : (dragon.x - 170.0);
    const reachMaxX = (dragon.facing === 1) ? (dragon.x + 170.0) : dragon.x;

    let hitAny = false;
    for (let i = activeEnemies.length - 1; i >= 0; i--) {
        const e = activeEnemies[i];
        if (e.x >= reachMinX && e.x <= reachMaxX) {
            applyClawDamageToSoldier(e, i);
            hitAny = true;
        }
    }
    if (hitAny) {
        hintBanner.textContent = "蓝龙猛烈挥爪！将前方士兵瞬间击飞击败！";
    }
}

function applyClawDamageToSoldier(e, index) {
    hitSparks.push({
        x: e.x,
        y: e.y - 45,
        timer: 0.25
    });

    e.hitFlashTimer = 0.18;
    e.knockbackVx = dragon.facing * 240.0;
    e.hp = Math.max(0, (e.hp !== undefined ? e.hp : SOLDIER_MAX_HP) - 1);

    if (e.hp === 0) {
        e.isDowned = true;
        hintBanner.textContent = "士兵生命值降至 0 已倒下！现在吞下他被吐出的概率为 0%！";
    } else {
        const nextProb = Math.round(calculateSpitChance(e.hp) * 100);
        hintBanner.textContent = `挥爪命中！士兵剩余 ${e.hp} 滴血（此时吞下有 ${nextProb}% 概率被吐出）`;
    }
}

function performDragonSwallow() {
    if (currentState !== GameState.LEVEL_1_ACTIVE) return;

    const mouthX = dragon.x + (dragon.width * 0.42 * dragon.facing);
    const mouthY = dragon.y - dragon.height * 0.35;

    // 1. 优先低头吃前方地面的手雷 (GRENADE FEEDING 动作)
    for (let i = activeGrenades.length - 1; i >= 0; i--) {
        const g = activeGrenades[i];
        if (!g.swallowed && Math.hypot(g.x - mouthX, g.y - mouthY) <= 240.0) {
            g.swallowed = true;
            dragon.feedingGrenadeTimer = 0.45; // 触发低头贴地咬合动作
            playSound('swallow');
            hintBanner.textContent = "蓝龙低头一口吃掉了手雷！等待肚内引爆消化！";
            return;
        }
    }

    // 2. 没有手雷时，原版地表 7 步吞噬前方士兵（上限 10 人）
    if (swallowedHumans >= MAX_BELLY_CAPACITY) {
        hintBanner.textContent = "肚子已经装满 10 个人了！快吃颗手雷炸掉消化！";
        return;
    }

    if (dragon.swallowAction) return;

    for (let i = activeEnemies.length - 1; i >= 0; i--) {
        const e = activeEnemies[i];
        const dist = Math.hypot(e.x - mouthX, e.y - mouthY);
        const inFront = (e.x - dragon.x) * dragon.facing >= -20;
        if (dist <= 280.0 && inFront) {
            const capturedEnemy = {
                type: e.type,
                x: e.x,
                y: e.y,
                hp: (e.hp !== undefined ? e.hp : SOLDIER_MAX_HP),
                facing: e.facing || (dragon.facing === 1 ? -1 : 1)
            };

            // 从敌人列表移除，融入蓝龙原版 7 步吞噬序列
            activeEnemies.splice(i, 1);

            // 触发 7 步地表完整吞噬动作流（叼起 -> 抛空 -> 张嘴迎击 -> 叼入 -> 咬住 -> 仰头 -> 下咽）
            dragon.swallowAction = {
                timer: 0.0,
                duration: 1.26, // 1.26s 总时长，每帧约 0.18s
                enemy: capturedEnemy,
                biteSoundPlayed: false,
                catchSoundPlayed: false,
                swallowSoundPlayed: false
            };

            playSound('bite');
            return;
        }
    }

    // 周围无敌人时按 J，播放短动作咬合试探
    dragon.swallowAction = {
        timer: 0.0,
        duration: 0.38,
        enemy: null,
        biteSoundPlayed: false,
        catchSoundPlayed: false,
        swallowSoundPlayed: false
    };
    playSound('bite');
}

    for (let i = 0; i < 22; i++) {

            vx: (Math.random() - 0.5) * 200,
            vy: -Math.random() * 150 - 30,
            size: Math.random() * 12 + 6,
            color: 'rgba(255, 140, 0, 0.75)',
            life: 0.7
        });
    }

    updateHud();
    hintBanner.textContent = `手雷在腹中闷爆！炸碎并消化了腹中全部 ${count} 名士兵！腹部清空！`;
}

// 受到伤害
function applyDamageToDragon(amount, reason) {
    if (currentState !== GameState.LEVEL_1_ACTIVE) return;

    dragonHp = Math.max(0.0, dragonHp - amount);
    updateHud();
    hintBanner.textContent = reason;

    if (dragonHp <= 0.0) {
        currentState = GameState.GAME_OVER;
        gameOverModal.classList.add('active');
        hintBanner.textContent = "血量耗尽（0 / 20.0），蓝龙倒下了！按 R 键重新开始第一关。";
    }
}

// 重新开始
function restartLevel() {
    clearModal.classList.remove('active');
    gameOverModal.classList.remove('active');
    setupLevel1Entities();
    updateHud();
    currentState = GameState.LEVEL_1_ACTIVE;
    cage.broken = true;
    hintBanner.textContent = "关卡已重新开始！一路突围并吞噬敌人！";
}

// ==========================================
// 4. 物理与逻辑主更新循环
// ==========================================
let lastTime = performance.now();

// ==========================================
// 🍖 蓝龙原版 7 步完整地表吞咽动作逻辑
// 严格按照原图序列：1.叼起 -> 2.抛空 -> 3.张嘴迎击 -> 4.叼入 -> 5.咬住 -> 6.仰头 -> 7.吞咽入腹
// ==========================================
function updateSwallowAction(dt) {
    const sw = dragon.swallowAction;
    sw.timer += dt;
    const p = Math.min(1.0, sw.timer / sw.duration);
    const fIdx = Math.min(6, Math.floor(p * 7));

    // 音效分步触发
    if (fIdx === 0 && !sw.biteSoundPlayed) {
        playSound('bite');
        sw.biteSoundPlayed = true;
    }
    if (fIdx === 3 && !sw.catchSoundPlayed) {
        playSound('bite');
        sw.catchSoundPlayed = true;
    }
    if (fIdx === 6 && !sw.swallowSoundPlayed) {
        playSound('swallow');
        sw.swallowSoundPlayed = true;
        if (sw.enemy && swallowedHumans < MAX_BELLY_CAPACITY) {
            swallowedHumans++;
            naturalDigestTimer = 0.0;

            const enemyHp = (sw.enemy.hp !== undefined ? sw.enemy.hp : SOLDIER_MAX_HP);
            const spitProb = calculateSpitChance(enemyHp);
            const willEscape = (Math.random() < spitProb);

            dragonBellyList.push({
                enemy: sw.enemy,
                willSpitOut: willEscape,
                struggleTimer: 1.2
            });

            const pct = Math.round(spitProb * 100);
            if (enemyHp <= 0) {
                hintBanner.textContent = "吞下了 0 血倒下的士兵！吐出概率为 0%，稳稳留在腹中！";
            } else if (willEscape) {
                hintBanner.textContent = `吞下了 ${enemyHp} 血士兵（吐出概率 ${pct}%）—— 判定触发！在肚中剧烈挣扎，即将被吐出！`;
            } else {
                hintBanner.textContent = `吞下了 ${enemyHp} 血士兵（吐出概率 ${pct}%）—— 压制成功！留在腹中消化！`;
            }

            updateHud();
        }
    }

    if (p >= 1.0) {
        dragon.swallowAction = null;
    }
}

function updateGame(dt) {
    if (currentState === GameState.LEVEL_1_ACTIVE) {
        // --- A. 蓝龙吞咽动作流 OR 常规移动与重力 ---
        if (dragon.swallowAction) {
            updateSwallowAction(dt);
            dragon.vx = 0;
            if (!dragon.isOnFloor) {
                dragon.vy += gravity * dt;
                dragon.y += dragon.vy * dt;
                if (dragon.y >= 540.0) {
                    dragon.y = 540.0;
                    dragon.vy = 0;
                    dragon.isOnFloor = true;
                }
            }
        } else {
            let dir = 0;
            if (keys.right || keys.autoRun) dir += 1;
            if (keys.left) dir -= 1;

            if (dir !== 0) {
                dragon.facing = dir > 0 ? 1 : -1;
                const prevStep = Math.floor(dragon.stepCount * 1.1);
                dragon.stepCount += dt * 9.5;
                const newStep = Math.floor(dragon.stepCount * 1.1);
                if (newStep !== prevStep && dragon.isOnFloor) {
                    // 巨龙四足踏地扬尘
                    const isHeavy = swallowedHumans >= 5;
                    const dustCount = isHeavy ? 4 : 2;
                    for (let i = 0; i < dustCount; i++) {
                        activeParticles.push({
                            x: dragon.x - dragon.facing * (Math.random() * 50 + 20),
                            y: dragon.y - 2,
                            vx: -dragon.facing * (Math.random() * 60 + 20),
                            vy: -Math.random() * 25 - 5,
                            size: Math.random() * (isHeavy ? 6 : 4) + 2.5,
                            color: 'rgba(175, 195, 215, 0.5)',
                            life: 0.32
                        });
                    }
                }
            }

            // 吞人越多速度越沉重 (与 GDScript 一致)
            const speedFactor = 1.0 - (swallowedHumans * 0.025);
            dragon.vx = dir * dragon.moveSpeed * speedFactor;

            // 重力与跳跃
            dragon.vy += gravity * dt;
            dragon.x += dragon.vx * dt;
            dragon.y += dragon.vy * dt;

            if (dragon.y >= 540.0) {
                dragon.y = 540.0;
                dragon.vy = 0;
                dragon.isOnFloor = true;
            } else {
                dragon.isOnFloor = false;
            }

            if (keys.jump && dragon.isOnFloor) {
                dragon.vy = dragon.jumpVelocity;
                dragon.isOnFloor = false;
                keys.jump = false;
            }

            if (keys.swallow) {
                performDragonSwallow();
                keys.swallow = false;
            }
        }

        // 动作动画衰减
        if (dragon.swallowAnimTimer > 0) dragon.swallowAnimTimer -= dt;
        if (dragon.feedingGrenadeTimer > 0) dragon.feedingGrenadeTimer -= dt;
        if (dragon.bellyBulgeAnim > 0) dragon.bellyBulgeAnim = Math.max(0, dragon.bellyBulgeAnim - dt * 2.8);

        // 挥爪基础攻击冷却与动画
        if (dragon.clawCdTimer > 0) dragon.clawCdTimer -= dt;
        if (dragon.isClawing) {
            dragon.clawAnimTimer -= dt;
            if (dragon.clawAnimTimer <= 0) dragon.isClawing = false;
        }

        // 伤害飘字与击打星爆更新
        for (let i = damagePopups.length - 1; i >= 0; i--) {
            damagePopups[i].y -= 45.0 * dt;
            damagePopups[i].timer -= dt;
            if (damagePopups[i].timer <= 0) damagePopups.splice(i, 1);
        }
        for (let i = hitSparks.length - 1; i >= 0; i--) {
            hitSparks[i].timer -= dt;
            if (hitSparks[i].timer <= 0) hitSparks.splice(i, 1);
        }

        // 挑起吞食士兵物理轨迹
        if (dragon.tossedSoldier) {
            const ts = dragon.tossedSoldier;
            ts.x += ts.vx * dt;
            ts.y += ts.vy * dt;
            ts.vy += gravity * 0.9 * dt;
            ts.rot += ts.rotSpeed * dt;
            ts.timer -= dt;
            if (ts.timer <= 0) {
                dragon.tossedSoldier = null;
            }
        }

        // --- B. 感电状态与自然消化 ---
        if (electricTicksLeft > 0) {
            electricTickTimer += dt;
            if (electricTickTimer >= 1.0) {
                electricTickTimer -= 1.0;
                electricTicksLeft--;
                applyDamageToDragon(0.5, "电击持续感电伤害 (-0.5)");
                playSound('shock');
            }
        }

        if (swallowedHumans > 0) {
            naturalDigestTimer += dt;
            if (naturalDigestTimer >= NATURAL_DIGEST_INTERVAL) {
                naturalDigestTimer = 0.0;
                swallowedHumans--;
                updateHud();
                hintBanner.textContent = `自然消化了 1 个人！剩余腹中人数：${swallowedHumans}`;
            }
        } else {
            naturalDigestTimer = 0.0;
        }

        // 腹中挣扎判定与反刍吐出
        if (!dragon.spitOutAction) {
            for (let i = dragonBellyList.length - 1; i >= 0; i--) {
                const entry = dragonBellyList[i];
                if (entry.willSpitOut) {
                    entry.struggleTimer -= dt;
                    if (entry.struggleTimer <= 0) {
                        dragonBellyList.splice(i, 1);
                        swallowedHumans = Math.max(0, swallowedHumans - 1);
                        updateHud();
                        dragon.spitOutAction = {
                            timer: 0.0,
                            duration: 0.85,
                            enemy: entry.enemy
                        };
                        playSound('roar');
                        hintBanner.textContent = `咳呕！！蓝龙反刍张大龙嘴，将 ${entry.enemy.hp} 血士兵吐了出来！`;
                        break;
                    }
                }
            }
        } else {
            dragon.spitOutAction.timer += dt;
            if (dragon.spitOutAction.timer >= dragon.spitOutAction.duration) {
                const spEnemy = dragon.spitOutAction.enemy;
                const landX = Math.max(80, Math.min(FINISH_LINE_X + 200, dragon.x + dragon.facing * 175.0));
                activeEnemies.push({
                    type: spEnemy.type,
                    x: landX,
                    y: 540.0,
                    homeX: landX,
                    hp: spEnemy.hp,
                    maxHp: SOLDIER_MAX_HP,
                    isDowned: spEnemy.hp <= 0,
                    stunTimer: 1.6,
                    hitFlashTimer: 0.0,
                    knockbackVx: 0.0,
                    state: 'PATROL',
                    dir: -1,
                    patrolTimer: 1.5,
                    detectRange: 450.0,
                    width: 36.0,
                    height: 72.0,
                    timer: 2.0,
                    walkCycle: 0.0,
                    facing: -dragon.facing,
                    isFiring: false,
                    flameTimer: 0.0,
                    dustTimer: 0.0
                });
                dragon.spitOutAction = null;
            }
        }

        // --- C. 沿途士兵 AI 与跑动步频（双阶段：离远巡逻左右漫步 -> 靠近切换战斗形态） ---
        activeEnemies.forEach(e => {
            // 受击硬直闪烁与击退位移
            if (e.hitFlashTimer > 0) e.hitFlashTimer = Math.max(0, e.hitFlashTimer - dt);
            if (Math.abs(e.knockbackVx || 0) > 1.0) {
                e.x = Math.max(80.0, Math.min(FINISH_LINE_X + 200, e.x + e.knockbackVx * dt));
                e.knockbackVx = (e.knockbackVx > 0) ? Math.max(0, e.knockbackVx - 950.0 * dt) : Math.min(0, e.knockbackVx + 950.0 * dt);
            }

            // 晕眩硬直计时
            if (e.stunTimer > 0) {
                e.stunTimer = Math.max(0, e.stunTimer - dt);
                return;
            }

            // 0血倒下形态：失去行动能力，等待被吞下
            if (e.isDowned) {
                return;
            }

            const dist = Math.abs(dragon.x - e.x);
            const dirX = dragon.x < e.x ? -1 : 1;

            if (dist <= e.detectRange) {
                if (e.state !== 'COMBAT') {
                    e.state = 'COMBAT';
                }
                e.facing = dirX;
                e.dir = dirX;
            } else {
                e.state = 'PATROL';
            }

            if (e.state === 'PATROL') {
                e.patrolTimer -= dt;
                if (e.patrolTimer <= 0) {
                    e.patrolTimer = 1.2 + Math.random() * 1.6;
                    const choices = [-1, 1, -1, 1, 0];
                    e.dir = choices[Math.floor(Math.random() * choices.length)];
                    if (e.dir !== 0) e.facing = e.dir;
                }

                if (e.dir !== 0) {
                    e.x += e.dir * 48.0 * dt;
                    e.walkCycle += dt * 6.5;
                    if (Math.abs(e.x - e.homeX) > 95.0) {
                        e.dir = e.x > e.homeX ? -1 : 1;
                        e.facing = e.dir;
                    }
                } else {
                    e.walkCycle = 0;
                }
            } else if (e.state === 'COMBAT') {
                if (e.type === EnemyType.BLUE_HAT) {
                    // 蓝帽：平举电击枪瞄准放电
                    e.walkCycle = 0;
                    e.isFiring = true;
                    e.timer += dt;
                    if (e.timer >= 3.2) {
                        e.timer = 0.0;
                        applyDamageToDragon(0.5, "被蓝帽电击枪击中！(-0.5，进入5秒感电)");
                        electricTicksLeft = 5;
                        electricTickTimer = 0.0;
                        playSound('shock');
                    }
                } else if (e.type === EnemyType.GRAY_HAT) {
                    // 灰帽：冲锋奔跑扑向龙（速度放慢为 165.0 稳定奔跑，步态帧率平滑高刷）
                    if (dist > 50.0) {
                        e.x += dirX * 165.0 * dt;
                        e.walkCycle += dt * 6.5;
                        e.dustTimer = (e.dustTimer || 0) + dt;
                        if (e.dustTimer >= 0.1) {
                            e.dustTimer = 0;
                            activeParticles.push({
                                x: e.x - e.facing * 14,
                                y: e.y - 2,
                                vx: -e.facing * (Math.random() * 50 + 20),
                                vy: -Math.random() * 20 - 4,
                                size: Math.random() * 4 + 2,
                                color: 'rgba(180, 205, 230, 0.55)',
                                life: 0.3
                            });
                        }
                    } else {
                        e.walkCycle = 0;
                    }
                } else if (e.type === EnemyType.RED_ORANGE) {
                    // 红/橘帽：双手端平喷火枪蓄力
                    e.walkCycle = 0;
                    if (e.flameTimer > 0) e.flameTimer -= dt;
                    e.timer += dt;
                    if (e.timer >= 3.0) {
                        e.timer = 0.0;
                        e.flameTimer = 0.4;
                        playSound('fire');
                        activeFireballs.push({
                            x: e.x + e.facing * 24,
                            y: e.y - 42,
                            vx: dirX * 380.0
                        });
                    }
                } else if (e.type === EnemyType.BLACK_SPECOPS) {
                    // 黑色特种兵：高举手雷蓄力抛掷
                    e.walkCycle = 0;
                    e.timer += dt;
                    if (e.timer >= 10.0) {
                        e.timer = 0.0;
                        activeGrenades.push({
                            x: e.x + e.facing * 22,
                            y: e.y - 45,
                            vx: dirX * 280.0,
                            vy: -320.0,
                            fuse: 5.0,
                            swallowed: false
                        });
                        hintBanner.textContent = "警告！特种兵抛出了手雷，5秒内低头吃掉它！";
                    }
                }
            }
        });

        // --- D. 火焰弹与手雷更新 ---
        for (let i = activeFireballs.length - 1; i >= 0; i--) {
            const fb = activeFireballs[i];
            fb.x += fb.vx * dt;
            if (Math.hypot(fb.x - dragon.x, fb.y - (dragon.y - 70)) < 90.0) {
                applyDamageToDragon(1.0, "被火焰弹击中！(-1.0 血)");
                activeFireballs.splice(i, 1);
            } else if (Math.abs(fb.x - dragon.x) > 1200.0) {
                activeFireballs.splice(i, 1);
            }
        }

        for (let i = activeGrenades.length - 1; i >= 0; i--) {
            const g = activeGrenades[i];
            g.fuse -= dt;

            if (g.swallowed) {
                // 跟随龙移动在龙腹内
                g.x = dragon.x - 20;
                g.y = dragon.y - 45;
            } else {
                // 空中抛物线落地
                if (g.y < 530.0) {
                    g.vy += gravity * dt;
                    g.y += g.vy * dt;
                    g.x += g.vx * dt;
                } else {
                    g.y = 530.0;
                    g.vx *= 0.85;
                }
            }

            // 引爆
            if (g.fuse <= 0.0) {
                if (g.swallowed) {
                    triggerBellyGrenadeExplosion();
                } else {
                    playSound('explosion');
                    if (Math.hypot(g.x - dragon.x, g.y - dragon.y) <= 220.0) {
                        applyDamageToDragon(5.0, "手雷在身边爆炸！受到 5.0 点巨额伤害！");
                    }
                }
                activeGrenades.splice(i, 1);
            }
        }

        // --- E. 终点判定 ---
        if (dragon.x >= FINISH_LINE_X) {
            currentState = GameState.LEVEL_CLEAR;
            clearModal.classList.add('active');
            hintBanner.textContent = "恭喜通关！巨龙冲破防爆大门，成功逃离第一层实验室！";
        }

        // 摄像机平滑跟随
        cameraX += (dragon.x - 380 - cameraX) * 0.12;

        // 更新终点距离
        const distLeft = Math.max(0, Math.round(FINISH_LINE_X - dragon.x));
        exitDistText.textContent = `剩余 ${distLeft}m`;
        const prog = Math.min(100, Math.max(0, (dragon.x - 220) / (FINISH_LINE_X - 220) * 100));
        exitProgressFill.style.width = `${prog}%`;
    }

    // 粒子更新
    for (let i = activeParticles.length - 1; i >= 0; i--) {
        const p = activeParticles[i];
        p.x += (p.vx || 0) * dt;
        p.y += (p.vy || 0) * dt;
        p.life -= dt;
        if (p.life <= 0) activeParticles.splice(i, 1);
    }
}

// ==========================================
// 5. 渲染循环 (2D 画布高保真复刻设计图)
// ==========================================
function renderGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 实验室科幻背景长廊与工作站
    drawLabBackground();

    ctx.save();
    ctx.translate(-cameraX, 0);

    // 2. 牢笼 (破笼前完整高压牢笼，破笼后展示扭曲破裂残骸)
    drawCage();

    // 3. 终点防爆门 (Finish Line Bulkhead)
    drawFinishLine();

    // 4. 投掷物 (火焰弹、手雷)
    drawProjectiles();

    // 5. 敌人走动与攻击绘制
    drawEnemies();

    // 6. 巨龙绘制 (10倍大、四足奔跑、翅膀、角瞳、腹部动态鼓胀)
    drawBlueDragon();

    // 7. 挑起吞食士兵动画
    drawTossedSoldier();

    // 8. 粒子微粒绘制
    drawParticles();

    // 9. 战斗击打星爆与受击伤害飘字 (-1)
    drawCombatEffects();

    ctx.restore();
}

function drawCombatEffects() {
    // 击打星爆
    for (let sp of hitSparks) {
        const sparkImg = labSprites['claw_impact_fx'];
        if (sparkImg && sparkImg.complete && sparkImg.naturalWidth > 0) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, sp.timer / 0.25);
            ctx.drawImage(sparkImg, sp.x - 22, sp.y - 22, 44, 44);
            ctx.restore();
        } else {
            ctx.save();
            ctx.fillStyle = '#ff5722';
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, 16 * (sp.timer / 0.25), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // 伤害飘字 (-1)
    for (let pop of damagePopups) {
        const alpha = Math.max(0, Math.min(1.0, pop.timer / 0.65));
        ctx.save();
        ctx.font = 'bold 24px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = `rgba(255, 60, 60, ${alpha})`;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        ctx.shadowBlur = 6;
        ctx.fillText(pop.text, pop.x, pop.y);
        ctx.restore();
    }
}

// ==========================================
// 绘制高科技实验室背景 (1:1 像素级复刻原图第3部分：白银冷钢走廊、嵌入式天花板灯、双屏工作站与桁架)
// ==========================================
function drawLabBackground() {
    // 1. 实验室金属银白冷钢墙面渐变
    const bgGrad = ctx.createLinearGradient(0, 0, 0, 540);
    bgGrad.addColorStop(0, '#eaf2f8');
    bgGrad.addColorStop(0.2, '#ddeaf5');
    bgGrad.addColorStop(0.6, '#cbdeee');
    bgGrad.addColorStop(0.9, '#b8cee0');
    bgGrad.addColorStop(1.0, '#a5bcd0');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, 540);

    // 2. 顶部重型金属天花板构架梁 (Y: 0 ~ 44)
    const ceilGrad = ctx.createLinearGradient(0, 0, 0, 44);
    ceilGrad.addColorStop(0, '#8fa5b8');
    ceilGrad.addColorStop(0.85, '#6b8296');
    ceilGrad.addColorStop(1, '#53687c');
    ctx.fillStyle = ceilGrad;
    ctx.fillRect(0, 0, canvas.width, 44);

    // 天花板底部亮面铝合金压条
    ctx.fillStyle = '#b0c4d6';
    ctx.fillRect(0, 42, canvas.width, 2);

    // 3. 嵌入式冷白荧光顶灯组 (带柔和下照透光光锥)
    const nowMs = performance.now();
    const lightSpacing = 320;
    const startLight = Math.floor(cameraX / lightSpacing) * lightSpacing;
    for (let lx = startLight - cameraX; lx < canvas.width + lightSpacing; lx += lightSpacing) {
        // 灯具外框槽 (嵌在天花板底边)
        ctx.fillStyle = '#425565';
        ctx.fillRect(lx + 40, 14, 150, 16);
        ctx.strokeStyle = '#2d3b46';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(lx + 40, 14, 150, 16);

        // 发光荧光漫射板
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#80d8ff';
        ctx.shadowBlur = 14;
        ctx.fillRect(lx + 46, 18, 138, 8);
        ctx.shadowBlur = 0;

        // 柔和半透明下照光锥梯形 (Soft Volumetric Down-Light Cone)
        ctx.save();
        const coneGrad = ctx.createLinearGradient(0, 44, 0, 460);
        coneGrad.addColorStop(0, 'rgba(230, 246, 255, 0.16)');
        coneGrad.addColorStop(0.5, 'rgba(215, 238, 255, 0.08)');
        coneGrad.addColorStop(1, 'rgba(200, 230, 255, 0)');
        ctx.fillStyle = coneGrad;
        ctx.beginPath();
        ctx.moveTo(lx + 42, 44);
        ctx.lineTo(lx + 188, 44);
        ctx.lineTo(lx + 245, 460);
        ctx.lineTo(lx - 15, 460);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    // 4. 模块化金属墙板双线缝隙与六角防脱螺栓
    const colSpacing = 160;
    const startCol = Math.floor(cameraX / colSpacing) * colSpacing;
    for (let x = startCol - cameraX; x < canvas.width + colSpacing; x += colSpacing) {
        // 双线精密接缝：暗凹槽 + 高光边
        ctx.strokeStyle = '#859cb0';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, 44);
        ctx.lineTo(x, 540);
        ctx.stroke();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + 1.5, 44);
        ctx.lineTo(x + 1.5, 540);
        ctx.stroke();

        // 精密内六角沉头螺栓 (嵌入金属板边缘)
        const boltYs = [75, 155, 240, 325, 410, 495];
        boltYs.forEach(by => {
            ctx.fillStyle = '#546b7e';
            ctx.beginPath();
            ctx.arc(x - 6, by, 2.5, 0, Math.PI * 2);
            ctx.arc(x + 8, by, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // 螺栓金属高光点
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x - 7, by - 1, 1, 1);
            ctx.fillRect(x + 7, by - 1, 1, 1);
        });
    }

    // 墙板中段水平拉丝铝合金导轨线槽 (Y: 175 & 460)
    ctx.fillStyle = '#7a91a4';
    ctx.fillRect(0, 175, canvas.width, 5);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 175, canvas.width, 1);

    ctx.fillStyle = '#72899c';
    ctx.fillRect(0, 460, canvas.width, 6);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 460, canvas.width, 1);

    // 5. 墙面高科技终端工作站 (1:1 对齐原图：双显示屏、示波器电波、数据终端、服务器机柜、键盘托板)
    const stationSpacing = 640;
    const startStation = Math.floor(cameraX / stationSpacing) * stationSpacing;
    for (let sx = startStation - cameraX; sx < canvas.width + stationSpacing; sx += stationSpacing) {
        // A. 顶部天花板下垂线缆导管 (两根黑色柔性管线)
        ctx.fillStyle = '#2c3945';
        ctx.fillRect(sx + 70, 44, 4, 180);
        ctx.fillRect(sx + 240, 44, 4, 180);

        // B. 左显示屏 (终端数据与代码扫描线)
        // 外部金属外壳边框
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(sx + 30, 218, 140, 86);
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx + 30, 218, 140, 86);

        // 内部屏幕深海青视窗
        ctx.fillStyle = '#031726';
        ctx.fillRect(sx + 35, 223, 130, 76);

        // 终端代码扫描线数据块 (青色动态数据流)
        ctx.fillStyle = '#00e5ff';
        const lineRows = [
            { y: 232, w: 75 }, { y: 240, w: 105 }, { y: 248, w: 55 },
            { y: 256, w: 90 }, { y: 264, w: 65 }, { y: 272, w: 110 },
            { y: 280, w: 45 }, { y: 288, w: 80 }
        ];
        lineRows.forEach((row, idx) => {
            const flicker = Math.sin(nowMs * 0.008 + sx + idx) > -0.6;
            if (flicker) {
                ctx.fillRect(sx + 40, row.y, row.w, 3.5);
                // 末尾闪烁光标
                if (idx === 7 && Math.sin(nowMs * 0.01) > 0) {
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(sx + 40 + row.w + 4, row.y - 1, 5, 5.5);
                    ctx.fillStyle = '#00e5ff';
                }
            }
        });

        // C. 右显示屏 (精密生物电波 / 声纳示波器雷达视窗)
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(sx + 185, 218, 140, 86);
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx + 185, 218, 140, 86);

        ctx.fillStyle = '#031726';
        ctx.fillRect(sx + 190, 223, 130, 76);

        // 示波器深暗网格线
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.18)';
        ctx.lineWidth = 1;
        for (let gx = 200; gx < 315; gx += 15) {
            ctx.beginPath(); ctx.moveTo(sx + gx, 223); ctx.lineTo(sx + gx, 299); ctx.stroke();
        }
        for (let gy = 233; gy < 295; gy += 13) {
            ctx.beginPath(); ctx.moveTo(sx + 190, gy); ctx.lineTo(sx + 320, gy); ctx.stroke();
        }

        // 示波器动态发光青色正弦波 (带有辉光效果)
        ctx.save();
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 8;
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        for (let px = 0; px < 130; px += 3) {
            const py = Math.sin((sx + px) * 0.09 + nowMs * 0.005) * 17 + 261;
            if (px === 0) ctx.moveTo(sx + 190 + px, py);
            else ctx.lineTo(sx + 190 + px, py);
        }
        ctx.stroke();
        ctx.restore();

        // D. 双显示器下方壁挂键盘操作台板
        ctx.fillStyle = '#334155';
        ctx.fillRect(sx + 35, 308, 285, 12);
        ctx.fillStyle = '#64748b';
        ctx.fillRect(sx + 35, 308, 285, 2);
        // 微型背光按键列
        ctx.fillStyle = '#38bdf8';
        for (let kx = 42; kx < 310; kx += 7) {
            ctx.fillRect(sx + kx, 312, 4.5, 3);
        }

        // E. 右侧机房主控服务器机柜塔 (Server Rack Tower)
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(sx + 338, 214, 52, 108);
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(sx + 338, 214, 52, 108);

        // 机柜散热水平百叶槽
        ctx.fillStyle = '#0f172a';
        for (let ly = 250; ly < 315; ly += 7) {
            ctx.fillRect(sx + 344, ly, 40, 3);
        }

        // 垂直排列微型指示灯组 (绿色、青色、琥珀色、红色交替微闪)
        const ledList = [
            { col: '#22c55e', blink: Math.sin(nowMs * 0.006 + sx) > -0.2 },
            { col: '#06b6d4', blink: true },
            { col: '#22c55e', blink: Math.cos(nowMs * 0.009 + sx) > -0.4 },
            { col: '#f59e0b', blink: Math.sin(nowMs * 0.012 + sx) > 0.2 },
            { col: '#ef4444', blink: Math.sin(nowMs * 0.004 + sx) > 0.6 }
        ];
        ledList.forEach((led, i) => {
            ctx.fillStyle = led.blink ? led.col : '#1e293b';
            ctx.beginPath();
            ctx.arc(sx + 352 + (i % 2) * 18, 226 + Math.floor(i / 2) * 11, 2.5, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    // 6. 高架工业走廊钢桁架地面 (Y: 540 ~ 720)
    // A. 行走高抗磨防滑钢板台面 (Y: 540 ~ 552)
    const deckGrad = ctx.createLinearGradient(0, 540, 0, 552);
    deckGrad.addColorStop(0, '#62798e');
    deckGrad.addColorStop(0.3, '#4d6377');
    deckGrad.addColorStop(1, '#344758');
    ctx.fillStyle = deckGrad;
    ctx.fillRect(0, 540, canvas.width, 12);

    // 行走面顶部金属抛光边
    ctx.fillStyle = '#8ea4ba';
    ctx.fillRect(0, 540, canvas.width, 1.8);

    // B. 安全警示斜向黄黑斑马线条带 (1:1 比例：12px 精密斜纹)
    const stripeW = 18;
    const stripeOffset = -cameraX % (stripeW * 2);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(0, 552, canvas.width, 12);
    ctx.fillStyle = '#1e293b';
    for (let x = stripeOffset - stripeW * 2; x < canvas.width + stripeW * 2; x += stripeW * 2) {
        ctx.beginPath();
        ctx.moveTo(x, 552);
        ctx.lineTo(x + stripeW, 552);
        ctx.lineTo(x, 564);
        ctx.lineTo(x - stripeW, 564);
        ctx.closePath();
        ctx.fill();
    }
    // 警示条上下精密收边条
    ctx.fillStyle = '#37474f';
    ctx.fillRect(0, 552, canvas.width, 1);
    ctx.fillRect(0, 563, canvas.width, 1.5);

    // C. 底部暗层深渊与结构 X 型钢桁架支撑梁 (Y: 564 ~ 720)
    const underGrad = ctx.createLinearGradient(0, 564, 0, 720);
    underGrad.addColorStop(0, '#101722');
    underGrad.addColorStop(0.5, '#0c121b');
    underGrad.addColorStop(1, '#070a10');
    ctx.fillStyle = underGrad;
    ctx.fillRect(0, 564, canvas.width, 156);

    // 结构立柱与 X 型斜撑
    const trussSpacing = 160;
    const startTruss = Math.floor(cameraX / trussSpacing) * trussSpacing;
    for (let x = startTruss - cameraX; x < canvas.width + trussSpacing; x += trussSpacing) {
        // 重工工字钢立柱 (Vertical Columns)
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(x - 9, 564, 18, 156);
        ctx.fillStyle = '#475569';
        ctx.fillRect(x - 9, 564, 3, 156);
        ctx.fillRect(x + 6, 564, 3, 156);

        // X型斜撑杆 (立体光影双色线)
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#334155';
        ctx.beginPath();
        ctx.moveTo(x + 9, 568);
        ctx.lineTo(x + trussSpacing - 9, 705);
        ctx.moveTo(x + trussSpacing - 9, 568);
        ctx.lineTo(x + 9, 705);
        ctx.stroke();

        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#64748b';
        ctx.beginPath();
        ctx.moveTo(x + 9, 568);
        ctx.lineTo(x + trussSpacing - 9, 705);
        ctx.stroke();

        // 桁架中心加固圆盘节点板 (Gusset Plate) 与四角铆钉
        const cx = x + trussSpacing / 2;
        const cy = 636;
        ctx.fillStyle = '#334155';
        ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        [-4, 4].forEach(ox => {
            [-4, 4].forEach(oy => {
                ctx.fillRect(cx + ox - 1, cy + oy - 1, 2, 2);
            });
        });
    }

    // 桁架底部横梁基座
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 706, canvas.width, 14);
    ctx.fillStyle = '#475569';
    ctx.fillRect(0, 706, canvas.width, 2);
}

// ==========================================
// 绘制高压牢笼 (1:1 原图：圆柱体反光铁柱 vs 撞破断裂残骸与散落铁渣)
// ==========================================
function drawCage() {
    ctx.save();
    const cageLeft = cage.x - cage.w / 2;
    const cageRight = cage.x + cage.w / 2;
    const cageTop = cage.y - cage.h;
    const cageBottom = cage.y;

    if (!cage.broken) {
        // --- 破笼前：高压激光锁牢笼 ---
        // 顶部与底部重型箱型钢梁 (带有金属高光)
        const beamGrad = ctx.createLinearGradient(0, cageTop, 0, cageTop + 24);
        beamGrad.addColorStop(0, '#64748b');
        beamGrad.addColorStop(0.5, '#334155');
        beamGrad.addColorStop(1, '#1e293b');

        ctx.fillStyle = beamGrad;
        ctx.fillRect(cageLeft, cageTop, cage.w, 24);
        ctx.fillRect(cageLeft, cageBottom - 18, cage.w, 18);

        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cageLeft, cageTop, cage.w, 24);
        ctx.strokeRect(cageLeft, cageBottom - 18, cage.w, 18);

        // 牢笼两侧立柱
        ctx.fillStyle = '#334155';
        ctx.fillRect(cageLeft, cageTop, 18, cage.h);
        ctx.fillRect(cageRight - 18, cageTop, 18, cage.h);

        // 立体圆柱形金属栏杆 (中心反光高光渐变，呈现真实圆柱钢管质感)
        const barSpacing = 26;
        for (let bx = cageLeft + 28; bx < cageRight - 18; bx += barSpacing) {
            const barGrad = ctx.createLinearGradient(bx - 4, 0, bx + 4, 0);
            barGrad.addColorStop(0, '#1e293b');
            barGrad.addColorStop(0.35, '#cbd5e1');
            barGrad.addColorStop(0.65, '#ffffff');
            barGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = barGrad;
            ctx.fillRect(bx - 4, cageTop + 24, 8, cage.h - 42);
        }

        // 顶部高压电磁锁红灯中枢 (Pulsing Security Beacon)
        const nowMs = performance.now();
        const pulse = Math.sin(nowMs * 0.008) * 0.3 + 0.7;
        ctx.save();
        ctx.beginPath();
        ctx.arc(cage.x, cageTop, 15, 0, Math.PI * 2);
        ctx.fillStyle = '#dc2626';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 18 * pulse;
        ctx.fill();
        ctx.restore();

        // 锁具中心高光晶体
        ctx.fillStyle = '#fee2e2';
        ctx.beginPath();
        ctx.arc(cage.x - 3, cageTop - 4, 4, 0, Math.PI * 2);
        ctx.fill();

        // 高压警戒标志字
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText("HIGH VOLTAGE ⚡ 高压牢笼", cage.x, cageTop + 17);
    } else {
        // --- 破笼后：被巨龙暴击冲撞断裂、向外扭曲爆裂的钢铁残骸 ---
        // 左侧残存框架
        ctx.fillStyle = '#334155';
        ctx.fillRect(cageLeft, cageTop, 18, cage.h);
        ctx.fillRect(cageLeft, cageTop, 75, 22);
        ctx.fillRect(cageLeft, cageBottom - 18, 90, 18);

        // 断裂向右前方炸开的扭曲弯折栏杆
        ctx.lineCap = 'round';
        const brokenBars = [
            // { sx, sy, mx, my, ex, ey }
            { sx: cageLeft + 30, mx: cageLeft + 35, my: cageBottom - 120, ex: cageLeft + 40, ey: cageTop + 24 },
            { sx: cageLeft + 55, mx: cageLeft + 60, my: cageBottom - 100, ex: cageLeft + 70, ey: cageTop + 45 },
            { sx: cageLeft + 80, mx: cageLeft + 120, my: cageBottom - 70, ex: cageLeft + 165, ey: cageBottom - 35 },
            { sx: cageLeft + 105, mx: cageLeft + 155, my: cageBottom - 85, ex: cageLeft + 210, ey: cageBottom - 45 },
            { sx: cageLeft + 130, mx: cageLeft + 185, my: cageBottom - 95, ex: cageLeft + 250, ey: cageBottom - 55 },
            { sx: cageLeft + 155, mx: cageLeft + 205, my: cageBottom - 110, ex: cageLeft + 275, ey: cageBottom - 70 },
            { sx: cageLeft + 180, mx: cageLeft + 220, my: cageBottom - 130, ex: cageLeft + 290, ey: cageBottom - 85 }
        ];

        brokenBars.forEach(bar => {
            // 栏杆阴影与主体
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(bar.sx, cageBottom - 18);
            ctx.quadraticCurveTo(bar.mx, bar.my, bar.ex, bar.ey);
            ctx.stroke();

            // 栏杆反光高光
            ctx.lineWidth = 3.5;
            ctx.strokeStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.moveTo(bar.sx, cageBottom - 18);
            ctx.quadraticCurveTo(bar.mx, bar.my, bar.ex, bar.ey);
            ctx.stroke();

            // 尖锐断口
            ctx.fillStyle = '#f1f5f9';
            ctx.beginPath();
            ctx.arc(bar.ex, bar.ey, 3, 0, Math.PI * 2);
            ctx.fill();
        });

        // 地面散落的金属碎渣与断裂螺栓 (Debris)
        ctx.fillStyle = '#64748b';
        const debris = [
            { x: cage.x + 30, y: cageBottom - 4, w: 12, h: 4 },
            { x: cage.x + 65, y: cageBottom - 6, w: 18, h: 5 },
            { x: cage.x + 95, y: cageBottom - 4, w: 9, h: 4 },
            { x: cage.x + 130, y: cageBottom - 5, w: 15, h: 4 },
            { x: cage.x + 160, y: cageBottom - 4, w: 8, h: 3 },
            { x: cage.x + 190, y: cageBottom - 6, w: 22, h: 5 }
        ];
        debris.forEach(d => {
            ctx.fillRect(d.x, d.y, d.w, d.h);
        });

        // 顶部断线迸射的微型电火花 (Electric Sparks)
        const nowMs = performance.now();
        if (Math.sin(nowMs * 0.02) > 0.3) {
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cageLeft + 75, cageTop + 22);
            ctx.lineTo(cageLeft + 85 + (Math.random() - 0.5) * 12, cageTop + 35 + Math.random() * 8);
            ctx.stroke();
        }
    }
    ctx.restore();
}
