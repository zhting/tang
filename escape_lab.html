<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>逃离实验室 - 模式十</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030710;
            font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
            color: #d9e9ff;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 50%, #0a1628 0%, #02050c 100%);
            overflow: hidden;
            padding: 10px;
        }

        /* 外部高科技实验室独立机架边框 (Titanium Cyber Bezel) */
        .lab-terminal-bezel {
            position: relative;
            width: 100%;
            max-width: 1320px;
            height: 100%;
            max-height: 760px;
            display: flex;
            flex-direction: column;
            background: #091322;
            border: 3px solid #00e5ff;
            border-radius: 14px;
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.4), inset 0 0 35px rgba(0, 114, 206, 0.35);
            overflow: hidden;
        }

        .lab-terminal-bezel::after {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 10px;
            pointer-events: none;
            z-index: 35;
        }

        /* 顶端科幻仪器状态条 */
        .lab-bezel-header {
            height: 38px;
            background: linear-gradient(180deg, #18283d 0%, #0b1524 100%);
            border-bottom: 2px solid #00b0ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 13px;
            font-weight: bold;
            color: #80d8ff;
            letter-spacing: 1px;
            flex-shrink: 0;
            z-index: 30;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-status-badge {
            background: rgba(0, 230, 118, 0.15);
            border: 1px solid #00e676;
            color: #69f0ae;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            animation: pulseStatus 2s infinite;
        }

        @keyframes pulseStatus {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-btn {
            background: #102642;
            color: #b3e5fc;
            border: 1.5px solid #0288d1;
            padding: 4px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .header-btn:hover {
            background: #0288d1;
            color: #fff;
            box-shadow: 0 0 12px rgba(2, 136, 209, 0.6);
        }

        /* 画布主视口 */
        .canvas-viewport {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #030811;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #c8d8e6;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* HUD 图层 */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 18px;
            z-index: 20;
        }

        /* 顶部高科技整合状态条 (对齐设计原图) */
        .hud-top-console {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(16, 30, 48, 0.94) 0%, rgba(8, 16, 28, 0.94) 100%);
            border: 1.5px solid #00b0ff;
            border-radius: 8px;
            padding: 8px 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 176, 255, 0.25);
            backdrop-filter: blur(6px);
        }

        /* 1. 生命值红心模块 (20 HEARTS) */
        .hud-card-hearts {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hearts-title-box {
            display: flex;
            flex-direction: column;
        }

        .hearts-label {
            font-size: 11px;
            font-weight: 900;
            color: #80d8ff;
            letter-spacing: 0.5px;
        }

        .hearts-value {
            font-size: 15px;
            font-weight: 900;
            color: #ff5252;
            text-shadow: 0 0 10px rgba(255, 82, 82, 0.6);
        }

        .hearts-grid {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .heart-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
            filter: drop-shadow(0 0 4px rgba(255, 23, 68, 0.6));
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .heart-icon.lost {
            filter: grayscale(1) opacity(0.25);
            transform: scale(0.85);
        }

        /* 2. 腹中容量电池槽位 (0/10 BELLY) */
        .hud-card-belly {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .belly-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 900;
            color: #80d8ff;
        }

        .belly-slots {
            display: flex;
            gap: 5px;
        }

        .belly-capsule {
            width: 15px;
            height: 24px;
            border: 1.5px solid #00b0ff;
            border-radius: 4px;
            background: rgba(0, 77, 138, 0.35);
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .belly-capsule.filled {
            background: linear-gradient(180deg, #00e5ff 0%, #0091ea 100%);
            border-color: #e0f7fa;
            box-shadow: 0 0 10px #00e5ff;
            transform: scale(1.1);
        }

        .belly-capsule.filled::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            height: 5px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 2px;
        }

        .belly-info-text {
            font-size: 11px;
            color: #90caf9;
        }

        /* 3. 终点逃生距离进度 (LEVEL EXIT) */
        .hud-card-exit {
            display: flex;
            flex-direction: column;
            min-width: 180px;
            gap: 4px;
        }

        .exit-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 900;
            color: #69f0ae;
            letter-spacing: 0.5px;
        }

        .exit-track-bar {
            width: 100%;
            height: 12px;
            background: #091728;
            border: 1px solid #00e676;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .exit-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00b0ff 0%, #00e676 100%);
            border-radius: 5px;
            transition: width 0.15s linear;
        }

        .exit-dragon-head {
            position: absolute;
            top: -3px;
            right: -6px;
            font-size: 13px;
            pointer-events: none;
        }

        /* 操作按钮组 */
        .hud-actions {
            display: flex;
            gap: 8px;
        }

        .btn-hud-tech {
            background: linear-gradient(180deg, #1565c0 0%, #0d47a1 100%);
            color: #ffffff;
            border: 1.5px solid #42a5f5;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .btn-hud-tech:hover {
            background: linear-gradient(180deg, #1976d2 0%, #1565c0 100%);
            border-color: #82b1ff;
            transform: translateY(-2px);
            box-shadow: 0 0 14px rgba(66, 165, 245, 0.6);
        }

        .btn-hud-tech:active {
            transform: translateY(1px);
        }

        /* 底部动态指示提示 */
        .hud-bottom-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .hint-banner {
            background: rgba(4, 15, 30, 0.92);
            border: 1.5px solid #00b0ff;
            color: #e0f7fa;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.75), 0 0 12px rgba(0, 176, 255, 0.35);
            text-align: center;
            max-width: 90%;
            transition: all 0.3s ease;
        }

        /* 触控按键 (移动端适配) */
        .touch-controls {
            display: none;
            position: absolute;
            bottom: 16px;
            width: calc(100% - 32px);
            left: 16px;
            justify-content: space-between;
            pointer-events: auto;
            z-index: 25;
        }

        .touch-dpad {
            display: flex;
            gap: 12px;
        }

        .touch-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(13, 71, 161, 0.8);
            border: 2px solid #42a5f5;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .touch-btn:active {
            background: #1976d2;
            transform: scale(0.92);
        }

        .touch-btn.swallow {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #00b0ff 0%, #0091ea 100%);
            border-color: #e0f7fa;
            font-size: 15px;
        }

        /* 剧情过场黑屏与字幕容器 */
        #cutscene-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 90px;
            z-index: 50;
            transition: opacity 0.5s ease;
        }

        .cutscene-subtitle {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
            min-height: 40px;
            text-align: center;
        }

        #white-flash {
            position: absolute;
            inset: 0;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 60;
            transition: opacity 0.3s ease;
        }

        /* 结算弹窗 */
        .modal-screen {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 14, 0.88);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 70;
        }

        .modal-screen.active {
            display: flex;
        }

        .modal-box {
            background: linear-gradient(135deg, #0b1a2e 0%, #050d18 100%);
            border: 2px solid #00e676;
            border-radius: 12px;
            padding: 32px 48px;
            text-align: center;
            max-width: 480px;
            box-shadow: 0 10px 40px rgba(0, 230, 118, 0.35);
        }

        .modal-title {
            font-size: 26px;
            font-weight: bold;
            color: #00e676;
            margin-bottom: 14px;
        }

        .modal-desc {
            font-size: 15px;
            color: #b0bec5;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn-modal {
            background: #00c853;
            color: #fff;
            border: none;
            padding: 10px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn-modal:hover {
            background: #00e676;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .touch-controls { display: flex; }
            .hud-card-exit { display: none; }
            .hearts-grid { gap: 2px; }
            .heart-icon { width: 15px; height: 15px; }
            .belly-capsule { width: 12px; height: 20px; }
            .btn-hud-tech { padding: 4px 10px; font-size: 11px; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- 外置高科技独立实验室机箱边框 -->
    <div class="lab-terminal-bezel">
        <div class="lab-bezel-header">
            <div class="header-title">
                <span>🐉 模式十：逃离实验室 - 变身巨龙 · 吞噬突围</span>
                <span class="header-status-badge">● 活体标本收容监控中</span>
            </div>
            <div class="header-controls">
                <button class="header-btn" onclick="restartLevel()">重新开始</button>
                <a href="index.html" class="header-btn">返回小院</a>
            </div>
        </div>

        <div class="canvas-viewport">
            <canvas id="gameCanvas" width="1280" height="720"></canvas>

            <!-- 闪光层与全屏黑屏字幕过场 -->
            <div id="white-flash"></div>
            <div id="cutscene-overlay">
                <div class="cutscene-subtitle" id="cutsceneSubtitle"></div>
            </div>

            <!-- HUD 战斗界面 -->
            <div class="hud-overlay" id="hudOverlay" style="display: none;">
                <div class="hud-top-console">
                    <!-- 1. 龙血量 (20 HEARTS) -->
                    <div class="hud-card-hearts">
                        <div class="hearts-title-box">
                            <span class="hearts-label">巨龙生命值</span>
                            <span class="hearts-value" id="hpText">20.0 / 20.0</span>
                        </div>
                        <div class="hearts-grid" id="heartsGrid">
                            <!-- 10颗红心由JS生成 -->
                        </div>
                    </div>

                    <!-- 2. 腹中人数 (0/10 BELLY) -->
                    <div class="hud-card-belly">
                        <div class="belly-header">
                            <span>腹中收容</span>
                            <span id="bellyTitle">0 / 10</span>
                        </div>
                        <div class="belly-slots" id="bellySlots">
                            <!-- 10个胶囊槽位动态生成 -->
                        </div>
                        <div class="belly-info-text" id="bellyDigestInfo">肚子空空，请捕食士兵</div>
                    </div>

                    <!-- 3. 终点逃生距离 (LEVEL EXIT) -->
                    <div class="hud-card-exit">
                        <div class="exit-header">
                            <span>撤离防爆门</span>
                            <span id="exitDistText">剩余 4200m</span>
                        </div>
                        <div class="exit-track-bar">
                            <div class="exit-progress-fill" id="exitProgressFill"></div>
                            <span class="exit-dragon-head" id="exitDragonPin">🐉</span>
                        </div>
                    </div>

                    <!-- 控制按钮 -->
                    <div class="hud-actions">
                        <button class="btn-hud-tech" onclick="restartLevel()">重新开始</button>
                        <a href="index.html" class="btn-hud-tech">返回小院</a>
                    </div>
                </div>

                <!-- 底部提示栏 -->
                <div class="hud-bottom-bar">
                    <div class="hint-banner" id="hintBanner">加载中...</div>
                </div>
            </div>

            <!-- 移动端触控按键 -->
            <div class="touch-controls" id="touchControls">
                <div class="touch-dpad">
                    <button class="touch-btn" id="btnTouchLeft">◀</button>
                    <button class="touch-btn" id="btnTouchRight">▶</button>
                </div>
                <div class="touch-dpad">
                    <button class="touch-btn" id="btnTouchJump">跳跃</button>
                    <button class="touch-btn swallow" id="btnTouchSwallow">吞噬</button>
                </div>
            </div>

            <!-- 通关结算弹窗 -->
            <div class="modal-screen" id="clearModal">
                <div class="modal-box">
                    <h2 class="modal-title">🎉 第一关通关！</h2>
                    <p class="modal-desc" id="clearDesc">巨龙成功撞破实验室最后防爆大门，冲出绝密设施！</p>
                    <button class="btn-modal" onclick="restartLevel()">再次挑战</button>
                </div>
            </div>

            <!-- 失败结算弹窗 -->
            <div class="modal-screen" id="gameOverModal">
                <div class="modal-box" style="border-color: #f44336; box-shadow: 0 0 40px rgba(244, 67, 54, 0.5);">
                    <h2 class="modal-title" style="color: #ff5252;">💀 巨龙倒下了！</h2>
                    <p class="modal-desc">血量耗尽（0 / 20.0）。按 R 键或点击下方按钮重新挑战第一关。</p>
                    <button class="btn-modal" style="background: #d32f2f; border-color: #ff8a80;" onclick="restartLevel()">重新开始</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ==========================================
// 🎨 原版动作序列帧贴图载入器 (Sprite Sheet Preloader)
// ==========================================
const labSprites = {};
const labSpriteList = [
    'dragon_walk_0', 'dragon_walk_1', 'dragon_walk_2', 'dragon_walk_3', 'dragon_walk_4', 'dragon_walk_5',
    'dragon_heavy_0', 'dragon_heavy_1', 'dragon_heavy_2', 'dragon_heavy_3',
    'dragon_feed_0', 'dragon_feed_1', 'dragon_explode',
    'blue_cap_0', 'blue_cap_1', 'blue_cap_2', 'blue_cap_3',
    'gray_cap_0', 'gray_cap_1', 'gray_cap_2', 'gray_cap_3',
    'red_orange_cap_0', 'red_orange_cap_1',
    'black_specops_0', 'black_specops_1', 'black_specops_2', 'black_specops_3',
    'swallow_toss', 'swallow_lunge', 'swallow_neck'
];
let labSpritesLoaded = false;
let labSpritesLoadedCount = 0;
labSpriteList.forEach(name => {
    const img = new Image();
    img.src = 'assets/mode10/' + name + '.png';
    img.onload = () => {
        labSpritesLoadedCount++;
        if (labSpritesLoadedCount >= labSpriteList.length) {
            labSpritesLoaded = true;
        }
    };
    labSprites[name] = img;
});

// ==========================================
// 🔊 WEB AUDIO API 工业级声音合成器
// ==========================================
let audioCtx = null;
function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

function playSound(type) {
    try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        if (type === 'laser') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.35);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.35);
        } else if (type === 'cage_break') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(35, now + 0.5);
            gain.gain.setValueAtTime(0.6, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.5);
        } else if (type === 'swallow') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(260, now + 0.18);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.22);
        } else if (type === 'belly_bomb') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(80, now);
            osc.frequency.exponentialRampToValueAtTime(28, now + 0.65);
            gain.gain.setValueAtTime(0.8, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.65);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.65);
        } else if (type === 'shock') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(880, now + 0.05);
            osc.frequency.setValueAtTime(220, now + 0.1);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.18);
        } else if (type === 'fire') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(60, now + 0.28);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.28);
        } else if (type === 'explosion') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(25, now + 0.45);
            gain.gain.setValueAtTime(0.7, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.45);
        } else if (type === 'roar') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.linearRampToValueAtTime(180, now + 0.15);
            osc.frequency.exponentialRampToValueAtTime(45, now + 0.5);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(now + 0.5);
        }
    } catch(e) {}
}

let cutsceneTimeouts = [];
function addCutsceneTimeout(fn, ms) {
    const id = setTimeout(fn, ms);
    cutsceneTimeouts.push(id);
    return id;
}
function clearAllCutsceneTimeouts() {
    cutsceneTimeouts.forEach(id => clearTimeout(id));
    cutsceneTimeouts = [];
}

function showSubtitleSequence(lines, index, onComplete) {
    if (index >= lines.length) {
        if (onComplete) onComplete();
        return;
    }
    cutsceneSubtitle.textContent = lines[index];
    addCutsceneTimeout(() => {
        showSubtitleSequence(lines, index + 1, onComplete);
    }, 1800);
}

function playOpeningCutscene() {
    clearAllCutsceneTimeouts();
    currentState = GameState.CUTSCENE;
    hudOverlay.style.display = 'none';
    clearModal.classList.remove('active');
    gameOverModal.classList.remove('active');
    cutsceneOverlay.style.display = 'flex';
    cutsceneOverlay.style.opacity = '1';
    cutsceneSubtitle.textContent = '';
    whiteFlash.style.opacity = '0';

    // 1. 实验室高压电光束射中人类强闪光
    playSound('laser');
    whiteFlash.style.opacity = '0.95';
    addCutsceneTimeout(() => {
        whiteFlash.style.opacity = '0.0';
    }, 450);

    // 2. 画面变黑，底部白色字幕依次显示
    const lines = [
        "啊，是龙！",
        "快跑！",
        "快把他抓起来！"
    ];

    addCutsceneTimeout(() => {
        showSubtitleSequence(lines, 0, () => {
            playSound('laser');
            whiteFlash.style.opacity = '1.0';
            addCutsceneTimeout(() => {
                cutsceneOverlay.style.display = 'none';
                hudOverlay.style.display = 'flex';
                setupLevel1Entities();
                updateHud();
                whiteFlash.style.opacity = '0.0';

            }, 400);

}

// ==========================================
// 3. 巨龙吞噬核心机制 (优先吃手雷 / 挑起吃人)
// ==========================================
function performDragonSwallow() {
    if (currentState !== GameState.LEVEL_1_ACTIVE) return;

    dragon.swallowAnimTimer = 0.45; // 触发张嘴咬合动作
    const mouthX = dragon.x + (dragon.width * 0.42 * dragon.facing);
    const mouthY = dragon.y - dragon.height * 0.35;

    // 1. 优先低头吃前方地面的手雷 (GRENADE FEEDING 动作)
    for (let i = activeGrenades.length - 1; i >= 0; i--) {
        const g = activeGrenades[i];
        if (!g.swallowed && Math.hypot(g.x - mouthX, g.y - mouthY) <= 240.0) {
            g.swallowed = true;
            dragon.feedingGrenadeTimer = 0.45; // 触发低头贴地咬合动作
            playSound('swallow');
            hintBanner.textContent = "蓝龙低头一口吃掉了手雷！等待肚内引爆消化！";
            return;
        }
    }

    // 2. 没有手雷时，挑起吞人（上限 10 人）
    if (swallowedHumans >= MAX_BELLY_CAPACITY) {
        hintBanner.textContent = "肚子已经装满 10 个人了！快吃颗手雷炸掉消化！";
        return;
    }

    for (let i = activeEnemies.length - 1; i >= 0; i--) {
        const e = activeEnemies[i];
        if (Math.hypot(e.x - mouthX, e.y - mouthY) <= 260.0) {
            // 触发吻部挑起士兵抛空入嘴动效 (1) TOSSING AGENT WITH SNOUT
            dragon.tossedSoldier = {
                x: e.x,
                y: e.y - 20,
                vx: (mouthX - e.x) * 2.5,
                vy: -440,
                rot: 0,
                rotSpeed: (Math.random() > 0.5 ? 1 : -1) * 7.5,
                type: e.type,
                timer: 0.45
            };

            playSound('swallow');
            swallowedHumans++;
            activeEnemies.splice(i, 1);
            updateHud();
            hintBanner.textContent = `挑起咬住并吞下了 1 名士兵！（腹中：${swallowedHumans}/10）`;
            return;
        }
    }
}

// ==========================================
// 4. 物理与逻辑主更新循环
// ==========================================
let lastTime = performance.now();
function updateGame(dt) {
    if (currentState === GameState.LEVEL_1_ACTIVE) {
        // --- A. 巨龙移动与重力 ---
        let dir = 0;
        if (keys.right || keys.autoRun) dir += 1;
        if (keys.left) dir -= 1;

        if (dir !== 0) {
            dragon.facing = dir > 0 ? 1 : -1;
            dragon.stepCount += dt * 9.5;
        }

        // 吞人越多速度越沉重 (与 GDScript 一致)
        const speedFactor = 1.0 - (swallowedHumans * 0.025);
        dragon.vx = dir * dragon.moveSpeed * speedFactor;

        // 重力与跳跃
        dragon.vy += gravity * dt;
        dragon.x += dragon.vx * dt;
        dragon.y += dragon.vy * dt;

        if (dragon.y >= 540.0) {
            dragon.y = 540.0;
            dragon.vy = 0;
            dragon.isOnFloor = true;
        } else {
            dragon.isOnFloor = false;
        }

        if (keys.jump && dragon.isOnFloor) {
            dragon.vy = dragon.jumpVelocity;
            dragon.isOnFloor = false;
            keys.jump = false;
        }

        if (keys.swallow) {
            performDragonSwallow();
            keys.swallow = false;
        }

        // 动作动画衰减
        if (dragon.swallowAnimTimer > 0) dragon.swallowAnimTimer -= dt;
        if (dragon.feedingGrenadeTimer > 0) dragon.feedingGrenadeTimer -= dt;
        if (dragon.bellyBulgeAnim > 0) dragon.bellyBulgeAnim = Math.max(0, dragon.bellyBulgeAnim - dt * 2.8);

        // 挑起吞食士兵物理轨迹
        if (dragon.tossedSoldier) {
            const ts = dragon.tossedSoldier;
            ts.x += ts.vx * dt;
            ts.y += ts.vy * dt;
            ts.vy += gravity * 0.9 * dt;
            ts.rot += ts.rotSpeed * dt;
            ts.timer -= dt;
            if (ts.timer <= 0) {
                dragon.tossedSoldier = null;
            }
        }

        // --- B. 感电状态与自然消化 ---
        if (electricTicksLeft > 0) {
            electricTickTimer += dt;
            if (electricTickTimer >= 1.0) {
                electricTickTimer -= 1.0;
                electricTicksLeft--;
                applyDamageToDragon(0.5, "电击持续感电伤害 (-0.5)");
                playSound('shock');
            }
        }

        if (swallowedHumans > 0) {
            naturalDigestTimer += dt;
            if (naturalDigestTimer >= NATURAL_DIGEST_INTERVAL) {
                naturalDigestTimer = 0.0;
                swallowedHumans--;
                updateHud();
                hintBanner.textContent = `自然消化了 1 个人！剩余腹中人数：${swallowedHumans}`;
            }
        } else {
            naturalDigestTimer = 0.0;
        }

        // --- C. 沿途士兵 AI 与跑动步频 ---
        activeEnemies.forEach(e => {
            const dist = Math.hypot(dragon.x - e.x, dragon.y - e.y);
            const dirX = Math.sign(dragon.x - e.x);
            e.facing = dirX !== 0 ? dirX : -1;

            if (e.type === EnemyType.BLUE_HAT) {
                // 蓝帽：巡逻走动并用电击枪射击
                e.walkCycle += dt * 5.0;
                if (dist < 420.0) {
                    e.isFiring = true;
                    e.timer += dt;
                    if (e.timer >= 3.0) {
                        e.timer = 0.0;
                        applyDamageToDragon(0.5, "被蓝帽电击枪击中！(-0.5，进入5秒感电)");
                        electricTicksLeft = 5;
                        electricTickTimer = 0.0;
                        playSound('shock');
                    }
                } else {
                    e.isFiring = false;
                }
            } else if (e.type === EnemyType.GRAY_HAT) {
                // 灰帽：冲锋奔跑 (距离 < 600 加速冲向龙)
                if (dist < 600.0) {
                    e.x += dirX * 350.0 * dt;
                    e.walkCycle += dt * 14.0; // 快速跑动腿频
                    // 产生跑动扬尘微粒
                    e.dustTimer = (e.dustTimer || 0) + dt;
                    if (e.dustTimer >= 0.08) {
                        e.dustTimer = 0;
                        activeParticles.push({
                            x: e.x - e.facing * 14,
                            y: e.y - 2,
                            vx: -e.facing * (Math.random() * 80 + 30),
                            vy: -Math.random() * 35,
                            size: Math.random() * 5 + 3,
                            color: 'rgba(180, 205, 230, 0.55)',
                            life: 0.35
                        });
                    }
                } else {
                    e.walkCycle += dt * 4.0;
                }
            } else if (e.type === EnemyType.RED_ORANGE) {
                // 红/橘帽：战术走动与喷火枪
                e.walkCycle += dt * 5.5;
                if (e.flameTimer > 0) e.flameTimer -= dt;
                if (dist < 550.0) {
                    e.timer += dt;
                    if (e.timer >= 3.0) {
                        e.timer = 0.0;
                        e.flameTimer = 0.35;
                        playSound('fire');
                        activeFireballs.push({
                            x: e.x + e.facing * 20,
                            y: e.y - 42,
                            vx: dirX * 380.0
                        });
                    }
                }
            } else if (e.type === EnemyType.BLACK_SPECOPS) {
                // 黑色特种兵：10秒蓄力抛掷高爆手雷
                e.walkCycle += dt * 4.5;
                if (dist < 650.0) {
                    e.timer += dt;
                    if (e.timer >= 10.0) {
                        e.timer = 0.0;
                        activeGrenades.push({
                            x: e.x + e.facing * 22,
                            y: e.y - 45,
                            vx: dirX * 280.0,
                            vy: -320.0,
                            fuse: 5.0,
                            swallowed: false
                        });
                        hintBanner.textContent = "警告！特种兵抛出了手雷，5秒内低头吃掉它！";
                    }
                }
            }
        });

        // --- D. 火焰弹与手雷更新 ---
        for (let i = activeFireballs.length - 1; i >= 0; i--) {
            const fb = activeFireballs[i];
            fb.x += fb.vx * dt;
            if (Math.hypot(fb.x - dragon.x, fb.y - (dragon.y - 70)) < 90.0) {
                applyDamageToDragon(1.0, "被火焰弹击中！(-1.0 血)");
                activeFireballs.splice(i, 1);
            } else if (Math.abs(fb.x - dragon.x) > 1200.0) {
                activeFireballs.splice(i, 1);
            }
        }

        for (let i = activeGrenades.length - 1; i >= 0; i--) {
            const g = activeGrenades[i];
            g.fuse -= dt;

            if (g.swallowed) {
                // 跟随龙移动在龙腹内
                g.x = dragon.x - 20;
                g.y = dragon.y - 45;
            } else {
                // 空中抛物线落地
                if (g.y < 530.0) {
                    g.vy += gravity * dt;
                    g.y += g.vy * dt;
                    g.x += g.vx * dt;
                } else {
                    g.y = 530.0;
                    g.vx *= 0.85;
                }
            }

            // 引爆
            if (g.fuse <= 0.0) {
                if (g.swallowed) {
                    triggerBellyGrenadeExplosion();
                } else {
                    playSound('explosion');
                    if (Math.hypot(g.x - dragon.x, g.y - dragon.y) <= 220.0) {
                        applyDamageToDragon(5.0, "手雷在身边爆炸！受到 5.0 点巨额伤害！");
                    }
                }
                activeGrenades.splice(i, 1);
            }
        }

        // --- E. 终点判定 ---
        if (dragon.x >= FINISH_LINE_X) {
            currentState = GameState.LEVEL_CLEAR;
            clearModal.classList.add('active');
            hintBanner.textContent = "恭喜通关！巨龙冲破防爆大门，成功逃离第一层实验室！";
        }

        // 摄像机平滑跟随
        cameraX += (dragon.x - 380 - cameraX) * 0.12;

        // 更新终点距离
        const distLeft = Math.max(0, Math.round(FINISH_LINE_X - dragon.x));
        exitDistText.textContent = `剩余 ${distLeft}m`;
        const prog = Math.min(100, Math.max(0, (dragon.x - 220) / (FINISH_LINE_X - 220) * 100));
        exitProgressFill.style.width = `${prog}%`;
    }

    // 粒子更新
    for (let i = activeParticles.length - 1; i >= 0; i--) {
        const p = activeParticles[i];
        p.x += (p.vx || 0) * dt;
        p.y += (p.vy || 0) * dt;
        p.life -= dt;
        if (p.life <= 0) activeParticles.splice(i, 1);
    }
}

// ==========================================
// 5. 渲染循环 (2D 画布高保真复刻设计图)
// ==========================================
function renderGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 实验室科幻背景长廊与工作站
    drawLabBackground();

    ctx.save();
    ctx.translate(-cameraX, 0);

    // 2. 牢笼 (破笼前完整高压牢笼，破笼后展示扭曲破裂残骸)
    drawCage();

    // 3. 终点防爆门 (Finish Line Bulkhead)
    drawFinishLine();

    // 4. 投掷物 (火焰弹、手雷)
    drawProjectiles();

    // 5. 敌人走动与攻击绘制
    drawEnemies();

    // 6. 巨龙绘制 (10倍大、四足奔跑、翅膀、角瞳、腹部动态鼓胀)
    drawBlueDragon();

    // 7. 挑起吞食士兵动画
    drawTossedSoldier();

    // 8. 粒子微粒绘制
    drawParticles();

    ctx.restore();
}

// 绘制明亮高科技实验室背景 (对齐原图第3部分：白银冷钢墙面与计算机监视站)
function drawLabBackground() {
    // 实验室上部明亮冷钢银蓝渐变墙面
    const bgGrad = ctx.createLinearGradient(0, 0, 0, 540);
    bgGrad.addColorStop(0, '#e3edf7');
    bgGrad.addColorStop(0.3, '#d2e2f0');
    bgGrad.addColorStop(0.85, '#bcd0e4');
    bgGrad.addColorStop(1, '#a6bed4');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, 540);

    // 顶部结构天花板与灯管管道
    ctx.fillStyle = '#8ea4ba';
    ctx.fillRect(0, 0, canvas.width, 55);
    ctx.fillStyle = '#00b0ff';
    ctx.fillRect(0, 53, canvas.width, 2);

    // 悬挂荧光冷白灯管
    const startLight = Math.floor(cameraX / 280) * 280;
    for (let lx = startLight - cameraX; lx < canvas.width + 280; lx += 280) {
        ctx.fillStyle = '#5c738a';
        ctx.fillRect(lx + 40, 16, 120, 8);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#80d8ff';
        ctx.shadowBlur = 10;
        ctx.fillRect(lx + 45, 24, 110, 6);
        ctx.shadowBlur = 0;
    }

    // 模块化白钢隔板接缝与金属压条
    const startCol = Math.floor(cameraX / 180) * 180;
    ctx.strokeStyle = '#8da4ba';
    ctx.lineWidth = 2;
    for (let x = startCol - cameraX; x < canvas.width + 180; x += 180) {
        ctx.beginPath();
        ctx.moveTo(x, 55);
        ctx.lineTo(x, 540);
        ctx.stroke();

        // 工业六角螺栓
        ctx.fillStyle = '#6b8299';
        for (let y = 85; y < 530; y += 85) {
            ctx.beginPath();
            ctx.arc(x + 8, y, 2.5, 0, Math.PI * 2);
            ctx.arc(x - 8, y, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // 墙壁中段水平线缆槽压条
    ctx.fillStyle = '#7a92a8';
    ctx.fillRect(0, 160, canvas.width, 5);
    ctx.fillRect(0, 440, canvas.width, 5);

    // 墙面仪器与工作站监视屏 (动态示波器波形与状态指示)
    const nowMs = performance.now();
    const startStation = Math.floor(cameraX / 560) * 560;
    for (let sx = startStation - cameraX; sx < canvas.width + 560; sx += 560) {
        // 双显示器机架
        ctx.fillStyle = '#37474f';
        ctx.strokeStyle = '#0288d1';
        ctx.lineWidth = 3;
        ctx.strokeRect(sx + 50, 195, 145, 95);
        ctx.fillRect(sx + 50, 195, 145, 95);

        // 监视器内部示波器深邃视窗
        ctx.fillStyle = '#02101e';
        ctx.fillRect(sx + 56, 201, 133, 83);

        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let px = 0; px < 133; px += 4) {
            const py = Math.sin((sx + px) * 0.08 + nowMs * 0.006) * 16 + 242;
            if (px === 0) ctx.moveTo(sx + 56 + px, py);
            else ctx.lineTo(sx + 56 + px, py);
        }
        ctx.stroke();

        // 附属机箱与闪烁指示灯
        ctx.fillStyle = '#455a64';
        ctx.fillRect(sx + 208, 215, 48, 75);
        ctx.fillStyle = (Math.sin(nowMs * 0.005 + sx) > 0) ? '#00e676' : '#263238';
        ctx.beginPath(); ctx.arc(sx + 222, 230, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = (Math.cos(nowMs * 0.007 + sx) > 0) ? '#ff9100' : '#263238';
        ctx.beginPath(); ctx.arc(sx + 238, 230, 4, 0, Math.PI * 2); ctx.fill();
    }

    // 高架钢桁架地面 (Y: 540 ~ 720)
    // 1. 行走钢板台面
    ctx.fillStyle = '#546e7a';
    ctx.fillRect(0, 540, canvas.width, 180);
    ctx.fillStyle = '#78909c';
    ctx.fillRect(0, 540, canvas.width, 6);

    // 2. 黄黑相间安全警戒条纹
    const stripeOffset = -cameraX % 36;
    ctx.fillStyle = '#ffb300';
    for (let x = stripeOffset - 36; x < canvas.width + 36; x += 36) {
        ctx.beginPath();
        ctx.moveTo(x, 546);
        ctx.lineTo(x + 18, 546);
        ctx.lineTo(x + 6, 560);
        ctx.lineTo(x - 12, 560);
        ctx.closePath();
        ctx.fill();
    }
    ctx.fillStyle = '#212121';
    for (let x = stripeOffset - 36; x < canvas.width + 36; x += 36) {
        ctx.beginPath();
        ctx.moveTo(x + 18, 546);
        ctx.lineTo(x + 36, 546);
        ctx.lineTo(x + 24, 560);
        ctx.lineTo(x + 6, 560);
        ctx.closePath();
        ctx.fill();
    }

    // 3. 底部 X 型钢桁架支撑梁 (X-Bracing Trusses)
    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 4;
    for (let x = startCol - cameraX; x < canvas.width + 180; x += 180) {
        // 立柱
        ctx.fillStyle = '#263238';
        ctx.fillRect(x - 8, 560, 16, 160);

        // X型斜撑交叉
        ctx.beginPath();
        ctx.moveTo(x + 8, 565);
        ctx.lineTo(x + 172, 715);
        ctx.moveTo(x + 172, 565);
        ctx.lineTo(x + 8, 715);
        ctx.stroke();

        // 节点连接圆板
        ctx.fillStyle = '#455a64';
        ctx.beginPath();
        ctx.arc(x + 90, 640, 9, 0, Math.PI * 2);
        ctx.fill();
    }
}

// 绘制牢笼与破笼残骸
function drawCage() {
    ctx.save();
    if (!cage.broken) {
        // 破笼前：完整高压电磁锁牢笼
        ctx.strokeStyle = '#37474f';
        ctx.lineWidth = 6;
        ctx.strokeRect(cage.x - cage.w / 2, cage.y - cage.h, cage.w, cage.h);

        // 竖向栏杆
        ctx.lineWidth = 4.5;
        for (let x = cage.x - cage.w / 2 + 25; x < cage.x + cage.w / 2; x += 28) {
            ctx.beginPath();
            ctx.moveTo(x, cage.y - cage.h);
            ctx.lineTo(x, cage.y);
            ctx.stroke();
        }

        // 顶部高压警戒锁球
        ctx.fillStyle = '#d50000';
        ctx.beginPath();
        ctx.arc(cage.x, cage.y - cage.h, 14, 0, Math.PI * 2);
        ctx.fill();
    } else {
        // 破笼后：断裂扭曲的金属栏杆残骸
        ctx.strokeStyle = '#37474f';
        ctx.lineWidth = 5;

        // 左侧残余门柱
        ctx.beginPath();
        ctx.moveTo(cage.x - cage.w / 2, cage.y);
        ctx.lineTo(cage.x - cage.w / 2, cage.y - cage.h);
        ctx.lineTo(cage.x - cage.w / 2 + 80, cage.y - cage.h);
        ctx.stroke();

        // 被巨龙冲撞弯曲爆裂的栏杆
        const brokenBars = [
            { sx: cage.x - 120, ex: cage.x - 150, ey: cage.y - 110 },
            { sx: cage.x - 90, ex: cage.x - 125, ey: cage.y - 85 },
            { sx: cage.x - 60, ex: cage.x - 98, ey: cage.y - 60 },
            { sx: cage.x + 40, ex: cage.x + 90, ey: cage.y - 75 },
            { sx: cage.x + 80, ex: cage.x + 135, ey: cage.y - 95 },
            { sx: cage.x + 120, ex: cage.x + 165, ey: cage.y - 130 }
        ];

        brokenBars.forEach(b => {
            ctx.beginPath();
            ctx.moveTo(b.sx, cage.y);
            ctx.lineTo(b.ex, b.ey);
            ctx.stroke();
        });
    }
    ctx.restore();
}

// 绘制终点厚重防爆大门
function drawFinishLine() {
    ctx.save();
    // 门体框
    ctx.fillStyle = '#263238';
    ctx.fillRect(FINISH_LINE_X - 20, 80, 80, 460);
    ctx.strokeStyle = '#00e676';
    ctx.lineWidth = 3.5;
    ctx.strokeRect(FINISH_LINE_X - 20, 80, 80, 460);

    // 机械锁轮
    ctx.fillStyle = '#455a64';
    ctx.beginPath();
    ctx.arc(FINISH_LINE_X + 20, 310, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#b0bec5';
    ctx.lineWidth = 4;
    ctx.stroke();

    // 门顶逃生 EXIT 警示牌
    ctx.fillStyle = '#00c853';
    ctx.font = 'bold 22px monospace';
    ctx.fillText("逃离出口", FINISH_LINE_X - 25, 65);
    ctx.restore();
}

// ==========================================
// 绘制巨龙 (高保真原版动作序列贴图与帧循环)
// ==========================================
function drawBlueDragon() {
    ctx.save();
    ctx.translate(dragon.x, dragon.y);
    ctx.scale(dragon.facing, 1);

    const isMoving = Math.abs(dragon.vx) > 10;
    const idleBob = (!isMoving && dragon.isOnFloor) ? Math.sin(performance.now() * 0.003) * 2.5 : 0;

    let spriteKey = null;
    let sScale = 2.4;
    let offsetX = 0;
    let offsetY = 0;

    // 1. 肚内手雷闷爆 (BELLY EXPLOSION 闪烁震颤)
    if (dragon.bellyBulgeAnim > 0.05) {
        spriteKey = 'dragon_explode';
        sScale = 2.15;
        offsetX = (Math.random() - 0.5) * 5 * dragon.bellyBulgeAnim;
        offsetY = (Math.random() - 0.5) * 5 * dragon.bellyBulgeAnim;
    }
    // 2. 贴地吃手雷 (GRENADE FEEDING 动作)
    else if (dragon.feedingGrenadeTimer > 0) {
        spriteKey = (dragon.feedingGrenadeTimer > 0.22) ? 'dragon_feed_0' : 'dragon_feed_1';
        sScale = 1.65;
    }
    // 3. 挑起吞人吞咽动作 (SWALLOWING SEQUENCE)
    else if (dragon.swallowAnimTimer > 0) {
        if (dragon.swallowAnimTimer < 0.22 && labSprites['swallow_neck']) {
            spriteKey = 'swallow_neck';
            sScale = 1.85;
            offsetX = -30;
            offsetY = -25;
        } else if (labSprites['swallow_lunge']) {
            spriteKey = 'swallow_lunge';
            sScale = 2.2;
        } else {
            spriteKey = (swallowedHumans >= 5) ? 'dragon_heavy_0' : 'dragon_walk_0';
        }
    }
    // 4. 腹中吃满/饱腹 (FULL BELLY: 5~10 人, 沉甸下垂饱满巨肚, 严格四足基底不触地)
    else if (swallowedHumans >= 5) {
        const frameIdx = isMoving ? (Math.floor(dragon.stepCount * 0.8) % 4) : 0;
        spriteKey = 'dragon_heavy_' + frameIdx;
        sScale = 2.15;
    }
    // 5. 正常奔跑行进步态 (NORMAL WALK CYCLE: 6 帧真实手绘动作切换)
    else {
        const frameIdx = isMoving ? (Math.floor(dragon.stepCount * 1.1) % 6) : 0;
        spriteKey = 'dragon_walk_' + frameIdx;
        sScale = 2.4;
    }

    const spr = labSprites[spriteKey];
    if (spr && spr.complete && spr.naturalWidth > 0) {
        const sw = spr.naturalWidth * sScale;
        const sh = spr.naturalHeight * sScale;

        // 手雷闷爆时腹部高能电火花光晕
        if (dragon.bellyBulgeAnim > 0.05) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(-20 + offsetX, -sh * 0.45 + offsetY, 55 * dragon.bellyBulgeAnim, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 170, 0, ${0.4 * dragon.bellyBulgeAnim})`;
            ctx.shadowColor = '#ff9100';
            ctx.shadowBlur = 25 * dragon.bellyBulgeAnim;
            ctx.fill();
            ctx.restore();
        }

        // 绘制巨龙身体，底端精准贴合地面
        ctx.drawImage(spr, -sw / 2 + offsetX, -sh + idleBob + offsetY, sw, sh);
    } else {
        // 降级绘制
        drawBlueDragonVector();
    }

    ctx.restore();
}

function drawBlueDragonVector() {
    const step = dragon.stepCount;
    const isMoving = Math.abs(dragon.vx) > 10;
    const bellyBonus = 1.0 + (dragon.bellyBulgeAnim * 0.45);
    const bobY = isMoving ? Math.sin(step * 2) * 3.5 : Math.sin(performance.now() * 0.003) * 1.5;

    // 躯干主龙身
    ctx.fillStyle = '#1565c0';
    ctx.beginPath();
    ctx.ellipse(0, -60 + bobY, 120, 52 * bellyBonus, 0, 0, Math.PI * 2);
    ctx.fill();

    // 头部
    ctx.fillStyle = '#1976d2';
    ctx.beginPath();
    ctx.moveTo(70, -70 + bobY);
    ctx.lineTo(130, -50 + bobY);
    ctx.lineTo(70, -30 + bobY);
    ctx.closePath();
    ctx.fill();

    // 翅膀
    ctx.fillStyle = '#1976d2';
    ctx.beginPath();
    ctx.moveTo(0, -70 + bobY);
    ctx.lineTo(-60, -160 + bobY);
    ctx.lineTo(-20, -50 + bobY);
    ctx.closePath();
    ctx.fill();
}

// 绘制抛空被吞食士兵动效 (对齐原图 (1) TOSSING AGENT WITH SNOUT)
function drawTossedSoldier() {
    if (!dragon.tossedSoldier) return;
    const ts = dragon.tossedSoldier;
    ctx.save();
    ctx.translate(ts.x, ts.y);
    ctx.rotate(ts.rot);

    const spr = labSprites['swallow_toss'];
    if (spr && spr.complete && spr.naturalWidth > 0) {
        const sw = spr.naturalWidth * 1.05;
        const sh = spr.naturalHeight * 1.05;
        ctx.drawImage(spr, -sw / 2, -sh / 2, sw, sh);
    } else {
        drawTossedSoldierVector(ts);
    }
    ctx.restore();
}

function drawTossedSoldierVector(ts) {
    let uniformColor = '#1d4ed8';
    let capColor = '#1e40af';
    if (ts.type === EnemyType.GRAY_HAT) {
        uniformColor = '#94a3b8'; capColor = '#64748b';
    } else if (ts.type === EnemyType.RED_ORANGE) {
        uniformColor = '#ea580c'; capColor = '#ea580c';
    } else if (ts.type === EnemyType.BLACK_SPECOPS) {
        uniformColor = '#1e293b'; capColor = '#0f172a';
    }
    ctx.fillStyle = uniformColor; ctx.fillRect(-10, -18, 20, 26);
    ctx.fillStyle = '#fed7aa'; ctx.beginPath(); ctx.arc(0, -26, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = capColor; ctx.fillRect(-10, -35, 20, 9);
}

// ==========================================
// 绘制敌兵独立兵种 (蓝帽电击枪、灰帽冲锋、红帽喷火、黑色特种兵)
// ==========================================

function drawBlueCapSoldierVector(e, ctx) {
    ctx.fillStyle = '#1d4ed8'; ctx.fillRect(-12, -58, 24, 34);

function drawGrayCapRunner(e, ctx) {

            });

        drawGrayCapRunnerVector(e, ctx);

}

function drawGrayCapRunnerVector(e, ctx) {
    ctx.fillStyle = '#94a3b8'; ctx.fillRect(-12, -58, 24, 34);

function drawRedOrangeCapFlamer(e, ctx) {

}

function drawRedOrangeCapFlamerVector(e, ctx) {

}

function drawBlackSpecopsGrenadier(e, ctx) {
    let spriteKey = 'black_specops_0';
    let sScale = 1.12;

    if (e.timer >= 8.2) {
        if (e.timer < 8.8) {

    const spr = labSprites[spriteKey];
    if (spr && spr.complete && spr.naturalWidth > 0) {
        const sw = spr.naturalWidth * sScale;
        const sh = spr.naturalHeight * sScale;
        ctx.drawImage(spr, -sw / 2, -sh, sw, sh);
    } else {
        drawBlackSpecopsGrenadierVector(e, ctx);
    }
}

function drawBlackSpecopsGrenadierVector(e, ctx) {
    ctx.fillStyle = '#1e293b'; ctx.fillRect(-13, -58, 26, 34);
    ctx.fillStyle = '#0f172a'; ctx.fillRect(-13, -78, 26, 18);
    ctx.fillStyle = '#22c55e'; ctx.fillRect(3, -69, 12, 4.5);
}

function drawEnemies() {
    activeEnemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.scale(e.facing, 1);

        if (e.type === EnemyType.BLUE_HAT) {
            drawBlueCapSoldier(e, ctx);
        } else if (e.type === EnemyType.GRAY_HAT) {
            drawGrayCapRunner(e, ctx);
        } else if (e.type === EnemyType.RED_ORANGE) {
            drawRedOrangeCapFlamer(e, ctx);
        } else if (e.type === EnemyType.BLACK_SPECOPS) {
            drawBlackSpecopsGrenadier(e, ctx);
        }

        ctx.restore();
    });
}

// 绘制投掷物 (火焰弹、绿手雷)
function drawProjectiles() {
    // 1. 火焰弹 (高能燃烧尾焰)
    activeFireballs.forEach(fb => {
        ctx.save();
        ctx.translate(fb.x, fb.y);
        ctx.fillStyle = '#ff3d00';
        ctx.shadowColor = '#ff6d00';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(0, 0, 11, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
    });

    // 2. 手雷 (绿色菠萝手雷与引信倒计时)
    activeGrenades.forEach(g => {
        if (g.swallowed) return; // 吞进肚子后隐藏
        ctx.save();
        ctx.translate(g.x, g.y);

        // 橄榄绿手雷弹体
        ctx.fillStyle = '#33691e';
        ctx.beginPath();
        ctx.ellipse(0, 0, 9, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1b5e20';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 弹片网格刻线
        ctx.fillStyle = '#558b2f';
        ctx.fillRect(-6, -6, 12, 3);
        ctx.fillRect(-6, 0, 12, 3);

        // 金属保险栓与引信红光急促闪烁
        ctx.fillStyle = (Math.sin(performance.now() * 0.03) > 0) ? '#ff1744' : '#ffffff';
        ctx.fillRect(-2, -16, 4, 6);

        // 倒计时提示
        ctx.fillStyle = '#d50000';
        ctx.font = 'bold 12px monospace';
        ctx.fillText(g.fuse.toFixed(1) + "s", -12, -20);
        ctx.restore();
    });
}

// 绘制粒子
function drawParticles() {
    activeParticles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

// ==========================================
// 6. HUD 更新逻辑 (20 HEARTS + 10 BELLY 槽位)
// ==========================================
function updateHud() {
    hpText.textContent = `${dragonHp.toFixed(1)} / ${DRAGON_MAX_HP.toFixed(1)}`;

    // 20 Hearts (每颗心代表 2.0 生命值)
    for (let i = 0; i < 10; i++) {
        const heart = document.getElementById(`heart-icon-${i}`);
        if (heart) {
            const heartThreshold = (i + 1) * 2.0;
            if (dragonHp >= heartThreshold) {
                heart.classList.remove('lost');
            } else if (dragonHp >= heartThreshold - 1.0) {
                heart.classList.remove('lost');
                heart.style.filter = 'opacity(0.65)';
            } else {
                heart.classList.add('lost');
                heart.style.filter = '';
            }
        }
    }

    bellyTitle.textContent = `${swallowedHumans} / ${MAX_BELLY_CAPACITY}`;
    for (let i = 0; i < 10; i++) {
        const slot = document.getElementById(`belly-slot-${i}`);
        if (slot) {
            if (i < swallowedHumans) slot.classList.add('filled');
            else slot.classList.remove('filled');
        }
    }

    if (swallowedHumans > 0) {
        const leftSec = Math.ceil(NATURAL_DIGEST_INTERVAL - naturalDigestTimer);
        bellyDigestInfo.textContent = `（${leftSec}秒后自然消化1人）`;
    } else {
        bellyDigestInfo.textContent = "肚子空空，请捕食士兵";
    }
}

// 主帧循环
function gameLoop(now) {
    const dt = Math.min(0.06, (now - lastTime) / 1000);
    lastTime = now;

    updateGame(dt);
    renderGame();

    requestAnimationFrame(gameLoop);
}

function skipCutscene() {
    clearAllCutsceneTimeouts();
    cutsceneOverlay.style.display = 'none';
    hudOverlay.style.display = 'flex';
    setupLevel1Entities();
    updateHud();
    whiteFlash.style.opacity = '0.0';
    currentState = GameState.TRAPPED_IN_CAGE;
    hintBanner.textContent = "你已变成巨龙并被困在笼中！按 [J 键] 或 [D 键前冲] 撞破牢笼！";
}

// 暴露全局变量供调试与自动化测试
window.GameState = GameState;
window.EnemyType = EnemyType;
window.getGameState = () => currentState;
window.dragon = dragon;
window.cage = cage;
window.activeEnemies = activeEnemies;
window.activeGrenades = activeGrenades;
window.getActiveEnemies = () => activeEnemies;
window.getActiveGrenades = () => activeGrenades;
window.getActiveFireballs = () => activeFireballs;
window.getDragonHp = () => dragonHp;
window.getSwallowedHumans = () => swallowedHumans;
window.setSwallowedHumans = n => { swallowedHumans = Math.max(0, Math.min(MAX_BELLY_CAPACITY, n)); updateHud(); };
window.performDragonSwallow = performDragonSwallow;
window.breakOutOfCage = breakOutOfCage;
window.skipCutscene = skipCutscene;
window.restartLevel = restartLevel;

// 启动游戏
playOpeningCutscene();
requestAnimationFrame(gameLoop);
</script>
